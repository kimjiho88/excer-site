<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4B2A82" />
  <meta name="robots" content="noindex" />
  <title>페이지를 찾을 수 없습니다 | 동네친구들</title>
  <!-- 잘못된 주소로 들어왔을 때 Vercel 이 404 상태로 내보내는 한 장(정적 배포는 루트의 404.html 을 자동으로 쓴다).
       정상 페이지처럼 보이지 않도록 메뉴·커버 없이 안내 카드 하나. 바깥 파일은 그림 하나뿐이라 못 읽어도 아이콘으로 동작한다 -->
  <style>
    :root { --bg: #F7F5EF; --surface: #FFFFFF; --ink: #241E2C; --ink-2: #625A6C; --brand: #4B2A82; --brand-soft: #EDE7F5; --line: #E3DFE4; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .card { width: min(440px, 100%); padding: 28px 24px 24px; border-radius: 18px; background: var(--surface); border: 1px solid rgba(75, 42, 130, 0.12); box-shadow: 0 20px 44px -28px rgba(46, 27, 69, 0.45); text-align: center; }
    .logo { display: inline-flex; align-items: center; gap: 8px; min-height: 32px; color: var(--brand); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; text-decoration: none; }
    .logo::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); }
    .ic { display: grid; place-items: center; width: 64px; height: 64px; margin: 20px auto 12px; border-radius: 20px; background: var(--brand-soft); color: var(--brand); }
    .ic svg { width: 30px; height: 30px; }
    .ic[hidden] { display: none; }
    /* 길 잃은 골목 그림(2세대 notfound-empty, 3:2). 못 읽으면 위의 아이콘으로 */
    .art { display: block; width: min(300px, 100%); height: auto; aspect-ratio: 3 / 2; margin: 14px auto 6px; border-radius: 14px; background: #F7F6F2; object-fit: cover; }
    .art[hidden] { display: none; }
    @media (forced-colors: active) { .art { border: 1px solid CanvasText; } }
    @media print { .art { display: none; } }
    .code { display: inline-block; margin-top: 12px; padding: 2px 10px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    h1 { margin: 6px 0 0; font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
    p { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; }
    .acts { display: grid; gap: 8px; margin-top: 20px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; text-decoration: none; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: #3A2068; }
    .btn-secondary { background: var(--surface); color: var(--brand); border-color: var(--line); }
    .btn-secondary:hover { background: var(--brand-soft); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 16px; font-size: 13px; }
    .links a { display: inline-flex; align-items: center; min-height: 32px; padding: 0 4px; color: var(--ink-2); text-decoration: none; }
    .links a:hover { color: var(--brand); text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17131C; --surface: #221C2A; --ink: #F1ECF6; --ink-2: #B6AEC0; --brand-soft: #2E2340; --line: #3A3144; }
      .btn-primary { background: #7552A6; }
      .btn-primary:hover { background: #8A67BB; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <a class="logo" href="/index.html">동네친구들</a>
    <img class="art" src="/assets/img/notfound-empty-320.webp" srcset="/assets/img/notfound-empty-320.webp 320w, /assets/img/notfound-empty-640.webp 640w" sizes="300px" width="640" height="427" alt="" decoding="async" onerror="this.hidden = true; document.getElementById('fallbackIc').hidden = false" />
    <div class="ic" id="fallbackIc" aria-hidden="true" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M8 11h6"/></svg>
    </div>
    <span class="code">404</span>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 적혔을 수 있습니다. 링크를 받았다면 보낸 사람에게 다시 확인해 주세요.</p>
    <div class="acts">
      <a class="btn btn-primary" href="/index.html">홈으로</a>
      <a class="btn btn-secondary" href="/news.html">소식 보기</a>
    </div>
    <nav class="links" aria-label="주요 메뉴">
      <a href="/guide.html">이용 안내</a>
      <a href="/places.html">맛집</a>
      <a href="/calculator.html">모임 정산</a>
      <a href="/report.html">활동 통계</a>
    </nav>
  </main>
</body>
</html>
