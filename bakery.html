function renderSheet(){
  if(!SHEET)return;
  if(SHEET.type==="kitchen"){
    const st=SHEET.station,stDef=DATA.balance.stations[st];
    SHEET.sig=kitchenSig(st);
    const emoji=st==="coffee"?(Core.hasCoffeeMachine(DATA,S)?"☕":"🫖"):stDef.emoji;
    const q=S.queues[st],buf=S.buffer[st];
    const nSlots=Core.queueSlots(DATA,S);
    let slots="";
    for(let i=0;i<nSlots;i++){
      const job=q[i];
      if(job){
        const rec=Core.recipeById(DATA,job.r);
        const total=Core.craftSeconds(DATA,S,rec);
        const rem=job.remain==null?total:Math.max(0,job.remain);
        const pct=i===0?Math.min(100,(1-rem/total)*100):0;
        slots+=`<div class="qslot busy"><span class="qe">${rec.emoji}</span><span class="qt">${i===0?fmtDur(rem):"대기"}</span><span class="qp"><i style="width:${pct}%"></i></span></div>`;
      }else slots+=`<div class="qslot"><span class="plus">＋</span></div>`;
    }
    const menus=Core.unlockedRecipes(DATA,S).filter(r=>r.station===st);
    const full=q.length>=nSlots;
    const tabs=Object.entries(DATA.balance.stations)
      .filter(([k,v])=>S.level>=v.unlockLevel)
      .map(([k,v])=>`<button class="stab${k===st?" on":""}" data-station="${k}">${k==="coffee"?(Core.hasCoffeeMachine(DATA,S)?"☕":"🫖"):v.emoji}<small>${v.name}</small>${S.queues[k]&&S.queues[k].length?'<i class="qb">'+S.queues[k].length+'</i>':""}</button>`).join("");
    openSheet(`${Object.keys(DATA.balance.stations).filter(k=>S.level>=DATA.balance.stations[k].unlockLevel).length>1?`<div class="stabs">${tabs}</div>`:""}<h4 class="hd-kitchen">${emoji} ${stDef.name}${st==="coffee"&&Core.hasCoffeeMachine(DATA,S)?" <span style='font-size:10px;color:var(--green)'>머신 설치됨</span>":""}
      <button class="x" data-close>닫기 ✕</button></h4>
      <div class="qrow">${slots}</div>
      ${buf?`<div class="blocked" style="margin-bottom:9px">📦 ${Core.recipeById(DATA,buf.r).emoji} ${buf.n}개가 진열 공간 대기 중 — 진열대를 업그레이드하세요!</div>`:""}
      <div class="menu-btns">${menus.map(r=>{
        const t=Core.craftSeconds(DATA,S,r);
        const pct=Core.masteryBonusPct(DATA,S,r.id);
        const tier=pct>=15?3:pct>=10?2:pct>=5?1:0;
        const stars="★".repeat(1+tier)+"☆".repeat(3-tier);
        const spec=S.daily.special===r.id;
        return `<button class="mbtn${spec?" special":""}" data-bake="${r.id}" ${full?"disabled":""} id="bake-${r.id}">
          ${spec?'<span class="spbadge">⭐ 오늘의 메뉴</span>':""}
          <span class="me">${r.emoji}</span><span class="mn">${r.name}</span><span class="stars">${stars}</span><span class="mi">${r.batch}개 · ${fmtDur(t)}</span></button>`;
      }).join("")}</div>`);
  }
  else if(SHEET.type==="stock"){
    const un=Core.unlockedRecipes(DATA,S);
    openSheet(`<h4 class="hd-stock">🧺 진열대 <span style="font-size:10.5px;color:var(--mut)">${Core.totalStock(S)}/${Core.stockCap(DATA,S)}개 · 오프라인 판매 상한</span>
      <button class="x" data-close>닫기 ✕</button></h4>
      ${un.map(r=>`<div class="rowitem"><div class="re">${r.emoji}</div>
        <div><div class="rn">${r.name}</div><div class="rd">개당 🪙${Core.unitPrice(DATA,S,r)} · 누적 판매 ${S.sold[r.id]||0}개</div></div>
        <b style="font-size:16px;color:var(--brown)">${S.stock[r.id]||0}</b></div>`).join("")}`);
  }
  else if(SHEET.type==="upgrade"){
    const mkRow=e=>{
      const locked=S.level<e.unlockLevel;
      const lv=Core.equipLevel(S,e.id);
      const cost=Core.upgradeCost(DATA,e.id,lv);
      const btn=locked?`<button class="rb" disabled>Lv.${e.unlockLevel} 해금</button>`
        :cost==null?`<button class="rb max" disabled>최대</button>`
        :`<button class="rb" data-up="${e.id}" ${S.coins<cost?"disabled":""}>🪙 ${fmt(cost)}</button>`;
      return `<div class="rowitem${locked?" dim":""}">
        <div class="re">${e.emoji}<span class="elv">Lv.${lv}</span></div>
        <div><div class="rn">${locked?"???":e.name}</div><div class="rd">${e.effectPerLevelLabel}${e.id==="display"?` · 상한 ${Core.stockCap(DATA,S)}개`:""}</div></div>${btn}</div>`;
    };
    const rows=DATA.equipment.equipment.filter(e=>e.kind!=="staff").map(mkRow).join("");
    const staffRows=DATA.equipment.equipment.filter(e=>e.kind==="staff").map(mkRow).join("");
    const gsteps=DATA.balance.grades.list.map(x=>
      `<div class="gstep${x.minLevel<=S.level?" onx":""}"><span class="gdot"></span>${x.emoji} ${x.name}<span style="margin-left:auto;font-size:10px">Lv.${x.minLevel}</span></div>`).join("");
    openSheet(`<h4 class="hd-upgrade">🛠 성장 <button class="x" data-close>닫기 ✕</button></h4>
      <div class="subhead" style="margin-top:0">🏗️ 설비</div>${rows}
      <div class="subhead">👨‍🍳 직원 — 교육할수록 제작이 빨라져요</div>${staffRows}
      <div class="subhead">🏆 빵집 등급</div>${gsteps}`);
  }
  else if(SHEET.type==="quest"){
    const rows=DATA.balance.quests.daily.map(q=>{
      const st=questState(q);if(!st)return "";
      const done=st.cur>=st.tgt,claimed=!!S.daily.claimed[q.id];
      return `<div class="rowitem"><div class="re">${st.icon}</div>
        <div><div class="rn">${st.label}</div>
        <div class="rd">🪙${q.rewardCoins} · XP ${q.rewardXp} · ⭐${q.rewardRep} — ${Math.min(st.cur,st.tgt)}/${st.tgt}</div>
        <div class="qbar"><i style="width:${Math.min(100,st.cur/st.tgt*100)}%"></i></div></div>
        <button class="rb ${claimed?"claimed":"green"}" data-claim="${q.id}" ${(!done||claimed)?"disabled":""}>${claimed?"완료":"받기"}</button></div>`;
    }).join("");
    const ac=DATA.balance.quests.allClear;
    const acDone=allQuestsDone(),acClaimed=!!S.daily.claimed.allclear;
    const acRow=ac?`<div class="rowitem allclear"><div class="re">🎁</div>
      <div><div class="rn">올클리어 보너스 상자</div>
      <div class="rd">5개 퀘스트 모두 완료 시 — 🪙${ac.rewardCoins} · XP ${ac.rewardXp} · ⭐${ac.rewardRep}</div></div>
      <button class="rb ${acClaimed?"claimed":"green"}" data-claim="__allclear" ${(!acDone||acClaimed)?"disabled":""}>${acClaimed?"완료":"받기"}</button></div>`:"";
    // 📦 단체 주문 보드 (Lv.6+) — 재고로 납품하면 프리미엄 보상
    let orderRows="";

      const today=kstDateStr(nowSec());
      orderRows=`<div class="subhead">📦 단체 주문 <span style="font-weight:400">— 재고로 납품하면 정가보다 후한 값 (매일 새 주문)</span></div>`;
      for(let i=0;i<nSlots;i++){
        const od=Core.genOrder(DATA,S,today,i);
        if(!od)continue;
        const done=S.daily.orders&&S.daily.orders[i];
        const can=Core.canFulfill(S,od);
        const lines=od.lines.map(L=>{
          const r=Core.recipeById(DATA,L.id);
          const have=S.stock[L.id]||0;
          return `${r.emoji} ${r.name} <b style="color:${have>=L.qty?"var(--green)":"var(--red)"}">${Math.min(have,L.qty)}/${L.qty}</b>`;
        }).join(" · ");
        orderRows+=`<div class="rowitem${done?" dim":""}"><div class="re">${["🚚","🛵","🚛"][i]||"📦"}</div>
          <div><div class="rn">${lines}</div>
          <div class="rd">보상 🪙${fmt(od.rewardCoins)} · XP ${od.rewardXp} · ⭐${od.rewardRep}</div></div>
          <button class="rb ${done?"claimed":"green"}" data-order="${i}" ${(done||!can)?"disabled":""}>${done?"납품 완료":"납품"}</button></div>`;
      }
    }
    openSheet(`<h4 class="hd-quest">📋 미션 <span style="font-size:10px;color:var(--mut)">매일 자정(KST) 리셋</span><button class="x" data-close>닫기 ✕</button></h4>${rows}${acRow}${orderRows}`);
  }
}

function specialRecipe(){return S.daily.special?Core.recipeById(DATA,S.daily.special):null;}
function questState(q){
  if(q.type==="sell_any")return {cur:S.daily.sold,tgt:q.target,label:q.name.replace("{n}",q.target),icon:"🧾"};
  if(q.type==="sell_special"){const m=specialRecipe();return m?{cur:S.daily.soldBy[m.id]||0,tgt:q.target,label:"⭐ "+m.emoji+" "+m.name+" "+q.target+"개 판매",icon:"⭐"}:null;}
  if(q.type==="bake")return {cur:S.daily.baked||0,tgt:q.target,label:q.name.replace("{n}",q.target),icon:"🥖"};
  if(q.type==="collect_tips")return {cur:S.daily.tipCollects||0,tgt:q.target,label:q.name.replace("{n}",q.target),icon:"💰"};
  if(q.type==="upgrade")return {cur:S.daily.upgrades,tgt:q.target,label:q.name,icon:"🛠"};
  return null;
}
function allQuestsDone(){
  return DATA.balance.quests.daily.every(q=>{const st=questState(q);return st&&S.daily.claimed[q.id];});
}
/* ----- 개인 기록/주간 집계 (랭킹 패널 데이터) ----- */
function weekKeyOf(dateStr){ // 해당 주 월요일(KST)
  const d=new Date(dateStr+"T00:00:00Z");
  const dow=(d.getUTCDay()+6)%7; // 월=0
  return new Date(d.getTime()-dow*86400000).toISOString().slice(0,10);
}
function ensureRecords(){
  S.records=S.records||{bestSoldDay:0,bestCoinsDay:0,maxStreak:0};
  const wk=weekKeyOf(kstDateStr(nowSec()));
  if(!S.week||S.week.key!==wk)S.week={key:wk,sold:0,coins:0};
}
function rollRecords(){ // 하루가 넘어갈 때: 어제 성적을 기록/주간/히스토리에 반영
  ensureRecords();
  const r=S.records;
  r.bestSoldDay=Math.max(r.bestSoldDay,S.daily.sold||0);
  r.bestCoinsDay=Math.max(r.bestCoinsDay,S.daily.coinsEarned||0);
  const wk=weekKeyOf(S.daily.date||kstDateStr(nowSec()));
  if(S.week&&S.week.key===wk){S.week.sold+=S.daily.sold||0;S.week.coins+=S.daily.coinsEarned||0;}
  // 최근 7일 매출 히스토리 (매장 현황 그래프)
  if(S.daily.date){
    S.hist=(S.hist||[]).filter(h=>h.d!==S.daily.date);
    S.hist.push({d:S.daily.date,sold:S.daily.sold||0,coins:S.daily.coinsEarned||0});
    if(S.hist.length>7)S.hist=S.hist.slice(-7);
  }
}
function repTitle(){
  const ts=(DATA.balance.reputation.titles||[]);
  let t=ts[0]||{name:""};
  for(const x of ts)if(S.rep>=x.rep)t=x;
  return t.name;
}
function checkDailyReset(){
  const today=kstDateStr(nowSec());
  if(S.daily.date!==today){rollRecords();Core.resetDaily(S,today,DATA);ensureRecords();if(SHEET&&SHEET.type==="quest")renderSheet();renderHeader();}
  if(!S.daily.special){S.daily.special=Core.pickDailySpecial(DATA,S,today);renderHeader();} // 구버전 세이브 백필
  ensurePetGrant();
  // 출석: 하루 1회 (FTUE 중엔 미루기 — 다음 날부터)
  if(S.ftue&&S.ftue.done){
    const att=Core.claimAttendance(DATA,S,today);
    if(att){
      ensureRecords();
      S.records.maxStreak=Math.max(S.records.maxStreak,att.streak);
      Snd.play("done");showAttendance(att);queueLevelUps(att.levelUps);renderHeader();saveLocal();
    }
  }
}

/* ===================================================================
   손님 액터 (아이러브커피식 동선: 문 → 줄 → 주문 → 착석/포장 → 퇴장)
   =================================================================== */
let actors=[],pendingSales=[],spawnAcc=0,saleFlashUntil=0;
const SPEED=52; // px/s (씬 좌표계)
function pickCustomer(){
  const bal=DATA.balance.customers;
  const members=DATA.members.members.filter(m=>m.unlockLevel<=S.level);
  if(members.length&&Math.random()<bal.memberShare){
    const tw=members.reduce((a,m)=>a+(m.visitWeight||1),0);
    let r=Math.random()*tw;
    for(const m of members){r-=(m.visitWeight||1);if(r<=0)return {type:"member",m};}
    return {type:"member",m:members[0]};
  }
  const walk=DATA.customers.types.find(t=>t.id==="walkin");
  return {type:"walkin",emoji:walk.emojiPool[Math.floor(Math.random()*walk.emojiPool.length)],lines:walk.lines};
}
function seatSpots(){
  const out=[];
  S.layout.forEach((it,i)=>{
    const f=Core.furnitureById(DATA,it.id);
    if(f&&f.seats>0)for(let s=0;s<f.seats;s++)out.push({key:i+"/"+s,x:it.x,y:it.y,off:s});
  });
  return out;
}
function freeSeat(){
  const taken=new Set(actors.filter(a=>a.seatKey).map(a=>a.seatKey));
  return seatSpots().find(s=>!taken.has(s.key))||null;
}
function queueIndex(a){return actors.filter(x=>x.state==="queue"||x.state==="toqueue").indexOf(a);}
function mkActor(opts){
  const fx=fixtures();
  const c=opts&&opts.customer?opts.customer:pickCustomer();
  const el=document.createElement("div");
  el.className="actor walk";
  let look,extra="",label="";
  if(c.type==="member"){
    // 멤버는 id 시드 → 항상 같은 외모 (members.json에 look 객체를 넣으면 그 값 우선)
    look=(c.m.look&&typeof c.m.look==="object")?c.m.look:Art.lookFromSeed(c.m.id+c.m.nickname);
    const isReg=S.level>=DATA.balance.regulars.unlockLevel&&(S.regulars[c.m.id]||0)>=DATA.balance.regulars.visitsToRegular;
    extra=isReg?'<span class="heart">❤️</span>':"";
    label='<span class="an">'+(c.m.avatar?c.m.avatar+" ":"")+c.m.nickname+"</span>";
  }else{
    look=Art.randomLook();
  }
  const charHtml=c.type==="member"
    ? spriteOr("member_"+c.m.id,Art.charSVG(look,{mood:"happy"}))
    : Art.charSVG(look,{mood:"happy"});
  el.innerHTML=extra+'<span class="charwrap">'+charHtml+"</span>"+label;
  $("#room").appendChild(el);
  const a={el,c,look,x:fx.spawn.x,y:fx.spawn.y,state:"toqueue",wp:[fx.corridor],t:0,seatKey:null,scripted:opts&&opts.scripted};
  // ✨ 황금 손님(6%): 탭하면 보너스 코인 — 화면을 지켜보는 재미
  if(c.type==="walkin"&&!a.scripted&&Math.random()<0.06){
    a.golden=true;el.classList.add("golden");
    const sp=document.createElement("span");sp.className="gspark";sp.textContent="✨";el.appendChild(sp);
  }
  positionActor(a);
  actors.push(a);
  return a;
}
function setMood(a,mood){
  if(a.c.type==="member"&&SPRITES["member_"+a.c.m.id])return; // 이미지 에셋 멤버는 표정 교체 생략
  const w=a.el.querySelector(".charwrap");
  if(w)w.innerHTML=Art.charSVG(a.look,{mood});
}
function positionActor(a){
  a.el.style.left=isoX(a.x,a.y)+"px";
  a.el.style.top=(isoY(a.x,a.y)+TH*0.32)+"px";
  a.el.style.zIndex=Math.round((a.x+a.y)*10+7);
}
function actorSay(a,who,line,ms){
  const bb=document.createElement("div");bb.className="say";
  bb.innerHTML=(who?"<small>"+who+"</small>":"")+line;
  bb.style.left=isoX(a.x,a.y)+"px";bb.style.top=(isoY(a.x,a.y)-30)+"px";
  $("#room").appendChild(bb);
  requestAnimationFrame(()=>bb.classList.add("on"));
  setTimeout(()=>bb.remove(),ms||1900);
}
function removeActor(a){
  a.el.remove();
  actors=actors.filter(x=>x!==a);
}
function stepActors(dt){
  const fx=fixtures();
  for(const a of actors.slice()){
    // 이동 — 목표 접근 시 감속(이징) + 부드러운 방향 전환
    if(a.wp&&a.wp.length){
      const tgt=a.wp[0];
      const tx=isoX(tgt.x,tgt.y),ty=isoY(tgt.x,tgt.y);
      const cx=isoX(a.x,a.y),cy=isoY(a.x,a.y);
      const dx=tx-cx,dy=ty-cy,dist=Math.hypot(dx,dy);
      if(dist<3){a.x=tgt.x;a.y=tgt.y;a.wp.shift();if(!a.wp.length)a.el.classList.remove("walk");}
      else{
        // 마지막 웨이포인트의 접근 구간에서만 감속 → 도착이 자연스러움
        const last=a.wp.length===1;
        const spd=last?SPEED*Math.max(0.35,Math.min(1,dist/26)):SPEED;
        const mv=spd*dt,ratio=Math.min(1,mv/dist);
        a.x+=(tgt.x-a.x)*ratio;a.y+=(tgt.y-a.y)*ratio;
        const wantFlip=tx<cx-2;
        if(a.flip!==wantFlip){a.flip=wantFlip;a.el.classList.toggle("flip",wantFlip);}
        a.el.classList.add("walk");
      }
      positionActor(a);
      continue;
    }
    a.t+=dt;
    if(a.state==="toqueue"){
      // 구경 동선: 스크립트(FTUE) 제외, 70% 확률로 매장 곳곳(진열대·스테이션·가구·펫) 1~2곳 관심
      if(!a.scripted&&a.browse===undefined){
        a.browse=[];
        if(Math.random()<0.7){
          const pois=[];
          pois.push({x:fx.display.x,y:Math.min(ROOM.h-1,fx.display.y+1.2)});
          for(const k of ["oven","coffeebar","juice","brunch","icecream","grill"]){
            const def=DATA.balance.stations[k==="coffeebar"?"coffee":k];
            if(def&&S.level>=def.unlockLevel&&fx[k])pois.push({x:Math.min(ROOM.w-1,fx[k].x+0.8),y:Math.min(ROOM.h-1,fx[k].y+1.2)});
          }
          for(const it of S.layout)if(it.y<ROOM.h)pois.push({x:it.x,y:Math.min(ROOM.h-1,it.y+0.8)});
          for(const pp of PETS)if(pp.y<ROOM.h)pois.push({x:pp.x,y:Math.min(ROOM.h-1,pp.y+0.6)});
          const n=1+(Math.random()<0.4?1:0);
          for(let i=0;i<n&&pois.length;i++)a.browse.push(pois.splice(Math.floor(Math.random()*pois.length),1)[0]);
        }
      }
      if(a.browse&&a.browse.length){
        a.state="browse";a.wp=[a.browse.shift()];a.t=0;continue;
      }
      // 줄 위치 배정
      const qi=Math.min(queueIndex(a),fx.queueSpots.length-1);
      a.state="queue";a.wp=[fx.queueSpots[Math.max(0,qi)]];a.t=0;
    }
    else if(a.state==="browse"){
      if(!a.wp.length){ // 도착: 관심 이모트 + 잠시 구경
        if(!a.browseT){
          a.browseT=1.2+Math.random()*1.6;
          const r=a.el.getBoundingClientRect();
          coinPop(r.left+r.width/2-8,r.top-4,["👀","😍","📸","💭"][Math.floor(Math.random()*4)]);
          a.el.classList.remove("walk");
        }
        a.browseT-=dt;
        if(a.browseT<=0){a.browseT=0;a.state="toqueue";}
      }
    }
    else if(a.state==="queue"){
      const qi=queueIndex(a);
      const spot=fx.queueSpots[Math.min(qi,fx.queueSpots.length-1)];
      if(Math.abs(a.x-spot.x)+Math.abs(a.y-spot.y)>0.2){a.wp=[spot];continue;}
      if(qi===0){
        // 카운터 앞: 판매 이벤트 소비 or 스크립트 구매
        if(a.scripted){a.state="buying";a.t=0;continue;}
        if(pendingSales.length>0){
          a.sale=pendingSales.shift();a.state="buying";a.t=0;
          if(a.want){a.want.remove();a.want=null;}
        }else{
          if(!a.want){
            const un=Core.unlockedRecipes(DATA,S);
            const w=un.length?un[Math.floor(Math.random()*un.length)].emoji:"🥯";
            a.want=document.createElement("span");a.want.className="want";a.want.textContent=w+"?";
            a.el.appendChild(a.want);
          }
          if(a.t>10&&Core.totalStock(S)<=0){ // 소프트 실패: 시무룩하게 떠남
            if(a.want){a.want.remove();a.want=null;}
            setMood(a,"sad");
            actorSay(a,null,"😢 다 팔렸네…",1400);
            a.state="leave";a.wp=[fx.corridor,fx.door,{x:fx.spawn.x,y:fx.spawn.y}];
          }
        }
      }
    }
    else if(a.state==="buying"){
      if(a.t<0.6)continue;
      // 구매 확정 연출
      const recId=a.sale?a.sale.recipeId:(a.scripted?"morning_roll":null);
      const rec=recId?Core.recipeById(DATA,recId):null;
      let who=null,line=rec?(rec.emoji+" 하나 주세요!"):"안녕하세요~";
      if(a.c.type==="member"){
        who=a.c.m.nickname;
        S.seenMembers[a.c.m.id]=(S.seenMembers[a.c.m.id]||0)+1;
        if(S.level>=DATA.balance.regulars.unlockLevel){
          S.regulars[a.c.m.id]=(S.regulars[a.c.m.id]||0)+1;
          if(S.regulars[a.c.m.id]===DATA.balance.regulars.visitsToRegular)
            toast("❤️ "+a.c.m.nickname+"님이 단골이 되었어요!");
        }
        const ls=(a.c.m.lines||[]).filter(x=>x&&!x.startsWith("(운영자"));
        if(ls.length&&Math.random()<0.6)line=ls[Math.floor(Math.random()*ls.length)];
        else if(rec)line=rec.emoji+" "+(["최고예요!","단골 각이에요","향이 좋네요"][Math.floor(Math.random()*3)]);
      }
      actorSay(a,who,line);
      setMood(a,"open"); // 주문하는 입모양
      setTimeout(()=>{if(a.el.isConnected)setMood(a,"happy");},900);
      // 만족 스파클 (멤버는 하트)
      if(Math.random()<0.5){
        const r=a.el.getBoundingClientRect();
        coinPop(r.left+r.width/2-8,r.top-6,a.c.type==="member"?"💛":"✨");
      }
      a.food=rec?rec.emoji:"🥯";
      // 착석 or 포장
      const seat=freeSeat();
      if(seat){
        a.seatKey=seat.key;a.state="toseat";
        a.wp=seat.y>=ROOM.h
          ?[{x:Math.max(0,Math.min(ROOM.w-1,seat.x)),y:ROOM.h-1},{x:seat.x,y:seat.y}] // 테라스 좌석: 실내를 지나 정원으로
          :[{x:seat.x,y:seat.y}];
      }else{
        a.state="leave";
        const bag=document.createElement("span");bag.className="want";bag.textContent="🛍";a.el.appendChild(bag);
        a.wp=[fx.corridor,{x:fx.door.x,y:fx.door.y},{x:fx.spawn.x,y:fx.spawn.y}];
      }
      a.t=0;
    }
    else if(a.state==="toseat"){
      a.state="seated";a.t=0;
      const f=document.createElement("span");f.className="want";f.textContent=a.food||"🥯";
      a.el.appendChild(f);a.foodEl=f;
      a.el.classList.remove("walk");
      a.el.classList.add("eating"); // 팔을 입으로 가져가는 식사 애니메이션
    }
    else if(a.state==="seated"){
      // 식사 중 이모트(맛있다·하트·음표) — 살아있는 매장 연출
      if(Math.random()<dt*0.12){
        const r=a.el.getBoundingClientRect();
        coinPop(r.left+r.width/2-8,r.top-4,["😋","❤️","🎵","☕","✨"][Math.floor(Math.random()*5)]);
      }
      if(a.t>5+Math.random()*4){
        if(a.foodEl)a.foodEl.remove();
        a.el.classList.remove("eating");
        // 매장 이용 리뷰: 잘 먹고 간 손님이 별점을 남김 → 평판(칭호 재료)
        const di=DATA.balance.dineIn;
        if(di&&Math.random()<di.reviewChance){
          S.rep+=1;
          const r=a.el.getBoundingClientRect();
          coinPop(r.left+r.width/2-10,r.top-6,"⭐ 리뷰!");
          actorSay(a,null,["⭐⭐⭐⭐⭐ 최고예요!","☕ 분위기 맛집이네요","🥐 또 올게요!","📸 인스타 각!"][Math.floor(Math.random()*4)],1600);
          renderHeader();
        }
        a.seatKey=null;a.state="leave";
        a.wp=[fx.corridor,{x:fx.door.x,y:fx.door.y},{x:fx.spawn.x,y:fx.spawn.y}];
      }
    }
    else if(a.state==="leave"){removeActor(a);}
  }
}

   레벨업 연출 + 가구 지급
   =================================================================== */
let lvQueue=[],lvShowing=false;
function queueLevelUps(ups){for(const lv of ups)lvQueue.push(lv);showNextLevelUp();}
/* 레벨업 컨페티 — 골드·코랄·민트 파티클 버스트 */
function confettiBurst(wrap){
  if(!wrap)return;
  const colors=["#f2ab2e","#e98f7f","#9fd8c3","#8fd66a","#ffd873","#e2574c"];
  for(let i=0;i<34;i++){
    const p=document.createElement("i");p.className="confp";
    p.style.setProperty("--dx",(Math.random()*280-140)+"px");
    p.style.setProperty("--dy",(Math.random()*-230-50)+"px");
    p.style.setProperty("--r",(Math.random()*760-380)+"deg");
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.12)+"s";
    wrap.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  }
}
function levelEntry(lv){return DATA.levels.levels.find(x=>x.level===lv)||DATA.levels.roadmap.find(x=>x.level===lv)||null;}
function ensurePetGrant(){
  const cfg=DATA.balance.pets;
  if(!cfg||S.level<cfg.freeFirstAtLevel||S.granted.pet1)return;
  S.granted.pet1=true;
  S.pets=S.pets||[];S.pets.push({type:"cat_cream"});
  syncPets();
  setTimeout(()=>{Snd.play("done");modal("🐱","첫 펫 입양!","크림 고양이가 우리 매장에 왔어요.<br>돌아다니는 고양이를 <b>쓰다듬어</b> 보세요 —<br>가끔 <b>동전도 찾아온답니다!</b> 💰",{okText:"환영해!"});},600);
}
function ensureGrants(){
  ensurePetGrant();
  // 현재 레벨 이하의 미지급 가구를 지급 (멱등)
  for(const entry of DATA.levels.levels){
    if(entry.level>S.level)continue;
    if(S.granted["lv"+entry.level])continue;
    S.granted["lv"+entry.level]=true;
    for(const fid of (entry.unlocks.furniture||[]))S.owned[fid]=(S.owned[fid]||0)+1;
  }
}
function showNextLevelUp(){
  if(lvShowing||!lvQueue.length)return;
  lvShowing=true;
  const lv=lvQueue.shift();
  const entry=levelEntry(lv);
  ensureGrants();
  $("#luLv").textContent="Lv."+lv;
  $("#luHead").textContent=entry?entry.headline:"빵집이 성장했어요!";
  const cards=[];
  if(entry&&entry.unlocks){
    const u=entry.unlocks;
    for(const id of (u.menus||[])){const r=Core.recipeById(DATA,id);if(r)cards.push({e:r.emoji,n:r.name,t:"새 메뉴"});}
    for(const id of (u.equipment||[])){const eq=Core.equipById(DATA,id);if(eq)cards.push({e:eq.emoji,n:eq.name,t:"새 장비"});}
    for(const id of (u.slots||[])){const s=DATA.levels.slots.find(x=>x.id===id);if(s)cards.push({e:s.emoji,n:s.name,t:"새 설비"});}
    for(const id of (u.furniture||[])){const f=Core.furnitureById(DATA,id);if(f)cards.push({e:f.emoji,n:f.name,t:"가구 지급!"});}
    for(const id of (u.customers||[])){const c=DATA.customers.types.find(x=>x.id===id);if(c&&!c.roadmap)cards.push({e:"💛",n:c.name,t:"새 손님"});}
    if((u.features||[]).includes("coffee_machine"))cards.push({e:"☕",n:"커피머신",t:"커피 제작 단축"});
    if((u.features||[]).includes("regulars"))cards.push({e:"❤️",n:"단골 시스템",t:"멤버 단골"});
    if((u.features||[]).includes("grade_up")){const g=Core.gradeForLevel(DATA,lv);cards.push({e:g.emoji,n:g.name,t:"등급 상승!"});}
  }
  if(roomFor(lv).w!==roomFor(lv-1).w||roomFor(lv).h!==roomFor(lv-1).h)
    cards.push({e:"📐",n:"매장 확장",t:roomFor(lv).w+"×"+roomFor(lv).h+" 타일"});
  $("#luCards").innerHTML=cards.map(c=>`<div class="ucard"><span class="ue">${c.e}</span><span class="un">${c.n}</span><span class="ut">${c.t}</span></div>`).join("")
    ||`<div class="ucard"><span class="ue">📈</span><span class="un">성장 지속</span><span class="ut">다음 해금으로!</span></div>`;
  $("#lvup").classList.add("on");
  Snd.play("levelup");confettiBurst($("#lvup"));
}
$("#luOk").addEventListener("click",()=>{
  $("#lvup").classList.remove("on");lvShowing=false;
  renderRoom();renderHeader();saveLocal();
  if(ftueStep===3)ftueAdvance(4);
  showNextLevelUp();
});

/* ===================================================================
   FTUE — 씬 기반 (오븐 탭 유도 → 5초 베이킹 → 첫 손님 스크립트 구매)
   =================================================================== */
let ftueStep=-1;
function guide(msg,anchorSel){
  const g=$("#guide");
  document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  if(!msg){g.style.display="none";return;}
  g.style.display="";g.textContent=msg;
  let top=130;
  if(anchorSel){const a=document.querySelector(anchorSel);if(a){a.classList.add("hl");const r=a.getBoundingClientRect();top=Math.max(70,r.top-56);}}
  g.style.top=top+"px";
}
function ftueAdvance(step){
  ftueStep=step;S.ftue.step=step;
  if(step===1)setTimeout(()=>guide("오븐을 탭해서 🥯 모닝롤을 구워보세요! (첫 베이킹은 5초)","[data-obj='st-oven']"),150);
  else if(step===2)guide("굽는 중… 완성되면 진열대로 자동 이동해요!",null);
  else if(step===3)guide(null);
  else if(step===4){
    guide("📋 퀘스트와 🛋️ 꾸미기로 나만의 빵집을 만들어보세요!",null);
    setTimeout(()=>{guide(null);ftueStep=99;S.ftue.done=true;S.ftue.step=99;toast("🥖 이제 당신의 빵집입니다!");saveLocal();},3400);
  }
  saveLocal();
}
function ftueTick(){
  if(ftueStep===2&&(S.stock.morning_roll||0)>0){
    ftueStep=2.5;
    guide("첫 손님이 왔어요!",null);
    const host=DATA.members.members.find(m=>m.unlockLevel<=1)||null;
    const a=mkActor({scripted:true,customer:host?{type:"member",m:host}:undefined});
    setTimeout(()=>{
      const res=Core.sellUnits(DATA,S,"morning_roll",4,true,Math.random);
      let bonus=DATA.balance.ftue.firstSaleBonusXp;
      if(S.level===1)bonus=Math.max(bonus,Core.xpNeed(DATA,1)-S.xp);
      const ups=Core.addXp(DATA,S,bonus);
      if(res)toast("🪙 첫 판매! +"+res.coins+"코인"+(host?" — "+host.nickname+"님":""));
      guide(null);
      ftueAdvance(3);
      const all=(res?res.levelUps:[]).concat(ups);
      if(all.length)queueLevelUps(all);else ftueAdvance(4);
      renderHeader();renderObjects();
    },3200);
  }
}
function startFtue(){
  ftueStep=0;
  modal("🏠","빵집 오픈!","엑서타운 골목에 당신의 빵집이 문을 엽니다.<br>빵집 이름을 지어주세요.",{
    input:true,okText:"개업하기 🎉",
    cb:(v)=>{S.name=(v||"").trim()||"엑서 빵집";renderHeader();renderRoom();ftueAdvance(1);}
  });
}

  }).join("<br>");

    {list:(items||"판매 없음")+"<br>─────────<br>🪙 <b>+"+fmt(rep.coins)+"</b> · XP <b>+"+rep.xp+"</b>"+(rep.tips?" · 팁 항아리 💰"+rep.tips:""),
     okText:"받기",cb:()=>{queueLevelUps(rep.levelUps);}});

}

/* ----- 🐾 애견카페: 펫 배회·쓰다듬기·코인 발굴 ----- */
let PETS=[]; // 런타임 펫 액터 {def,el,x,y,wp,t,idle,dug,patAt,digAt}
function petDef(id){return (DATA.balance.pets.types||[]).find(t=>t.id===id);}
function syncPets(){
  S.pets=S.pets||[];
  // 부족분 생성/초과분 제거
  while(PETS.length<S.pets.length){
    const i=PETS.length,def=petDef(S.pets[i].type)||DATA.balance.pets.types[0];
    const el=document.createElement("div");
    el.className="actor pet";
    el.innerHTML='<span class="charwrap">'+Art.petSVG(S.pets[i].type)+'</span>';
    $("#room").appendChild(el);
    const x=2+Math.random()*(ROOM.w-4),y=2+Math.random()*(ROOM.h-3);
    PETS.push({def,type:S.pets[i].type,el,x,y,wp:[],t:0,idle:1+Math.random()*3,dug:false,patAt:0,
      digAt:nowSec()+ (DATA.balance.pets.digMinLow+Math.random()*(DATA.balance.pets.digMinHigh-DATA.balance.pets.digMinLow))*60});
    positionActor(PETS[i]);
  }
  while(PETS.length>S.pets.length){const pp=PETS.pop();pp.el.remove();}
}
function tickPets(dt){
  if(!DATA.balance.pets)return;
  syncPets();
  const cfg=DATA.balance.pets;
  for(const pp of PETS){
    pp.t+=dt;
    // 이동
    if(pp.wp.length){
      const tgt=pp.wp[0];
      const tx=isoX(tgt.x,tgt.y),ty=isoY(tgt.x,tgt.y),cx=isoX(pp.x,pp.y),cy=isoY(pp.x,pp.y);
      const dx=tx-cx,dy=ty-cy,dist=Math.hypot(dx,dy);
      if(dist<3){pp.x=tgt.x;pp.y=tgt.y;pp.wp.shift();pp.el.classList.remove("walk");pp.idle=2+Math.random()*5;}
      else{const mv=SPEED*0.55*dt,r=Math.min(1,mv/dist);pp.x+=(tgt.x-pp.x)*r;pp.y+=(tgt.y-pp.y)*r;pp.el.classList.add("walk");}
      positionActor(pp);
    }else{
      pp.idle-=dt;
      if(pp.idle<=0){
        // 실내+테라스 잔디를 자유 배회
        const gx=Math.random()<0.8?1+Math.random()*(ROOM.w-2):-1+Math.random()*(ROOM.w+1);
        const gy=Math.random()<0.8?1+Math.random()*(ROOM.h-2):ROOM.h+Math.random()*2;
        pp.wp=[{x:gx,y:gy}];
      }
      if(Math.random()<dt*0.06){const r=pp.el.getBoundingClientRect();coinPop(r.left+r.width/2-8,r.top-2,["🐾","💤","❤️","🎾"][Math.floor(Math.random()*4)]);}
    }
    // 코인 발굴
    if(!pp.dug&&nowSec()>=pp.digAt){
      pp.dug=true;
      const sp=document.createElement("span");sp.className="gspark digspark";sp.textContent="💰";pp.el.appendChild(sp);
    }
  }
}
function tapPet(el){
  const pp=PETS.find(x=>x.el===el||x.el.contains(el));
  if(!pp)return false;
  const cfg=DATA.balance.pets,r=el.getBoundingClientRect();
  if(pp.dug){ // 발굴 코인 수집
    pp.dug=false;pp.digAt=nowSec()+(cfg.digMinLow+Math.random()*(cfg.digMinHigh-cfg.digMinLow))*60;
    el.querySelectorAll(".digspark").forEach(x=>x.remove());
    const coins=5+Math.floor(S.level*1.5);
    S.coins+=coins;
    Snd.play("golden");coinPop(r.left+r.width/2-12,r.top,"+"+coins+" 🪙");flyCoins(r.left+r.width/2,r.top,3);
    toast("🐾 "+pp.def.name+"이(가) 동전을 찾아왔어요!");
    renderHeader();saveLocal();return true;
  }
  if(nowSec()-pp.patAt>=cfg.patCooldownSec){ // 쓰다듬기
    pp.patAt=nowSec();
    Snd.play("pop");coinPop(r.left+r.width/2-8,r.top-4,"❤️");
    actorSay(pp,null,["골골골…","멍멍! 🐶","기분 좋아~","🐾"][Math.floor(Math.random()*4)],1300);
  }else coinPop(r.left+r.width/2-8,r.top-4,"💕");
  return true;
}
/* ----- 매장 관리: 청소 (얼룩 탭 → 전부 닦으면 '반짝반짝' 팁 버프) ----- */
let dirtAcc=0;
function tickCleaning(dt){
  const cfg=DATA.balance.cleaning; if(!cfg)return;
  S.dirt=S.dirt||[];
  // 버프 상태를 코어에 전달 (시뮬=0)
  S.cleanTipAdd=(S.cleanUntil&&nowSec()<S.cleanUntil)?cfg.tipChanceAdd:0;
  if(EDIT)return;
  dirtAcc+=dt;
  if(dirtAcc>=cfg.spawnMinutes*60){
    dirtAcc=0;
    if(S.dirt.length<cfg.maxSpots){
      const blocked=blockedTiles();
      for(let t=0;t<20;t++){
        const x=1+Math.floor(Math.random()*(ROOM.w-2)),y=1+Math.floor(Math.random()*(ROOM.h-2));
        if(!blocked.has(x+","+y)&&!S.dirt.some(d=>d.x===x&&d.y===y)){
          S.dirt.push({x,y});renderObjects();saveLocal();break;
        }
      }
    }
  }
}
function wipeDirt(idx,el){
  const cfg=DATA.balance.cleaning;
  const r=el.getBoundingClientRect();
  S.dirt.splice(idx,1);
  Snd.play("pop");
  coinPop(r.left+r.width/2-8,r.top,"🧽✨");
  if(S.dirt.length===0){
    S.cleanUntil=nowSec()+cfg.buffMin*60;
    S.cleanTipAdd=cfg.tipChanceAdd;
    Snd.play("done");
    toast("🧽 반짝반짝! "+cfg.buffMin+"분간 팁 확률 +"+Math.round(cfg.tipChanceAdd*100)+"%");
    renderTicker();
  }
  renderObjects();saveLocal();
}
/* ----- 러시 타임 (KST 시간대 버프: 팁 확률↑ + 손님 등장↑) ----- */
function rushWindow(){
  const cfg=DATA.balance.rush; if(!cfg)return null;
  const h=new Date((nowSec()+9*3600)*1000).getUTCHours();
  for(const w of cfg.windows) if(h>=w[0]&&h<w[1]) return w;
  return null;
}
let _rushOn=false;
function tickRush(){
  const w=rushWindow(),cfg=DATA.balance.rush;
  S.rushTipAdd=w&&cfg?cfg.tipChanceAdd:0;
  if(!!w!==_rushOn){
    _rushOn=!!w;
    if(_rushOn)toast("🔥 러시 타임! 팁 확률이 올라가고 손님이 몰려와요 (~"+w[1]+"시)");
    renderTicker();
  }
}
/* ----- 헤더 티커: 다음 해금 ↔ 오늘의 메뉴 ↔ 러시 타임 순환 ----- */
let TICKI=0;
function tickerItems(){
  const items=[];
  const nx=Core.nextUnlock(DATA,S.level);
  items.push({html:nx?("🎯 다음: <b>Lv."+nx.level+"</b> "+nx.headline):"👑 모든 목표 달성!",act:openUpgrade});
  const sp=specialRecipe();
  if(sp){const ds=DATA.balance.dailySpecial;
    items.push({html:"⭐ 오늘의 메뉴 <b>"+sp.emoji+" "+sp.name+"</b> XP×"+ds.xpMult+"·팁+"+Math.round(ds.tipChanceAdd*100)+"%",act:()=>openKitchen(sp.station)});}
  const w=rushWindow();
  if(w)items.push({html:"🔥 <b>러시 타임</b> — 팁 확률 UP! (~"+w[1]+"시)",act:null});
  if(S.cleanUntil&&nowSec()<S.cleanUntil)items.push({html:"🧽 <b>반짝반짝</b> — 팁 확률 +3% ("+Math.ceil((S.cleanUntil-nowSec())/60)+"분)",act:null});
  else if(S.dirt&&S.dirt.length)items.push({html:"🧹 바닥에 얼룩 "+S.dirt.length+"개 — 탭해서 청소!",act:null});
  return items;
}
function renderTicker(){
  const el=$("#hTicker"); if(!el||!S)return;
  const items=tickerItems();
  const it=items[TICKI%items.length];
  el.innerHTML=it.html;
  el.onclick=it.act||null;
  el.style.cursor=it.act?"pointer":"default";
}
setInterval(()=>{if(S&&DATA){TICKI++;renderTicker();}},5000);
function renderHeader(){
  $("#hName").textContent=S.name||"엑서 빵집";
  const g=Core.gradeForLevel(DATA,S.level);
  $("#hGrade").textContent=g.emoji+" "+g.name;
  $("#hCoins").textContent=fmt(S.coins);
  $("#hRep").textContent=fmt(S.rep);
  $("#hLv").textContent="Lv."+S.level;
  $("#hLvN").textContent=S.level;
  // ❤️ 단골 수(커뮤니티 지표) — 프리미엄 재화 아님
  const fans=S.regulars?Object.values(S.regulars).filter(v=>v>=DATA.balance.regulars.visitsToRegular).length:0;
  $("#hFans").textContent=fans;
  const need=Core.xpNeed(DATA,S.level);
  const pct=need===Infinity?100:Math.min(100,S.xp/need*100);
  $("#hXpFill").style.width=pct+"%";
  $("#hXpTxt").textContent=need===Infinity?"MAX":Math.floor(S.xp)+" / "+need+" XP";
  const mood=Core.moodScore(DATA,S);
  const bonus=Math.min(DATA.balance.interior.tipChanceMax,mood*DATA.balance.interior.tipChancePerMood);
  $("#hMood").textContent="✨ "+mood+" (팁+"+Math.round(bonus*100)+"%)";
  renderTicker();
  const qReady=DATA.balance.quests.daily.some(q=>{const st=questState(q);return st&&st.cur>=st.tgt&&!S.daily.claimed[q.id];});
  const oReady=(()=>{const n=Core.orderSlots(DATA,S);const today=kstDateStr(nowSec());
    for(let i=0;i<n;i++){if(!(S.daily.orders&&S.daily.orders[i])&&Core.canFulfill(S,Core.genOrder(DATA,S,today,i)))return true;}return false;})();
  $("#dotQuest").style.display=(qReady||oReady)?"":"none";
  const canUp=DATA.equipment.equipment.some(e=>{
    if(S.level<e.unlockLevel)return false;
    const c=Core.upgradeCost(DATA,e.id,Core.equipLevel(S,e.id));return c!=null&&S.coins>=c;
  });
  $("#dotUp").style.display=canUp?"":"none";
  // 수금 CTA 강조 + 주방 유휴 알림
  $("#dockCollect").classList.toggle("cta-on",S.tipsJar>0);
  const idle=Object.keys(S.queues).some(st=>DATA.balance.stations[st]&&DATA.balance.stations[st].unlockLevel<=S.level&&S.queues[st].length===0);
  $("#dotKitchen").style.display=idle?"":"none";
}
function renderAll(){renderHeader();renderRoom();if(EDIT)renderTray();if(SHEET)renderSheet();}

/* ===================================================================
   메인 루프
   =================================================================== */
let lastT=performance.now(),uiAcc=0,saveAcc=0,cloudAcc=0;
function loop(now){
  const dtRaw=Math.min(2,(now-lastT)/1000);lastT=now;
  const dt=dtRaw*WARP;
  if(S&&ftueStep!==0){
    const sum=Core.advance(DATA,S,dt,"online",Math.random);
    if(sum.sold>0){
      saleFlashUntil=performance.now()+1600; // POS 판매 피드백
      for(const id in sum.soldBy)for(let i=0;i<sum.soldBy[id];i++)pendingSales.push({recipeId:id});
      if(pendingSales.length>10)pendingSales.length=10;
      if(sum.sold>0&&performance.now()-(window._sndCoinT||0)>1500){window._sndCoinT=performance.now();Snd.play("coin");}
      if(Object.keys(sum.produced).length&&performance.now()-(window._sndDoneT||0)>4000){window._sndDoneT=performance.now();Snd.play("done");}
    }
    if(sum.levelUps.length)queueLevelUps(sum.levelUps);
    // 손님 스폰 (간판 레벨로 빨라짐)
    spawnAcc+=dtRaw;
    tickRush();
    let interval=Math.max(DATA.balance.customers.visitIntervalSecMin,
      DATA.balance.customers.visitIntervalSecBase/Core.signMult(DATA,S));
    if(_rushOn&&DATA.balance.rush)interval*=DATA.balance.rush.spawnMult; // 러시: 손님 몰림
    const waiting=actors.filter(a=>a.state==="queue"||a.state==="toqueue").length;
    if(spawnAcc>=interval&&ftueStep>=3){
      spawnAcc=0;
      if((pendingSales.length>0||Core.totalStock(S)>0)&&waiting<5&&actors.length<12)mkActor();
    }
    stepActors(dtRaw);
    tickPets(dtRaw);
    tickCleaning(dtRaw);
    ftueTick();
    checkDailyReset();
    uiAcc+=dtRaw;
    if(uiAcc>=1){uiAcc=0;renderHeader();renderObjects();tickKitchenSheet();}
    saveAcc+=dtRaw;if(saveAcc>=DATA.balance.save.autosaveSec){saveAcc=0;saveLocalNow();}
    cloudAcc+=dtRaw;if(cloudAcc>=DATA.balance.save.cloudSyncSec){cloudAcc=0;cloudSave();}
  }
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",()=>{
  if(!S)return;
  if(document.hidden){saveLocalNow();cloudSave();}
  else{
    // 복귀 시 서버 시간 재동기화 후 정산 — 기기 시계 점프로 인한 부당 정산 방지
    syncServerTime().finally(()=>{offlineSettleAndShow();lastT=performance.now();});
  }
});
window.addEventListener("beforeunload",()=>{if(S)saveLocalNow();});
window.addEventListener("resize",()=>{if(S){CAM.z=clampZoom(CAM.z);applyCamera();}});

/* ===================================================================
   디버그
   =================================================================== */
function initDebug(){
  const pin=new URLSearchParams(location.search).get("debug");
  if(pin!==DATA.balance.debug.pin)return;
  DEBUG=true;
  const d=$("#dbg");d.classList.add("on");
  d.innerHTML=`<div style="margin-bottom:4px">🛠 DEBUG</div>
    <button data-dbg="w1">×1</button><button data-dbg="w10">×10</button><button data-dbg="w60">×60</button><br>
    <button data-dbg="coin">+${DATA.balance.debug.grantCoins}🪙</button>
    <button data-dbg="lv">레벨설정</button>
    <button data-dbg="off4">4h정산</button><br>
    <button data-dbg="reset">리셋</button>
    <span id="dbgInfo"></span>`;
  d.addEventListener("click",e=>{
    const b=e.target.closest("[data-dbg]");if(!b)return;
    const k=b.dataset.dbg;
    S.flags=S.flags||{};S.flags.debug=true; // 디버그 사용 세이브 → 주간 랭킹 제외(공정성)
    if(k==="w1")WARP=1;if(k==="w10")WARP=10;if(k==="w60")WARP=60;
    if(k==="coin")S.coins+=DATA.balance.debug.grantCoins;
    if(k==="lv"){const v=+prompt("레벨(1~50)",S.level+1);if(v>=1&&v<=50){S.level=v;S.xp=0;ensureGrants();}}
    if(k==="off4"){S.lastSeenAt=nowSec()-4*3600;offlineSettleAndShow();}
    if(k==="reset"){if(confirm("상태를 초기화할까요?")){localStorage.removeItem(DATA.balance.save.localKey);S=Core.newState(DATA,nowSec());Core.resetDaily(S,kstDateStr(nowSec()),DATA);cloudSave();location.reload();return;}}
    $("#dbgInfo").textContent=" ×"+WARP;
    renderAll();saveLocal();
  });
}

/* ===================================================================
   부트
   =================================================================== */
(async function boot(){
  try{DATA=await loadData();}
  catch(e){document.body.innerHTML="<p style='padding:40px;text-align:center;font-weight:800'>데이터 로드 실패 😢<br>새로고침해 주세요.</p>";return;}
  await Promise.all([cloudInit(),loadSprites()]);
  await syncServerTime();

  let local=null;
  try{local=JSON.parse(localStorage.getItem(DATA.balance.save.localKey));}catch(e){}
  const cloud=await cloudLoad();
  let chosen=null;
  if(local&&cloud)chosen=progressScore(cloud)>progressScore(local)?cloud:local;
  else chosen=local||cloud;
  if(chosen)S=Core.migrate(DATA,chosen)||Core.newState(DATA,nowSec());
  else S=Core.newState(DATA,nowSec());
  const fresh=Core.newState(DATA,nowSec());
  for(const k in fresh)if(S[k]===undefined)S[k]=fresh[k];

  if(!S.daily.date)Core.resetDaily(S,kstDateStr(nowSec()),DATA);
  checkDailyReset();
  ensureGrants();
  initDebug();
  bindCamera();
  renderAll();

  if(!S.ftue.done){
    ftueStep=S.ftue.step||0;
    if(ftueStep<=0)startFtue();
    else if(ftueStep<3)ftueAdvance(1);
    else{S.ftue.done=true;ftueStep=99;}
  }else{
    ftueStep=99;
    offlineSettleAndShow();
  }
  requestAnimationFrame(loop);
})();
</script>
