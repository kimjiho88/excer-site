<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8a5a33" />
<title>엑서 빵집 타이쿤</title>
<meta name="description" content="내 이름을 건 빵집이 매일 커진다 — 오븐에 걸어두고 자면 아침에 진열대가 차 있는 커뮤니티 빵집 타이쿤." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fdf6ec;--milk:#fffdf8;--cream:#f7ead6;
  --ink:#33220f;--ink2:#6a4e30;--mut:#a1876a;--line:rgba(130,90,45,.15);--line2:rgba(130,90,45,.3);
  --brown:#8a5a33;--brown2:#b0793f;--gold:#e8b64c;--green:#4cae7d;--red:#e06d6d;--blue:#5f8fd9;
  --r:16px;--ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 10px 26px rgba(90,55,20,.13);--shadow-s:0 4px 12px rgba(90,55,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg);
  min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overflow-x:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* ===== 헤더 ===== */
.top{position:sticky;top:0;z-index:30;padding:9px 12px 10px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(253,246,236,.98),rgba(253,246,236,.9));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top-row{display:flex;align-items:center;gap:8px}
.shop-name{min-width:0;flex:1}
.shop-name b{display:block;font-size:15px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--brown);
  background:rgba(176,121,63,.12);padding:2px 8px;border-radius:999px;margin-top:2px}
.res{display:flex;gap:6px}
.res .pill{display:flex;flex-direction:column;align-items:flex-end;background:var(--milk);border:1px solid var(--line);
  border-radius:11px;padding:4px 10px;box-shadow:var(--shadow-s);min-width:74px}
.res .pill small{font-size:9.5px;font-weight:800;color:var(--mut)}
.res .pill b{font-size:14.5px;font-weight:900;letter-spacing:-.03em}
.back{font-size:11px;font-weight:800;color:var(--mut);padding:4px 2px}
.lvrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.lvbadge{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:11px;font-size:12px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--brown2),var(--brown));box-shadow:var(--shadow-s)}
.xpbar{flex:1;height:14px;border-radius:8px;background:rgba(130,90,45,.14);overflow:hidden;position:relative;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f4d27e);transition:width .5s var(--ease)}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9.5px;font-weight:800;color:var(--ink2)}
.nextgoal{margin-top:6px;font-size:11px;font-weight:750;color:var(--ink2);display:flex;align-items:center;gap:5px}
.nextgoal b{color:var(--brown)}

/* ===== 씬 ===== */
.content{flex:1;padding:12px 12px 4px}
.pane{display:none}.pane.on{display:block}
.scene{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow)}
.scene .wall{padding:12px 12px 4px;transition:background .6s}
.grade-1 .wall{background:linear-gradient(180deg,#f6e3c5 0%,#f3d9b4 68%,#c99e6b 68%,#b98d5c 100%)}
.grade-2 .wall{background:linear-gradient(180deg,#f9e0cf 0%,#f2cfae 68%,#a97648 68%,#996a42 100%)}
.grade-3 .wall{background:linear-gradient(180deg,#e8e4d4 0%,#ded5bd 68%,#8a6a45 68%,#7c5f3f 100%)}
.slotgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{position:relative;aspect-ratio:1;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,253,248,.55);border:1px solid rgba(130,90,45,.18);backdrop-filter:blur(2px)}
.slot .se{font-size:26px;line-height:1}
.slot .sn{font-size:8.5px;font-weight:800;color:var(--ink2);letter-spacing:-.02em}
.slot .lv{position:absolute;right:4px;top:4px;font-size:8px;font-weight:900;color:#fff;background:var(--brown2);border-radius:999px;padding:1px 5px}
.slot.locked{background:rgba(80,55,25,.12);border-style:dashed}
.slot.locked .se{filter:grayscale(1) opacity(.35)}
.slot.locked .sn{color:rgba(80,55,25,.55)}
.slot.locked .lv{background:rgba(80,55,25,.45)}
.slot.tappable{cursor:pointer}
.slot.tappable:active{transform:scale(.94)}
.slot .jarband{position:absolute;left:4px;bottom:4px;font-size:9px;font-weight:900;color:#7c5a12;background:rgba(232,182,76,.9);border-radius:999px;padding:1px 6px;
  animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.terrace{margin-top:8px;padding-top:8px;border-top:2px dashed rgba(130,90,45,.25)}
.terrace .tlab{font-size:9.5px;font-weight:900;color:var(--ink2);margin-bottom:6px;opacity:.8}
/* 손님 통로 */
.lane{position:relative;height:64px;background:linear-gradient(180deg,rgba(0,0,0,.06),transparent 30%)}
.cust{position:absolute;bottom:6px;left:-48px;display:flex;flex-direction:column;align-items:center;transition:left 1.6s linear;will-change:left}
.cust .ce{font-size:26px;line-height:1.1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.cust .cn{font-size:8px;font-weight:800;color:#fff;background:rgba(80,50,20,.65);border-radius:999px;padding:1px 5px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cust .heart{position:absolute;top:-10px;right:-8px;font-size:11px}
.bubble{position:absolute;bottom:66px;transform:translateX(-40%);max-width:190px;background:#fff;border-radius:12px;padding:7px 10px;font-size:11px;font-weight:700;
  color:var(--ink);box-shadow:var(--shadow-s);border:1px solid var(--line);opacity:0;transition:opacity .25s;pointer-events:none;z-index:5}
.bubble.on{opacity:1}
.bubble small{display:block;font-size:9px;color:var(--brown);font-weight:900;margin-bottom:1px}
/* 진열 현황 */
.stockbox{margin-top:10px;background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:11px;box-shadow:var(--shadow-s)}
.stockbox .sb-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900}
.stockbox .sb-head .cap{font-size:11px;color:var(--mut);font-weight:800}
.stockrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.stockchip{display:flex;align-items:center;gap:5px;background:var(--cream);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.stockchip .n{font-size:12.5px;font-weight:900;color:var(--brown)}
.stockchip.empty{opacity:.45}
.lost{margin-top:7px;font-size:10px;color:var(--mut);font-weight:700}

/* ===== 주방 ===== */
.station{background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:11px;box-shadow:var(--shadow-s)}
.station .st-head{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:900}
.station .st-head .tag{margin-left:auto;font-size:10px;font-weight:800;color:var(--mut)}
.qrow{display:flex;gap:7px;margin-top:10px}
.qslot{flex:1;position:relative;height:56px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.qslot.busy{border-style:solid;background:var(--cream)}
.qslot .qe{font-size:20px;line-height:1}
.qslot .qt{font-size:9px;font-weight:800;color:var(--ink2)}
.qslot .qp{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:3px;background:rgba(130,90,45,.15);overflow:hidden}
.qslot .qp i{display:block;height:100%;background:var(--green);width:0}
.qslot .plus{font-size:16px;color:var(--mut);font-weight:900}
.menu-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:12px;background:linear-gradient(135deg,#f6e7cf,#efdcbc);
  border:1px solid var(--line);font-weight:800;transition:transform .1s var(--ease)}
.mbtn:active{transform:scale(.95)}
.mbtn:disabled{opacity:.45}
.mbtn .me{font-size:21px;line-height:1}
.mbtn .mn{font-size:10.5px;font-weight:900}
.mbtn .mi{font-size:9px;color:var(--ink2);font-weight:750}
.blocked{margin-top:8px;font-size:10.5px;color:var(--red);font-weight:800}

/* ===== 성장 ===== */
.equip{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:11px;align-items:center;
  background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px;box-shadow:var(--shadow-s)}
.equip .ee{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:var(--cream);border:1px solid var(--line);position:relative}
.equip .ee .elv{position:absolute;right:-5px;bottom:-5px;font-size:9px;font-weight:900;color:#fff;background:var(--brown);border-radius:999px;padding:1px 6px}
.equip .en{font-size:13.5px;font-weight:900}
.equip .ed{font-size:11px;font-weight:700;color:var(--ink2);margin-top:2px;line-height:1.45}
.equip .eb{padding:9px 12px;border-radius:11px;background:linear-gradient(135deg,var(--brown2),var(--brown));color:#fff;font-weight:900;font-size:12px;white-space:nowrap;box-shadow:var(--shadow-s)}
.equip .eb:disabled{background:#e3d5c0;color:#af9878;box-shadow:none}
.equip .eb.max{background:rgba(76,174,125,.18);color:#28734f}
.equip.lockedeq{opacity:.55}
.gradebox{background:var(--milk);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-top:4px;box-shadow:var(--shadow-s)}
.gradebox .gtitle{font-size:12px;font-weight:900;margin-bottom:9px}
.gstep{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:750;color:var(--mut);padding:3px 0}
.gstep.onx{color:var(--ink);font-weight:900}
.gstep .gdot{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.gstep.onx .gdot{background:var(--gold)}

/* ===== 퀘스트 ===== */
.quest{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--milk);
  border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--shadow-s)}
.quest .qn{font-size:13px;font-weight:900}
.quest .qd{font-size:10.5px;color:var(--ink2);font-weight:750;margin-top:2px}
.quest .qbar{margin-top:7px;height:8px;border-radius:6px;background:rgba(130,90,45,.13);overflow:hidden}
.quest .qbar i{display:block;height:100%;background:var(--blue);width:0;border-radius:6px}
.quest .qbtn{padding:9px 13px;border-radius:11px;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(135deg,#69b98a,var(--green))}
.quest .qbtn:disabled{background:#e3d5c0;color:#af9878}
.quest .qbtn.claimed{background:rgba(76,174,125,.16);color:#28734f}

/* ===== 탭바 ===== */
.tabbar{position:fixed;inset:auto 0 0 0;z-index:40;max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));background:rgba(253,246,236,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border-radius:13px;color:var(--mut);font-size:10.5px;font-weight:800}
.tab .ti{font-size:19px;line-height:1}
.tab.on{background:rgba(176,121,63,.14);color:var(--brown)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 16px);width:7px;height:7px;border-radius:99px;background:var(--red)}

/* ===== 토스트/모달/연출 ===== */
.toast{position:fixed;left:50%;bottom:92px;z-index:70;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:10px 15px;border-radius:999px;
  background:rgba(51,34,15,.94);color:#fff;font-weight:800;font-size:12.5px;box-shadow:var(--shadow);transition:all .22s var(--ease);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:22px;background:rgba(51,34,15,.55);backdrop-filter:blur(4px)}
.modal.on{display:grid}
.mcard{background:var(--milk);border-radius:22px;padding:22px 20px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;max-height:82dvh;overflow-y:auto}
.mcard .mi{font-size:44px;line-height:1.1}
.mcard h3{font-size:19px;font-weight:900;letter-spacing:-.03em;margin:8px 0 5px}
.mcard p{font-size:13px;font-weight:650;color:var(--ink2);line-height:1.6}
.mcard .list{margin:12px 0 2px;text-align:left;background:var(--cream);border-radius:13px;padding:10px 13px;font-size:12.5px;font-weight:800;line-height:1.9}
.mcard .list b{color:var(--brown)}
.mcard input{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1.5px solid var(--line2);font:inherit;font-weight:800;text-align:center;background:#fff}
.mcard .mbig{width:100%;margin-top:15px;padding:13px;border-radius:13px;font-weight:900;font-size:14.5px;color:#fff;
  background:linear-gradient(135deg,var(--brown2),var(--brown));box-shadow:var(--shadow-s)}
/* 레벨업 풀스크린 */
.lvup{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:22px;background:radial-gradient(circle at 50% 30%,rgba(232,182,76,.35),rgba(51,34,15,.78))}
.lvup.on{display:grid}
.lvcard{background:var(--milk);border-radius:24px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);
  animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.lvcard .big{font-size:15px;font-weight:900;color:var(--brown);letter-spacing:.1em}
.lvcard .lvn{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0}
.lvcard .hd{font-size:15px;font-weight:900;margin-bottom:10px}
.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 4px}
.ucard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--cream);border-radius:12px;padding:9px 11px;min-width:74px}
.ucard .ue{font-size:24px;line-height:1.1}
.ucard .un{font-size:10px;font-weight:900}
.ucard .ut{font-size:8.5px;font-weight:800;color:var(--brown)}
/* FTUE 하이라이트 */
.hl{position:relative;z-index:60!important;box-shadow:0 0 0 4px var(--gold),0 0 26px rgba(232,182,76,.8)!important;border-radius:13px}
.guide{position:fixed;left:50%;transform:translateX(-50%);z-index:65;background:#33220f;color:#fff;font-size:12.5px;font-weight:800;
  padding:10px 15px;border-radius:13px;box-shadow:var(--shadow);max-width:86vw;text-align:center;pointer-events:none}
.guide::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:7px solid transparent}
.guide.below{top:auto}
.coinpop{position:fixed;z-index:75;font-weight:900;color:var(--brown);font-size:14px;pointer-events:none;text-shadow:0 1px 4px rgba(255,255,255,.8);
  animation:floatUp .9s var(--ease) forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1.06)}}
/* 디버그 */
.dbg{position:fixed;left:8px;bottom:88px;z-index:95;background:rgba(20,14,8,.92);color:#9fe8b8;font-size:10.5px;border-radius:12px;padding:9px;display:none;max-width:190px}
.dbg.on{display:block}
.dbg button{display:inline-block;margin:2px;background:#2c2216;color:#ffd98a;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="shop-name">
        <b id="hName">엑서 빵집</b>
        <span class="grade" id="hGrade">🏠 작은 동네 빵집</span>
      </div>
      <div class="res">
        <div class="pill"><small>🪙 코인</small><b id="hCoins">0</b></div>
        <div class="pill"><small>⭐ 평판</small><b id="hRep">0</b></div>
      </div>
      <a class="back" href="games.html">게임<br/>목록</a>
    </div>
    <div class="lvrow">
      <span class="lvbadge" id="hLv">Lv.1</span>
      <div class="xpbar"><i id="hXpFill"></i><span id="hXpTxt"></span></div>
    </div>
    <div class="nextgoal" id="hNext">🎯 다음 해금: —</div>
  </header>

  <main class="content">
    <!-- 홈(씬) -->
    <section id="pane-home" class="pane on">
      <div class="scene grade-1" id="scene">
        <div class="wall">
          <div class="slotgrid" id="slotMain"></div>
          <div class="terrace" id="terrace" style="display:none">
            <div class="tlab">⛱️ 테라스</div>
            <div class="slotgrid" id="slotTerrace" style="grid-template-columns:repeat(4,1fr)"></div>
          </div>
        </div>
        <div class="lane" id="lane"></div>
      </div>
      <div class="stockbox">
        <div class="sb-head"><span>🧺 진열대</span><span class="cap" id="stockCap"></span></div>
        <div class="stockrow" id="stockRow"></div>
        <div class="lost" id="lostLine" style="display:none"></div>
      </div>
    </section>

    <!-- 주방 -->
    <section id="pane-kitchen" class="pane"><div id="stationList"></div></section>

    <!-- 성장 -->
    <section id="pane-grow" class="pane">
      <div id="equipList"></div>
      <div class="gradebox"><div class="gtitle">🏆 빵집 등급</div><div id="gradeSteps"></div></div>
    </section>

    <!-- 퀘스트 -->
    <section id="pane-quest" class="pane"><div id="questList"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="home"><span class="ti">🏠</span>홈</button>
    <button class="tab" data-tab="kitchen"><span class="ti">👨‍🍳</span>주방<span class="dot" id="dotKitchen" style="display:none"></span></button>
    <button class="tab" data-tab="grow"><span class="ti">📈</span>성장<span class="dot" id="dotGrow" style="display:none"></span></button>
    <button class="tab" data-tab="quest"><span class="ti">📋</span>퀘스트<span class="dot" id="dotQuest" style="display:none"></span></button>
  </nav>
</div>

<div id="toast" class="toast"></div>

<!-- 범용 모달 (오프라인 정산 / 이름 짓기) -->
<div id="modal" class="modal"><div class="mcard">
  <div class="mi" id="mIcon">🛎️</div><h3 id="mTitle"></h3><p id="mBody"></p>
  <div class="list" id="mList" style="display:none"></div>
  <input id="mInput" style="display:none" maxlength="12" placeholder="빵집 이름 (최대 12자)" />
  <button class="mbig" id="mOk">확인</button>
</div></div>

<!-- 레벨업 연출 -->
<div id="lvup" class="lvup"><div class="lvcard">
  <div class="big">🎉 LEVEL UP</div>
  <div class="lvn" id="luLv">2</div>
  <div class="hd" id="luHead"></div>
  <div class="cards" id="luCards"></div>
  <button class="mbig" id="luOk">좋아요!</button>
</div></div>

<div class="guide" id="guide" style="display:none"></div>
<div class="dbg" id="dbg"></div>

<script src="assets/bakery-core.js"></script>
<script>

/* ===================================================================

/* ---------- 시간 (서버 기준) ---------- */
function nowSec(){ return (Date.now()+serverOffsetMs)/1000; }
function kstDateStr(sec){ return new Date((sec+9*3600)*1000).toISOString().slice(0,10); }
async function syncServerTime(){
  // 1순위: RPC bakery_now / 2순위: REST 응답 Date 헤더 / 3순위: 클라 시계
  try{
    if(sb){ const r=await sb.rpc("bakery_now"); if(!r.error&&r.data){ serverOffsetMs=new Date(r.data).getTime()-Date.now(); return "rpc"; } }
  }catch(e){}
  try{
    const res=await fetch(SUPA.url+"/rest/v1/",{method:"HEAD",headers:{apikey:SUPA.anon}});
    const d=res.headers.get("date");
    if(d){ serverOffsetMs=new Date(d).getTime()-Date.now(); return "header"; }
  }catch(e){}
  serverOffsetMs=0; return "client";
}

/* ---------- 데이터 로드 ---------- */
async function loadData(){
  const files=["balance","recipes","equipment","levels","customers","members"];
  const out={};
  await Promise.all(files.map(async f=>{ out[f]=await (await fetch("data/"+f+".json?v=1")).json(); }));
  // 멤버 active 필터 (§15: active=false 즉시 미등장)
  out.members.members=(out.members.members||[]).filter(m=>m.active);
  return out;
}

/* ---------- 포맷 ---------- */
function fmt(n){ n=Math.floor(n); return n<10000?n.toLocaleString("en-US"):(n<1e8?(Math.floor(n/100)/100)+"만":(Math.floor(n/1e6)/100)+"억"); }
function fmtDur(sec){
  sec=Math.max(0,Math.round(sec));
  if(sec<90) return sec+"초";
  if(sec<3600) return Math.round(sec/60)+"분";
  return (Math.floor(sec/360)/10)+"시간";
}

/* ---------- 토스트/모달 ---------- */
let _toastT=null;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(_toastT); _toastT=setTimeout(()=>t.classList.remove("on"),2400); }
let _modalCb=null;
function modal(icon,title,body,opt){
  opt=opt||{};
  $("#mIcon").textContent=icon; $("#mTitle").textContent=title; $("#mBody").innerHTML=body||"";
  const list=$("#mList"); if(opt.list){ list.style.display=""; list.innerHTML=opt.list; } else list.style.display="none";
  const inp=$("#mInput"); if(opt.input){ inp.style.display=""; inp.value=opt.inputValue||""; setTimeout(()=>inp.focus(),150);} else inp.style.display="none";
  $("#mOk").textContent=opt.okText||"확인";
  _modalCb=opt.cb||null;
  $("#modal").classList.add("on");
}
$("#mOk").addEventListener("click",()=>{
  const v=$("#mInput").value;
  if(_modalCb){ const keep=_modalCb(v); if(keep===true) return; }
  $("#modal").classList.remove("on");
});

const SLOT_VISUAL={ coffeebar:st=>Core.hasCoffeeMachine(DATA,st)?"☕":"🫖" };
function renderScene(){
  const grade=Core.gradeForLevel(DATA,S.level);
  const sc=$("#scene");
  sc.className="scene "+(grade.themeClass==="grade-1"?"grade-1":grade.themeClass==="grade-2"?"grade-2":"grade-3");
  const slots=DATA.levels.slots;
  const showAheadUntil=S.level+7; // 잠금 실루엣: 다음에 열릴 것 예고
  const html=z=>slots.filter(s=>s.zone===z&&(s.unlockLevel<=S.level||s.unlockLevel<=showAheadUntil))
    .map(s=>{
      const un=s.unlockLevel<=S.level;
      const emoji=un&&SLOT_VISUAL[s.id]?SLOT_VISUAL[s.id](S):s.emoji;
      const eqLv=un&&S.equip[s.id]?`<span class="lv">Lv.${S.equip[s.id]}</span>`:(un?"":`<span class="lv">Lv.${s.unlockLevel}</span>`);
      const jar=(s.id==="counter"&&un&&S.tipsJar>0)?`<span class="jarband">💰${S.tipsJar}</span>`:"";
      const tap=(s.id==="counter"&&un)?" tappable":"";
      return `<div class="slot${un?"":" locked"}${tap}" data-slot="${s.id}">${eqLv}<span class="se">${un?emoji:"🔒"}</span><span class="sn">${un?s.name:"???"}</span>${jar}</div>`;
    }).join("");
  $("#slotMain").innerHTML=html("main");
  const terr=slots.some(s=>s.zone==="terrace"&&s.unlockLevel<=S.level);
  $("#terrace").style.display=terr?"":"none";
  if(terr) $("#slotTerrace").innerHTML=html("terrace");
}

function renderKitchen(){
  const host=$("#stationList"); let html="";
  for(const stId of ["oven","coffee"]){
    const stDef=DATA.balance.stations[stId];
    if(S.level<stDef.unlockLevel){
      html+=`<div class="station" style="opacity:.55"><div class="st-head">🔒 ${stDef.name}<span class="tag">Lv.${stDef.unlockLevel} 해금</span></div></div>`;
      continue;
    }
    const emoji=stId==="coffee"?(Core.hasCoffeeMachine(DATA,S)?"☕":"🫖"):stDef.emoji;
    const q=S.queues[stId], buf=S.buffer[stId];
    const slots=[];
    for(let i=0;i<DATA.balance.queue.slotsPerStation;i++){
      const job=q[i];
      if(job){
        const rec=Core.recipeById(DATA,job.r);
        const total=Core.craftSeconds(DATA,S,rec);
        const rem=job.remain==null?total:Math.max(0,job.remain);
        const pct=i===0?Math.min(100,(1-rem/total)*100):0;
        slots.push(`<div class="qslot busy"><span class="qe">${rec.emoji}</span><span class="qt">${i===0?fmtDur(rem):"대기"}</span><span class="qp"><i style="width:${pct}%"></i></span></div>`);
      }else slots.push(`<div class="qslot"><span class="plus">＋</span></div>`);
    }
    const menus=Core.unlockedRecipes(DATA,S).filter(r=>r.station===stId);
    const full=q.length>=DATA.balance.queue.slotsPerStation;
    html+=`<div class="station" data-st="${stId}">
      <div class="st-head">${emoji} ${stDef.name}${stId==="coffee"&&Core.hasCoffeeMachine(DATA,S)?" <span style='font-size:10px;color:var(--green)'>머신 설치됨</span>":""}
        <span class="tag">대기열 ${q.length}/${DATA.balance.queue.slotsPerStation}</span></div>
      <div class="qrow">${slots.join("")}</div>
      ${buf?`<div class="blocked">📦 ${Core.recipeById(DATA,buf.r).emoji} ${buf.n}개가 진열 공간을 기다리는 중 (진열대 업그레이드!)</div>`:""}
      <div class="menu-btns">${menus.map(r=>{
        const t=Core.craftSeconds(DATA,S,r);
        return `<button class="mbtn" data-bake="${r.id}" ${full?"disabled":""} id="bake-${r.id}">
          <span class="me">${r.emoji}</span><span class="mn">${r.name}</span><span class="mi">${r.batch}개 · ${fmtDur(t)}</span></button>`;
      }).join("")}</div>
    </div>`;
  }
  host.innerHTML=html;
}

function todayMenuQuest(){
  const un=Core.unlockedRecipes(DATA,S);
  if(!un.length) return null;
  const day=Math.floor(nowSec()/86400);
  return un[day%un.length];
}
function questState(q){
  if(q.type==="sell_any") return {cur:S.daily.sold,tgt:q.target,label:q.name.replace("{n}",q.target)};
  if(q.type==="sell_menu"){ const m=todayMenuQuest(); return m?{cur:S.daily.soldBy[m.id]||0,tgt:q.target,label:q.name.replace("{menu}",m.emoji+" "+m.name).replace("{n}",q.target)}:null; }
  if(q.type==="upgrade") return {cur:S.daily.upgrades,tgt:q.target,label:q.name};
  return null;
}
function renderQuests(){
  $("#questList").innerHTML=DATA.balance.quests.daily.map(q=>{
    const st=questState(q); if(!st) return "";
    const done=st.cur>=st.tgt, claimed=!!S.daily.claimed[q.id];
    return `<div class="quest"><div>
      <div class="qn">${st.label}</div>
      <div class="qd">보상: 🪙${q.rewardCoins} · XP ${q.rewardXp} · ⭐${q.rewardRep} — ${Math.min(st.cur,st.tgt)}/${st.tgt}</div>
      <div class="qbar"><i style="width:${Math.min(100,st.cur/st.tgt*100)}%"></i></div></div>
      <button class="qbtn${claimed?" claimed":""}" data-claim="${q.id}" ${(!done||claimed)?"disabled":""}>${claimed?"완료":"받기"}</button>
    </div>`;
  }).join("")+`<p style="text-align:center;font-size:10.5px;color:var(--mut);font-weight:700;margin-top:6px">매일 자정(KST) 리셋</p>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-claim]"); if(!b||!S) return;
  const q=DATA.balance.quests.daily.find(x=>x.id===b.dataset.claim);
  const st=questState(q);
  if(!q||!st||st.cur<st.tgt||S.daily.claimed[q.id]) return;
  S.daily.claimed[q.id]=true;
  S.coins+=q.rewardCoins; S.rep+=q.rewardRep;

  toast("🎁 퀘스트 보상! 🪙"+q.rewardCoins+" +XP"+q.rewardXp);
  queueLevelUps(ups);
  renderQuests(); renderHeader(); saveLocal();
});

let pendingSales=[]; // {recipeId} 큐 (판매 1건 = 손님 1명 연출, 과다 시 합침)
let custTimer=0;
function pickCustomer(){
  const bal=DATA.balance.customers;
  const members=DATA.members.members.filter(m=>m.unlockLevel<=S.level);
  if(members.length&&Math.random()<bal.memberShare){
    const tw=members.reduce((a,m)=>a+(m.visitWeight||1),0);
    let r=Math.random()*tw;
    for(const m of members){ r-=(m.visitWeight||1); if(r<=0) return {type:"member",m}; }
    return {type:"member",m:members[0]};
  }
  const walk=DATA.customers.types.find(t=>t.id==="walkin");
  return {type:"walkin",emoji:walk.emojiPool[Math.floor(Math.random()*walk.emojiPool.length)],lines:walk.lines};
}

  const el=document.createElement("div"); el.className="cust";
  let heart="";
  const regEnabled=S.level>=DATA.balance.regulars.unlockLevel;
  if(c.type==="member"){
    S.seenMembers[c.m.id]=(S.seenMembers[c.m.id]||0)+1;
    let isReg=false;

      if(S.regulars[c.m.id]===DATA.balance.regulars.visitsToRegular) toast("❤️ "+c.m.nickname+"님이 단골이 되었어요!");

   레벨업 연출 (T6)
   =================================================================== */
let lvQueue=[], lvShowing=false;
function queueLevelUps(ups){ for(const lv of ups) lvQueue.push(lv); showNextLevelUp(); }
function levelEntry(lv){
  return DATA.levels.levels.find(x=>x.level===lv)||DATA.levels.roadmap.find(x=>x.level===lv)||null;
}
function showNextLevelUp(){
  if(lvShowing||!lvQueue.length) return;
  lvShowing=true;
  const lv=lvQueue.shift();
  const entry=levelEntry(lv);
  $("#luLv").textContent="Lv."+lv;
  $("#luHead").textContent=entry?entry.headline:"빵집이 성장했어요!";
  const cards=[];
  if(entry&&entry.unlocks){
    const u=entry.unlocks;
    for(const id of (u.menus||[])){ const r=Core.recipeById(DATA,id); if(r) cards.push({e:r.emoji,n:r.name,t:"새 메뉴"}); }
    for(const id of (u.equipment||[])){ const eq=Core.equipById(DATA,id); if(eq) cards.push({e:eq.emoji,n:eq.name,t:"새 장비"}); }
    for(const id of (u.slots||[])){ const s=DATA.levels.slots.find(x=>x.id===id); if(s) cards.push({e:s.emoji,n:s.name,t:"공간"}); }
    for(const id of (u.customers||[])){ const c=DATA.customers.types.find(x=>x.id===id); if(c&&!c.roadmap) cards.push({e:"💛",n:c.name,t:"새 손님"}); }
    if((u.features||[]).includes("coffee_machine")) cards.push({e:"☕",n:"커피머신",t:"커피 제작 단축"});
    if((u.features||[]).includes("regulars")) cards.push({e:"❤️",n:"단골 시스템",t:"멤버 단골"});
    if((u.features||[]).includes("grade_up")){ const g=Core.gradeForLevel(DATA,lv); cards.push({e:g.emoji,n:g.name,t:"등급 상승!"}); }
  }
  $("#luCards").innerHTML=cards.map(c=>`<div class="ucard"><span class="ue">${c.e}</span><span class="un">${c.n}</span><span class="ut">${c.t}</span></div>`).join("")
    ||`<div class="ucard"><span class="ue">📈</span><span class="un">성장 지속</span><span class="ut">다음 해금으로!</span></div>`;
  $("#lvup").classList.add("on");
}
$("#luOk").addEventListener("click",()=>{
  $("#lvup").classList.remove("on"); lvShowing=false;
  renderAll(); saveLocal();
  if(ftueStep===3){ ftueAdvance(4); }
  showNextLevelUp();
});

/* ===================================================================
   FTUE (T10)
   step 0: 이름 짓기 → 1: 오븐 유도 → 2: 베이킹 대기 → 3: 첫 손님·Lv2 → 4: 퀘스트 안내 → done
   =================================================================== */
let ftueStep=-1;
function guide(msg,anchorSel){
  const g=$("#guide");
  if(!msg){ g.style.display="none"; document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl")); return; }
  g.style.display=""; g.textContent=msg;
  document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  let top=120;
  if(anchorSel){ const a=document.querySelector(anchorSel); if(a){ a.classList.add("hl"); const r=a.getBoundingClientRect(); top=Math.max(60,r.top-58); } }
  g.style.top=top+"px";
}
function ftueAdvance(step){
  ftueStep=step; S.ftue.step=step;
  if(step===1){
    switchTab("kitchen");
    setTimeout(()=>guide("오븐에서 🥯 모닝롤을 구워보세요! (첫 베이킹은 5초)","#bake-morning_roll"),80);
  }else if(step===2){
    guide("굽는 중… 완성되면 진열대로 자동 이동해요!",null);
  }else if(step===3){
    guide(null);
  }else if(step===4){
    switchTab("quest");
    setTimeout(()=>guide("매일 3가지 퀘스트로 보너스를 받아요. 이제 자유롭게 운영해보세요!",null),120);
    setTimeout(()=>{ guide(null); ftueStep=99; S.ftue.done=true; S.ftue.step=99; switchTab("home"); toast("🥖 이제 당신의 빵집입니다!"); saveLocal(); },3400);
  }
  saveLocal();
}
function ftueTick(){
  // step2: 튜토리얼 베이킹 완료 감지 → 첫 손님(호스트 멤버) 확정 구매
  if(ftueStep===2&&(S.stock.morning_roll||0)>0){
    ftueStep=2.5;
    switchTab("home");
    guide("첫 손님이 왔어요!",null);
    const host=DATA.members.members.find(m=>m.unlockLevel<=1)||null;
    setTimeout(()=>{
      const res=Core.sellUnits(DATA,S,"morning_roll",4,true,Math.random);
      // 첫 판매 보너스: §9 스크립트가 Lv.2 달성을 보장하도록 부족분을 채움
      let bonus=DATA.balance.ftue.firstSaleBonusXp;
      if(S.level===1) bonus=Math.max(bonus,Core.xpNeed(DATA,1)-S.xp);
      const ups=Core.addXp(DATA,S,bonus);
      spawnCustomer({recipeId:"morning_roll"});
      if(res) toast("🪙 첫 판매! +"+res.coins+"코인"+(host?" — "+host.nickname+"님":""));
      guide(null);
      ftueAdvance(3);
      const all=(res?res.levelUps:[]).concat(ups);
      if(all.length) queueLevelUps(all); else ftueAdvance(4);
      renderAll();
    },2400);
  }
}
function startFtue(){
  ftueStep=0;
  modal("🏠","빵집 오픈!","엑서타운 골목에 당신의 빵집이 문을 엽니다.<br>빵집 이름을 지어주세요.",{
    input:true,inputValue:"",okText:"개업하기 🎉",
    cb:(v)=>{
      S.name=(v||"").trim()||"엑서 빵집";
      renderHeader(); ftueAdvance(1);
    }
  });
}

/* ===================================================================
   오프라인 정산 (T7)
   =================================================================== */
function offlineSettleAndShow(){
  const away=nowSec()-(S.lastSeenAt||nowSec());
  const rep=Core.offlineSettle(DATA,S,away);
  if(!rep) return;
  S.lastSeenAt=nowSec();
  if(rep.sold<=0&&rep.levelUps.length===0){ renderAll(); return; }
  const items=Object.keys(rep.soldBy).map(id=>{
    const r=Core.recipeById(DATA,id); return r.emoji+" "+r.name+" <b>"+rep.soldBy[id]+"개</b>";
  }).join("<br>");
  modal("🛎️","다녀오셨네요!",
    "<b>"+fmtDur(rep.awaySec)+"</b> 동안 빵집이 열심히 팔았어요.",
    {list:(items||"판매 없음")+"<br>─────────<br>🪙 <b>+"+fmt(rep.coins)+"</b> · XP <b>+"+rep.xp+"</b>"+(rep.tips?" · 팁 항아리 💰"+rep.tips:""),
     okText:"받기",cb:()=>{ queueLevelUps(rep.levelUps); }});
  renderAll();
}

/* ===================================================================
   헤더/공통 렌더
   =================================================================== */
function renderHeader(){
  $("#hName").textContent=S.name||"엑서 빵집";
  const g=Core.gradeForLevel(DATA,S.level);
  $("#hGrade").textContent=g.emoji+" "+g.name;
  $("#hCoins").textContent=fmt(S.coins);
  $("#hRep").textContent=fmt(S.rep);
  $("#hLv").textContent="Lv."+S.level;
  const need=Core.xpNeed(DATA,S.level);
  const pct=need===Infinity?100:Math.min(100,S.xp/need*100);
  $("#hXpFill").style.width=pct+"%";
  $("#hXpTxt").textContent=need===Infinity?"MAX":Math.floor(S.xp)+" / "+need+" XP";
  const nx=Core.nextUnlock(DATA,S.level);
  $("#hNext").innerHTML=nx?("🎯 다음 해금: <b>Lv."+nx.level+"</b> "+nx.headline):"👑 모든 목표 달성!";
  // 탭 알림
  $("#dotQuest").style.display=DATA.balance.quests.daily.some(q=>{const st=questState(q);return st&&st.cur>=st.tgt&&!S.daily.claimed[q.id];})?"":"none";
  $("#dotGrow").style.display=DATA.equipment.equipment.some(e=>{
    if(S.level<e.unlockLevel) return false;
    const c=Core.upgradeCost(DATA,e.id,Core.equipLevel(S,e.id)); return c!=null&&S.coins>=c;
  })?"":"none";
  const idle=Object.keys(S.queues).some(st=>DATA.balance.stations[st].unlockLevel<=S.level&&S.queues[st].length===0);
  $("#dotKitchen").style.display=idle?"":"none";
}
function renderAll(){ renderHeader(); renderScene(); renderStock(); renderKitchen(); renderGrow(); renderQuests(); }

/* ---------- 탭 ---------- */
function switchTab(t){
  TAB=t;
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("on"));
  $("#pane-"+t).classList.add("on");
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
}
$("#tabbar").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) switchTab(b.dataset.tab); });

/* ===================================================================
   메인 루프 — 1초 논리 틱 (rAF, 비활성 시 visibilitychange로 보정)
   =================================================================== */
let lastT=performance.now(), uiAcc=0, saveAcc=0, cloudAcc=0, spawnAcc=0;
function loop(now){
  const dtRaw=Math.min(2,(now-lastT)/1000); lastT=now;
  const dt=dtRaw*WARP;
  if(S&&ftueStep!==0){
    const sum=Core.advance(DATA,S,dt,"online",Math.random);
    lostAcc+=sum.lostDemand;
    if(sum.sold>0){ for(const id in sum.soldBy) for(let i=0;i<sum.soldBy[id];i++) pendingSales.push({recipeId:id}); }
    if(sum.levelUps.length) queueLevelUps(sum.levelUps);
    // 손님 스폰 (판매 연출 동기화, 간판 레벨로 빨라짐)
    spawnAcc+=dtRaw;
    const interval=Math.max(DATA.balance.customers.visitIntervalSecMin,
      DATA.balance.customers.visitIntervalSecBase/Core.signMult(DATA,S));
    if(spawnAcc>=interval){
      spawnAcc=0;
      if(pendingSales.length&&TAB==="home"){
        const sale=pendingSales.shift();
        if(pendingSales.length>8) pendingSales.length=8; // 폭주 방지
        spawnCustomer(sale);
      }
    }
    ftueTick();
    checkDailyReset();
    // UI 갱신
    uiAcc+=dtRaw;
    if(uiAcc>=1){ uiAcc=0;
      renderHeader();
      if(TAB==="home"){ renderScene(); renderStock(); }
      if(TAB==="kitchen") renderKitchen();
      if(TAB==="grow") renderGrow();
      if(TAB==="quest") renderQuests();
    }
    saveAcc+=dtRaw; if(saveAcc>=DATA.balance.save.autosaveSec){ saveAcc=0; saveLocalNow(); }
    cloudAcc+=dtRaw; if(cloudAcc>=DATA.balance.save.cloudSyncSec){ cloudAcc=0; cloudSave(); }
  }
  requestAnimationFrame(loop);
}

/* ---------- 백그라운드 보정 ---------- */
document.addEventListener("visibilitychange",()=>{
  if(!S) return;
  if(document.hidden){ saveLocalNow(); cloudSave(); }
  else{ offlineSettleAndShow(); lastT=performance.now(); }
});
window.addEventListener("beforeunload",()=>{ if(S) saveLocalNow(); });

/* ===================================================================
   디버그 모드 (T2b) — ?debug=<pin>
   =================================================================== */
function initDebug(){
  const pin=new URLSearchParams(location.search).get("debug");
  if(pin!==DATA.balance.debug.pin) return;
  DEBUG=true;
  const d=$("#dbg"); d.classList.add("on");
  d.innerHTML=`<div style="margin-bottom:4px">🛠 DEBUG</div>
    <button data-dbg="w1">×1</button><button data-dbg="w10">×10</button><button data-dbg="w60">×60</button><br>
    <button data-dbg="coin">+${DATA.balance.debug.grantCoins}🪙</button>
    <button data-dbg="lv">레벨설정</button>
    <button data-dbg="off4">4h정산</button><br>
    <button data-dbg="reset">리셋</button>
    <span id="dbgInfo"></span>`;
  d.addEventListener("click",e=>{
    const b=e.target.closest("[data-dbg]"); if(!b) return;
    const k=b.dataset.dbg;
    if(k==="w1")WARP=1; if(k==="w10")WARP=10; if(k==="w60")WARP=60;
    if(k==="coin"){ S.coins+=DATA.balance.debug.grantCoins; }
    if(k==="lv"){ const v=+prompt("레벨(1~50)",S.level+1); if(v>=1&&v<=50){ S.level=v; S.xp=0; } }
    if(k==="off4"){ S.lastSeenAt=nowSec()-4*3600; offlineSettleAndShow(); }
    if(k==="reset"){ if(confirm("상태를 초기화할까요?")){ localStorage.removeItem(DATA.balance.save.localKey); S=Core.newState(DATA,nowSec()); Core.resetDaily(S,kstDateStr(nowSec())); cloudSave(); location.reload(); return; } }
    $("#dbgInfo").textContent=" ×"+WARP;
    renderAll(); saveLocal();
  });
}

/* ===================================================================
   부트
   =================================================================== */
(async function boot(){
  try{ DATA=await loadData(); }
  catch(e){
    document.body.innerHTML="<p style='padding:40px;text-align:center;font-weight:800'>데이터 로드 실패 😢<br>새로고침해 주세요.</p>";
    return;
  }
  await cloudInit();
  await syncServerTime();

  // 로컬 vs 클라우드 복구 (진행도 높은 쪽)
  let local=null;
  try{ local=JSON.parse(localStorage.getItem(DATA.balance.save.localKey)); }catch(e){}
  const cloud=await cloudLoad();
  let chosen=null;
  if(local&&cloud) chosen=progressScore(cloud)>progressScore(local)?cloud:local;
  else chosen=local||cloud;
  if(chosen){ S=Core.migrate(DATA,chosen)||Core.newState(DATA,nowSec()); }
  else S=Core.newState(DATA,nowSec());
  // 필드 보강(구버전/부분 저장 대비)
  const fresh=Core.newState(DATA,nowSec());
  for(const k in fresh) if(S[k]===undefined) S[k]=fresh[k];

  if(!S.daily.date) Core.resetDaily(S,kstDateStr(nowSec()));
  checkDailyReset();
  initDebug();
  renderAll();

  if(!S.ftue.done){
    ftueStep=S.ftue.step||0;
    if(ftueStep<=0) startFtue();
    else if(ftueStep<3) ftueAdvance(1); // 중단된 튜토리얼은 베이킹 단계부터 재개
    else{ S.ftue.done=true; ftueStep=99; }
  }else{
    ftueStep=99;
    offlineSettleAndShow();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
