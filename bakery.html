<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#8a5a33" />
<title>엑서 빵집 타이쿤</title>
<meta name="description" content="내 이름을 건 빵집을 꾸미고 키운다 — 손님이 걸어 들어오는 쿼터뷰 빵집 경영 게임." />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f3e7d3;--milk:#fffdf8;--cream:#f7ead6;
  --ink:#33220f;--ink2:#6a4e30;--mut:#a1876a;--line:rgba(130,90,45,.15);--line2:rgba(130,90,45,.3);
  --brown:#8a5a33;--brown2:#b0793f;--gold:#e8b64c;--green:#4cae7d;--red:#e06d6d;--blue:#5f8fd9;
  --ease:cubic-bezier(.16,1,.3,1);
  --shadow:0 10px 26px rgba(90,55,20,.15);--shadow-s:0 4px 12px rgba(90,55,20,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;color:var(--ink);background:var(--bg);
  min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
.app{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}

/* ===== 헤더 ===== */
.top{z-index:30;padding:8px 12px 8px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,251,243,.98),rgba(255,251,243,.92))}
.top-row{display:flex;align-items:center;gap:8px}
.shop-name{min-width:0;flex:1}
.shop-name b{display:block;font-size:14.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:var(--brown);
  background:rgba(176,121,63,.12);padding:2px 7px;border-radius:999px;margin-top:2px}
.res{display:flex;gap:5px}
.res .pill{display:flex;flex-direction:column;align-items:flex-end;background:var(--milk);border:1px solid var(--line);
  border-radius:10px;padding:3px 9px;box-shadow:var(--shadow-s);min-width:66px}
.res .pill small{font-size:9px;font-weight:800;color:var(--mut)}
.res .pill b{font-size:13.5px;font-weight:900;letter-spacing:-.03em}
.back{font-size:10.5px;font-weight:800;color:var(--mut);padding:4px 2px;text-decoration:none;text-align:center;line-height:1.25}
.lvrow{display:flex;align-items:center;gap:7px;margin-top:7px}
.lvbadge{flex:none;display:grid;place-items:center;min-width:44px;height:26px;border-radius:9px;font-size:11.5px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--brown2),var(--brown));box-shadow:var(--shadow-s);padding:0 6px}
.xpbar{flex:1;height:13px;border-radius:8px;background:rgba(130,90,45,.14);overflow:hidden;position:relative;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#f4d27e);transition:width .5s var(--ease)}
.xpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;color:var(--ink2)}
.nextgoal{margin-top:5px;font-size:10.5px;font-weight:750;color:var(--ink2);display:flex;gap:5px;align-items:center;overflow:hidden;white-space:nowrap}
.nextgoal b{color:var(--brown)}
.mood{margin-left:auto;flex:none;font-size:10px;font-weight:900;color:#7a5db8;background:rgba(140,110,220,.12);border-radius:999px;padding:2px 8px}

/* ===== 씬(쿼터뷰) ===== */
.viewport{flex:1;position:relative;overflow:hidden;touch-action:manipulation}
.grade-1 .viewport{background:linear-gradient(180deg,#efe0c6 0%,#e7d3b3 100%)}
.grade-2 .viewport{background:linear-gradient(180deg,#f3ddc9 0%,#ecccab 100%)}
.grade-3 .viewport{background:linear-gradient(180deg,#e6e2d2 0%,#d9d2bc 100%)}
.room{position:absolute;left:50%;top:50%;transform-origin:center}
.wallL,.wallR{position:absolute;box-shadow:inset 0 -8px 14px rgba(0,0,0,.10)}
.grade-1 .wallL{background:linear-gradient(180deg,#e9cfa7,#dfc094)}
.grade-1 .wallR{background:linear-gradient(180deg,#f2dcb8,#e9cfa4)}
.grade-2 .wallL{background:linear-gradient(180deg,#e6b58c,#daa87e)}
.grade-2 .wallR{background:linear-gradient(180deg,#f0c69e,#e6b78d)}
.grade-3 .wallL{background:linear-gradient(180deg,#c9c2a8,#bcb497)}
.grade-3 .wallR{background:linear-gradient(180deg,#d8d1b8,#cbc3a8)}
.tile{position:absolute;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.grade-1 .tile{background:linear-gradient(115deg,#d2a877 46%,#c99f6e 46%,#c99f6e 52%,#d2a877 52%)}
.grade-1 .tile.alt{background:linear-gradient(115deg,#c69c6b 46%,#bd9362 46%,#bd9362 52%,#c69c6b 52%)}
.grade-2 .tile{background:linear-gradient(115deg,#c39263 46%,#b9895a 46%,#b9895a 52%,#c39263 52%)}
.grade-2 .tile.alt{background:linear-gradient(115deg,#b7885c 46%,#ad7e52 46%,#ad7e52 52%,#b7885c 52%)}
.grade-3 .tile{background:linear-gradient(115deg,#b1a37b 46%,#a79971 46%,#a79971 52%,#b1a37b 52%)}
.grade-3 .tile.alt{background:linear-gradient(115deg,#a4966e 46%,#9a8c64 46%,#9a8c64 52%,#a4966e 52%)}
.tile{background-clip:padding-box}
.tile.editable{outline:none;filter:brightness(1.06)}
.tile.editok{background:rgba(96,200,130,.75)!important;cursor:pointer}
.tile.editno{background:rgba(190,90,90,.4)!important}
.obj{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-82%);pointer-events:none}
.obj.tappable{pointer-events:auto}
.obj .oe{line-height:1;filter:drop-shadow(0 4px 3px rgba(60,30,5,.28))}
.obj .on{font-size:8px;font-weight:800;color:#fff;background:rgba(80,50,20,.55);border-radius:999px;padding:1px 6px;margin-top:1px;white-space:nowrap}
.obj .badge{position:absolute;top:-7px;right:-13px;font-size:8.5px;font-weight:900;color:#fff;background:var(--brown2);border-radius:999px;padding:1px 5px;box-shadow:var(--shadow-s)}
.obj .prog{position:absolute;top:-13px;left:50%;transform:translateX(-50%);width:40px;height:6px;border-radius:4px;background:rgba(50,30,10,.4);overflow:hidden}
.obj .prog i{display:block;height:100%;background:linear-gradient(90deg,#7de0a8,#4cae7d);width:0}
.obj .zz{position:absolute;top:-16px;right:-10px;font-size:12px;animation:bob 1.4s infinite}
.obj.tappable{cursor:pointer}
.obj.tappable:active .oe{transform:scale(.92)}
.obj .tipband{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:900;color:#7c5a12;
  background:rgba(232,182,76,.95);border-radius:999px;padding:1px 7px;white-space:nowrap;animation:bob 1.3s infinite;box-shadow:var(--shadow-s)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-4px)}}
.obj .zz{transform:none}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.obj .zz{animation:bob2 1.4s infinite}
/* 손님 */
.actor{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-88%);pointer-events:none;transition:none}
.actor .ae{line-height:1;filter:drop-shadow(0 3px 3px rgba(60,30,5,.3))}
.actor.walk .ae{animation:step .45s infinite}
@keyframes step{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
.actor .an{font-size:8px;font-weight:800;color:#fff;background:rgba(90,55,120,.72);border-radius:999px;padding:1px 6px;margin-top:1px;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis}
.actor .heart{position:absolute;top:-9px;right:-9px;font-size:10px}
.actor .want{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;background:#fff;border-radius:10px;padding:2px 6px;
  box-shadow:var(--shadow-s);border:1px solid var(--line);white-space:nowrap}
.actor .want::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff;border-bottom:0}
/* 말풍선 */
.say{position:absolute;transform:translate(-50%,-100%);max-width:170px;background:#fff;border-radius:11px;padding:6px 9px;font-size:10.5px;font-weight:750;
  color:var(--ink);box-shadow:var(--shadow-s);border:1px solid var(--line);opacity:0;transition:opacity .25s;pointer-events:none;z-index:900}
.say.on{opacity:1}
.say small{display:block;font-size:8.5px;color:var(--brown);font-weight:900;margin-bottom:1px}
/* 간판(벽) */
.signboard{position:absolute;font-size:11px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--brown2),var(--brown));
  border-radius:9px;padding:4px 10px;box-shadow:var(--shadow);white-space:nowrap}
.signboard small{opacity:.85;font-size:9px;margin-left:3px}

/* ===== FAB ===== */
.fabs{position:absolute;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:9px}
.fab{position:relative;width:52px;height:52px;border-radius:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--milk);border:1px solid var(--line);box-shadow:var(--shadow);font-size:20px}
.fab small{font-size:8.5px;font-weight:900;color:var(--ink2)}
.fab:active{transform:scale(.94)}
.fab .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:99px;background:var(--red)}
.fab.editing{background:linear-gradient(135deg,#8fd6ac,#4cae7d);color:#fff}
.fab.editing small{color:#eafff3}

/* ===== 바텀 시트 ===== */
.sheetwrap{position:absolute;inset:0;z-index:50;display:none;background:rgba(51,34,15,.35)}
.sheetwrap.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow-y:auto;background:var(--milk);border-radius:20px 20px 0 0;
  box-shadow:0 -10px 34px rgba(60,35,10,.25);padding:14px 14px calc(16px + env(safe-area-inset-bottom));animation:up .28s var(--ease)}
@keyframes up{0%{transform:translateY(40%);opacity:.4}100%{transform:translateY(0);opacity:1}}
.sheet h4{font-size:14px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:6px;margin-bottom:11px}
.sheet h4 .x{margin-left:auto;font-size:12px;color:var(--mut);font-weight:800;padding:4px 8px}
/* 주방 시트 */
.qrow{display:flex;gap:7px;margin-bottom:10px}
.qslot{flex:1;position:relative;height:54px;border-radius:12px;border:1.5px dashed var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.qslot.busy{border-style:solid;background:var(--cream)}
.qslot .qe{font-size:19px;line-height:1}
.qslot .qt{font-size:9px;font-weight:800;color:var(--ink2)}
.qslot .qp{position:absolute;left:6px;right:6px;bottom:4px;height:4px;border-radius:3px;background:rgba(130,90,45,.15);overflow:hidden}
.qslot .qp i{display:block;height:100%;background:var(--green);width:0}
.qslot .plus{font-size:15px;color:var(--mut);font-weight:900}
.menu-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px;border-radius:12px;background:linear-gradient(135deg,#f6e7cf,#efdcbc);
  border:1px solid var(--line);font-weight:800}
.mbtn:active{transform:scale(.95)}
.mbtn:disabled{opacity:.45}
.mbtn .me{font-size:20px;line-height:1}
.mbtn .mn{font-size:10.5px;font-weight:900}
.mbtn .mi{font-size:9px;color:var(--ink2);font-weight:750}
.blocked{margin-top:9px;font-size:10.5px;color:var(--red);font-weight:800}
/* 목록(장비/가구/퀘스트/재고) */
.rowitem{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;
  background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.rowitem .re{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:22px;background:#fff;border:1px solid var(--line);position:relative}
.rowitem .re .elv{position:absolute;right:-5px;bottom:-5px;font-size:8.5px;font-weight:900;color:#fff;background:var(--brown);border-radius:999px;padding:1px 5px}
.rowitem .rn{font-size:13px;font-weight:900}
.rowitem .rd{font-size:10.5px;font-weight:700;color:var(--ink2);margin-top:2px;line-height:1.45}
.rowitem .rb{padding:9px 12px;border-radius:11px;background:linear-gradient(135deg,var(--brown2),var(--brown));color:#fff;font-weight:900;font-size:12px;white-space:nowrap;box-shadow:var(--shadow-s)}
.rowitem .rb:disabled{background:#e3d5c0;color:#af9878;box-shadow:none}
.rowitem .rb.max{background:rgba(76,174,125,.18);color:#28734f}
.rowitem .rb.green{background:linear-gradient(135deg,#69b98a,var(--green))}
.rowitem .rb.claimed{background:rgba(76,174,125,.16);color:#28734f}
.rowitem.dim{opacity:.55}
.qbar{margin-top:6px;height:7px;border-radius:6px;background:rgba(130,90,45,.13);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--blue);width:0;border-radius:6px}
.gstep{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:750;color:var(--mut);padding:3px 0}
.gstep.onx{color:var(--ink);font-weight:900}
.gstep .gdot{width:8px;height:8px;border-radius:99px;background:var(--line2)}
.gstep.onx .gdot{background:var(--gold)}
.subhead{font-size:11px;font-weight:900;color:var(--ink2);margin:12px 2px 8px}
/* 배치 트레이 */
.tray{position:absolute;left:0;right:0;bottom:0;z-index:45;background:rgba(255,253,248,.97);border-top:1px solid var(--line);
  padding:9px 12px calc(10px + env(safe-area-inset-bottom));display:none}
.tray.on{display:block}
.tray .t-head{display:flex;align-items:center;font-size:11.5px;font-weight:900;margin-bottom:7px}
.tray .t-head span{color:var(--ink2);font-weight:750;font-size:10px;margin-left:8px}
.tray .t-head button{margin-left:auto;font-size:11px;font-weight:900;color:#fff;background:var(--green);border-radius:999px;padding:5px 12px}
.trayrow{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.tchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 10px;border-radius:12px;background:var(--cream);
  border:1.5px solid var(--line);font-weight:800;min-width:60px}
.tchip.sel{border-color:var(--green);background:rgba(96,200,130,.18)}
.tchip .te{font-size:20px;line-height:1}
.tchip .tn{font-size:9px;font-weight:900}
.tchip .tc{font-size:9px;color:var(--ink2);font-weight:800}
.tchip.shopbtn{background:linear-gradient(135deg,#f4d27e,var(--gold));border-color:transparent}

/* ===== 토스트/모달/연출 (기존 유지) ===== */
.toast{position:fixed;left:50%;bottom:110px;z-index:70;transform:translate(-50%,14px);opacity:0;pointer-events:none;padding:10px 15px;border-radius:999px;
  background:rgba(51,34,15,.94);color:#fff;font-weight:800;font-size:12.5px;box-shadow:var(--shadow);transition:all .22s var(--ease);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;padding:22px;background:rgba(51,34,15,.55);backdrop-filter:blur(4px)}
.modal.on{display:grid}
.mcard{background:var(--milk);border-radius:22px;padding:22px 20px;max-width:360px;width:100%;box-shadow:var(--shadow);text-align:center;max-height:82dvh;overflow-y:auto}
.mcard .mi{font-size:44px;line-height:1.1}
.mcard h3{font-size:19px;font-weight:900;letter-spacing:-.03em;margin:8px 0 5px}
.mcard p{font-size:13px;font-weight:650;color:var(--ink2);line-height:1.6}
.mcard .list{margin:12px 0 2px;text-align:left;background:var(--cream);border-radius:13px;padding:10px 13px;font-size:12.5px;font-weight:800;line-height:1.9}
.mcard .list b{color:var(--brown)}
.mcard input{width:100%;margin-top:14px;padding:12px;border-radius:12px;border:1.5px solid var(--line2);font:inherit;font-weight:800;text-align:center;background:#fff}
.mcard .mbig{width:100%;margin-top:15px;padding:13px;border-radius:13px;font-weight:900;font-size:14.5px;color:#fff;
  background:linear-gradient(135deg,var(--brown2),var(--brown));box-shadow:var(--shadow-s)}
.lvup{position:fixed;inset:0;z-index:90;display:none;place-items:center;padding:22px;background:radial-gradient(circle at 50% 30%,rgba(232,182,76,.35),rgba(51,34,15,.78))}
.lvup.on{display:grid}
.lvcard{background:var(--milk);border-radius:24px;padding:26px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.lvcard .big{font-size:15px;font-weight:900;color:var(--brown);letter-spacing:.1em}
.lvcard .lvn{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;margin:6px 0}
.lvcard .hd{font-size:15px;font-weight:900;margin-bottom:10px}
.cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:10px 0 4px}
.ucard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--cream);border-radius:12px;padding:9px 11px;min-width:74px}
.ucard .ue{font-size:24px;line-height:1.1}
.ucard .un{font-size:10px;font-weight:900}
.ucard .ut{font-size:8.5px;font-weight:800;color:var(--brown)}
.hl{filter:drop-shadow(0 0 10px rgba(232,182,76,1)) drop-shadow(0 0 22px rgba(232,182,76,.8))!important}
.guide{position:fixed;left:50%;transform:translateX(-50%);z-index:65;background:#33220f;color:#fff;font-size:12.5px;font-weight:800;
  padding:10px 15px;border-radius:13px;box-shadow:var(--shadow);max-width:86vw;text-align:center;pointer-events:none}
.coinpop{position:fixed;z-index:75;font-weight:900;color:var(--brown);font-size:14px;pointer-events:none;text-shadow:0 1px 4px rgba(255,255,255,.8);animation:floatUp .9s var(--ease) forwards}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translateY(-42px) scale(1.06)}}
.dbg{position:fixed;left:8px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:35;background:rgba(20,14,8,.92);color:#9fe8b8;font-size:10.5px;border-radius:12px;padding:9px;display:none;max-width:180px}
.dbg.on{display:block}
.dbg button{display:inline-block;margin:2px;background:#2c2216;color:#ffd98a;border-radius:7px;padding:4px 7px;font-size:10px;font-weight:800}
/* ===== 캐릭터/설비 애니메이션 (bakery-art.js SVG용) ===== */
.charwrap{display:block;line-height:0}
.charwrap svg{transition:transform .15s}
.actor.flip .charwrap svg{transform:scaleX(-1)}
.chibi .leg,.chibi .arm{transform-box:view-box}
.walk .chibi .legL{animation:swingA .48s infinite}
.walk .chibi .legR{animation:swingB .48s infinite}
.walk .chibi .armL{animation:swingB .48s infinite}
.walk .chibi .armR{animation:swingA .48s infinite}
@keyframes swingA{0%,100%{transform:rotate(24deg)}50%{transform:rotate(-24deg)}}
@keyframes swingB{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(24deg)}}
.actor.eating .chibi .armR{animation:eat 1.1s infinite}
@keyframes eat{0%,100%{transform:rotate(0)}45%{transform:rotate(-58deg)}60%{transform:rotate(-58deg)}}
.staffwrap{display:block;line-height:0}
.staffwrap.working .chibi .armR{animation:knead .55s infinite}
.staffwrap.working .chibi .armL{animation:knead .55s infinite reverse}
@keyframes knead{0%,100%{transform:rotate(-26deg)}50%{transform:rotate(18deg)}}
.idlebob{animation:bob2 2.4s infinite;display:block}
.smoke circle{animation:puff 1.7s infinite}
@keyframes puff{0%{transform:translateY(2px);opacity:.75}100%{transform:translateY(-16px);opacity:0}}
.fireflick{animation:flick .45s infinite alternate;transform-box:view-box;transform-origin:center}
@keyframes flick{from{opacity:.8}to{opacity:1}}
.jarshine{animation:bob2 1.3s infinite;transform-box:view-box}
.deco{font-size:30px;line-height:1;filter:drop-shadow(0 5px 4px rgba(60,30,5,.3))}
.obj svg{display:block}
.obj .on{margin-top:-4px}

<script>
"use strict";
/* ===================================================================
   엑서 빵집 타이쿤 — 아이러브커피식 쿼터뷰 클라이언트 (v2)
   경제·생산·정산은 assets/bakery-core.js 엔진(시뮬레이터와 공유),
   이 파일은 쿼터뷰 씬·손님 동선·배치 모드·연출·저장만 담당한다.
   =================================================================== */
const SUPA={url:"https://drggzlnzwvkhtalvkqyo.supabase.co",anon:"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyZ2d6bG56d3ZraHRhbHZrcXlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NjI1MzcsImV4cCI6MjA5NzUzODUzN30.PRxFdiwhVNUoyLbOkiyJ_9PxX6QXFyI_6NMLHPmOr_E"};
const $=s=>document.querySelector(s);
const Core=window.BakeryCore;

let DATA=null,S=null,sb=null,sbUser=null;
let serverOffsetMs=0,WARP=1,DEBUG=false;

/* ---------- 시간 ---------- */
function nowSec(){return (Date.now()+serverOffsetMs)/1000;}
function kstDateStr(sec){return new Date((sec+9*3600)*1000).toISOString().slice(0,10);}
async function syncServerTime(){
  try{ if(sb){const r=await sb.rpc("bakery_now"); if(!r.error&&r.data){serverOffsetMs=new Date(r.data).getTime()-Date.now();return;}} }catch(e){}
  try{ const res=await fetch(SUPA.url+"/rest/v1/",{method:"HEAD",headers:{apikey:SUPA.anon}});
    const d=res.headers.get("date"); if(d){serverOffsetMs=new Date(d).getTime()-Date.now();return;} }catch(e){}
  serverOffsetMs=0;
}

/* ---------- 데이터 ---------- */
async function loadData(){
  const files=["balance","recipes","equipment","levels","customers","members","furniture"];
  const out={};
  await Promise.all(files.map(async f=>{out[f]=await (await fetch("data/"+f+".json?v=2")).json();}));
  out.members.members=(out.members.members||[]).filter(m=>m.active); // active=false 즉시 미등장
  return out;
}

/* ---------- 저장 ---------- */
function progressScore(st){return (st.level||1)*1e6+(st.totalSold||0);}
let _saveT=null;
function saveLocal(){clearTimeout(_saveT);_saveT=setTimeout(saveLocalNow,300);}
function saveLocalNow(){try{S.lastSeenAt=nowSec();localStorage.setItem(DATA.balance.save.localKey,JSON.stringify(S));}catch(e){}}
async function cloudInit(){
  try{
    if(!window.supabase)return;
    sb=window.supabase.createClient(SUPA.url,SUPA.anon);
    let ses=(await sb.auth.getSession()).data.session;
    if(!ses){await sb.auth.signInAnonymously();ses=(await sb.auth.getSession()).data.session;}
    sbUser=ses?ses.user:null;
  }catch(e){sb=null;sbUser=null;}
}
async function cloudLoad(){
  if(!sb||!sbUser)return null;
  try{const r=await sb.from(DATA.balance.save.cloudTable).select("state").eq("uid",sbUser.id).maybeSingle();
    return (r.data&&r.data.state)||null;}catch(e){return null;}
}
let _cloudBusy=false;
async function cloudSave(){
  if(!sb||!sbUser||_cloudBusy)return;
  _cloudBusy=true;
  try{S.lastSeenAt=nowSec();
    await sb.from(DATA.balance.save.cloudTable).upsert({uid:sbUser.id,state:S,ver:S.v},{onConflict:"uid"});
  }catch(e){}finally{_cloudBusy=false;}
}

/* ---------- 유틸 ---------- */
function fmt(n){n=Math.floor(n);return n<10000?n.toLocaleString("en-US"):(n<1e8?(Math.floor(n/100)/100)+"만":(Math.floor(n/1e6)/100)+"억");}
function fmtDur(sec){sec=Math.max(0,Math.round(sec));if(sec<90)return sec+"초";if(sec<3600)return Math.round(sec/60)+"분";return (Math.floor(sec/360)/10)+"시간";}
let _toastT=null;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(_toastT);_toastT=setTimeout(()=>t.classList.remove("on"),2400);}
let _modalCb=null;
function modal(icon,title,body,opt){
  opt=opt||{};
  $("#mIcon").textContent=icon;$("#mTitle").textContent=title;$("#mBody").innerHTML=body||"";
  const list=$("#mList");if(opt.list){list.style.display="";list.innerHTML=opt.list;}else list.style.display="none";
  const inp=$("#mInput");if(opt.input){inp.style.display="";inp.value=opt.inputValue||"";setTimeout(()=>inp.focus(),150);}else inp.style.display="none";
  $("#mOk").textContent=opt.okText||"확인";_modalCb=opt.cb||null;
  $("#modal").classList.add("on");
}
$("#mOk").addEventListener("click",()=>{
  const v=$("#mInput").value;
  if(_modalCb){const keep=_modalCb(v);if(keep===true)return;}
  $("#modal").classList.remove("on");
});
function coinPop(x,y,txt){
  const el=document.createElement("div");el.className="coinpop";el.textContent=txt;
  el.style.left=x+"px";el.style.top=y+"px";document.body.appendChild(el);
  setTimeout(()=>el.remove(),950);
}

/* ===================================================================
   쿼터뷰 씬 (T3 재작성)
   =================================================================== */
const TW=64,TH=32,WALLH=76;
const Art=window.BakeryArt;
let ROOM={w:7,h:5},roomScale=1;
function roomFor(level){
  let r=DATA.levels.roomTable[0];
  for(const x of DATA.levels.roomTable)if(level>=x.minLevel)r=x;
  return r;
}
function isoX(x,y){return ROOM.h*TW/2+(x-y)*TW/2;}
function isoY(x,y){return WALLH+(x+y)*TH/2+TH/2;}
function roomPx(){return {w:(ROOM.w+ROOM.h)*TW/2,h:WALLH+(ROOM.w+ROOM.h)*TH/2+TH};}

/* 고정 설비 배치 (방 크기의 함수) */
function fixtures(){
  const w=ROOM.w,h=ROOM.h;
  const fx={
    oven:{x:1,y:0},
    coffeebar:{x:3,y:0},
    display:{x:w-2,y:0},
    counter:{x:w-2,y:2},
  };
  fx.queueSpots=[{x:w-2,y:3},{x:w-3,y:4},{x:w-4,y:4},{x:w-4,y:3}];
  fx.door={x:0,y:h-1};
  fx.spawn={x:-1.6,y:h-1};
  fx.corridor={x:1,y:h-2};
  return fx;
}
function blockedTiles(){
  const fx=fixtures(),set=new Set();
  const put=t=>set.add(t.x+","+t.y);
  put(fx.oven);put(fx.coffeebar);put(fx.display);put(fx.counter);
  fx.queueSpots.forEach(put);put(fx.door);
  put({x:fx.counter.x,y:1}); // 캐셔 자리(진열대-카운터 사이)
  put({x:0,y:ROOM.h-2}); // 문 앞 통로
  for(const it of S.layout)put(it);
  return set;
}
const SLOT_EMOJI={
  oven:()=> "🧱",  coffeebar:()=>Core.hasCoffeeMachine(DATA,S)?"☕":"🫖",
  display:()=>"🧺", counter:()=>"🧾"
};
let EDIT=false,SELECTED=null; // 배치 모드
function objSize(kind){return kind==="big"?34:28;}

function renderRoom(){
  ROOM=roomFor(S.level);
  const room=$("#room"),px=roomPx();
  const grade=Core.gradeForLevel(DATA,S.level);
  $("#app").className="app "+(["grade-1","grade-2"].includes(grade.themeClass)?grade.themeClass:"grade-3");
  room.style.width=px.w+"px";room.style.height=px.h+"px";
  // 뷰포트에 맞춰 스케일
  const vp=$("#viewport");
  const availW=Math.min(vp.clientWidth-8,520),availH=vp.clientHeight-(EDIT?110:20);
  roomScale=Math.min(availW/px.w,availH/px.h,1.7);
  room.style.transform="translate(-50%,-52%) scale("+roomScale+")";
  const fx=fixtures();
  let html="";
  // 벽 (스큐 사각형 2장) — 바닥 다이아몬드의 좌상/우상 모서리에 밀착
  // 좌측 바닥 모서리: (X0, WALLH) → (0, WALLH + h*TH/2) : 왼쪽으로 갈수록 아래 → skewY(-θ), origin 우상단
  // 우측 바닥 모서리: (X0, WALLH) → (X0 + w*TW/2, WALLH + w*TH/2) : 오른쪽으로 갈수록 아래 → skewY(+θ), origin 좌상단
  const slope=Math.atan2(TH,TW)*180/Math.PI; // 26.565°
  const lw=ROOM.h*TW/2,rw=ROOM.w*TW/2,topX=isoX(0,0);
  html+=`<div class="wallL" style="left:${topX-lw}px;top:0;width:${lw}px;height:${WALLH}px;transform:skewY(-${slope}deg);transform-origin:top right"></div>`;
  html+=`<div class="wallR" style="left:${topX}px;top:0;width:${rw}px;height:${WALLH}px;transform:skewY(${slope}deg);transform-origin:top left"></div>`;
  // 간판 (Lv.5+, 벽 위)
  if(S.level>=Core.equipById(DATA,"sign").unlockLevel)
    html+=`<div class="signboard" data-obj="sign" style="left:${topX+rw*0.45}px;top:${2}px;transform:translateX(-50%)">🪧 ${S.name||"엑서 빵집"} <small>간판 Lv.${Core.equipLevel(S,"sign")}</small></div>`;
  // 바닥 타일
  for(let y=0;y<ROOM.h;y++)for(let x=0;x<ROOM.w;x++){
    html+=`<div class="tile${(x+y)%2?" alt":""}" data-tile="${x},${y}" style="left:${isoX(x,y)-TW/2}px;top:${isoY(x,y)-TH/2}px;width:${TW}px;height:${TH}px"></div>`;
  }
  // 문 — 좌측 벽면 하단(스큐 동일), 창문 — 양쪽 벽, 펜던트 조명
  const doorD=(ROOM.h-1.4)*TW/2; // topX에서 왼쪽으로의 거리
  html+=`<div class="walldeco" style="left:${topX-doorD-23}px;top:${doorD*0.5-8}px;transform:skewY(-${slope}deg);z-index:2">${Art.doorSVG()}</div>`;
  const winD1=ROOM.h*TW*0.14;
  html+=`<div class="walldeco" style="left:${topX-winD1-52}px;top:${winD1*0.5+6}px;transform:skewY(-${slope}deg);z-index:2">${Art.windowSVG()}</div>`;
  const winD2=ROOM.w*TW*0.16, winD3=ROOM.w*TW*0.34;
  html+=`<div class="walldeco" style="left:${topX+winD2}px;top:${winD2*0.5+6}px;transform:skewY(${slope}deg);z-index:2">${Art.windowSVG()}</div>`;
  html+=`<div class="walldeco" style="left:${topX+winD3}px;top:${winD3*0.5+6}px;transform:skewY(${slope}deg);z-index:2">${Art.windowSVG()}</div>`;
  html+=`<div class="walldeco" style="left:${topX-46}px;top:-14px;z-index:3">${Art.lampSVG()}</div>`;
  html+=`<div class="walldeco" style="left:${topX+34}px;top:-14px;z-index:3">${Art.lampSVG()}</div>`;
  room.innerHTML=html;
  renderObjects();
  for(const a of actors)room.appendChild(a.el); // innerHTML 재생성 시 손님 액터 복원
}

function objArt(id,x,y,inner,label,extra,tappable){
  return `<div class="obj${tappable?" tappable":""}" data-obj="${id}"
    style="left:${isoX(x,y)}px;top:${isoY(x,y)+TH*0.35}px;z-index:${Math.round((x+y)*10+5)}">
    ${extra||""}${inner}${label?`<span class="on">${label}</span>`:""}</div>`;
}
const DECO_EMOJI={plant:"🪴",flower:"🌷",poster:"🖼️",clock:"🕰️",radio:"📻",bear:"🧸",bookshelf:"📚",piano:"🎹"};
function furnitureArt(id){
  if(id==="table_wood")return Art.tableSVG();
  if(id==="table_couple")return Art.tableCoupleSVG();
  if(id==="sofa")return Art.sofaSVG();
  if(id==="terrace_table")return Art.parasolSVG();
  return '<span class="deco">'+(DECO_EMOJI[id]||"🪴")+'</span>';
}
function renderObjects(){
  const room=$("#room"),fx=fixtures();
  room.querySelectorAll(".obj[data-obj]").forEach(e=>{if(e.dataset.obj!=="sign")e.remove();});
  let html="";
  const stBusy=st=>S.queues[st]&&S.queues[st].length>0;
  const prog=st=>{
    const q=S.queues[st];if(!q||!q.length)return "";
    const job=q[0],rec=Core.recipeById(DATA,job.r);
    const total=Core.craftSeconds(DATA,S,rec);
    const rem=job.remain==null?total:Math.max(0,job.remain);
    return `<span class="prog"><i style="width:${Math.min(100,(1-rem/total)*100)}%"></i></span>`;
  };
  // 오븐
  html+=objArt("st-oven",fx.oven.x,fx.oven.y,Art.ovenSVG(stBusy("oven")),"오븐 Lv."+Core.equipLevel(S,"oven"),
    prog("oven")+(stBusy("oven")?"":`<span class="zz">💤</span>`),true);
  // 커피바 (해금 전엔 실루엣)
  if(S.level>=DATA.balance.stations.coffee.unlockLevel)
    html+=objArt("st-coffee",fx.coffeebar.x,fx.coffeebar.y,Art.coffeeSVG(Core.hasCoffeeMachine(DATA,S),stBusy("coffee")),
      Core.hasCoffeeMachine(DATA,S)?"커피머신":"핸드드립",
      prog("coffee")+(stBusy("coffee")?"":`<span class="zz">💤</span>`),true);
  else
    html+=objArt("st-coffee-locked",fx.coffeebar.x,fx.coffeebar.y,
      `<span style="display:block;filter:grayscale(1) opacity(.4)">${Art.coffeeSVG(false,false)}</span>`,"Lv.3 해금","",false);
  // 진열 쇼케이스 — 실제 재고가 보임
  const stocked=Core.unlockedRecipes(DATA,S).map(r=>({emoji:r.emoji,n:S.stock[r.id]||0})).filter(x=>x.n>0);
  html+=objArt("st-display",fx.display.x,fx.display.y,Art.displaySVG(stocked,Core.totalStock(S)/Core.stockCap(DATA,S)),
    "진열 "+Core.totalStock(S)+"/"+Core.stockCap(DATA,S),
    (S.buffer.oven||S.buffer.coffee)?`<span class="badge">가득!</span>`:"",true);
  // 카운터(팁 항아리 포함) + 캐셔
  html+=objArt("st-counter",fx.counter.x,fx.counter.y,Art.counterSVG(S.tipsJar),"카운터",
    (S.tipsJar>0?`<span class="tipband">💰 팁 ${S.tipsJar}</span>`:""),true);
  html+=objArt("staff-cashier",fx.counter.x-0.15,fx.counter.y-0.85,Art.cashierSVG(),"",false);
  // 제빵사 — 오븐 옆에서 반죽
  html+=objArt("staff-baker",2.25,1.2,Art.bakerSVG(stBusy("oven")),"",false);
  // 배치 가구
  S.layout.forEach((it,i)=>{
    const f=Core.furnitureById(DATA,it.id);if(!f)return;
    html+=objArt("fur-"+i,it.x,it.y,furnitureArt(it.id),EDIT?f.name:"","",EDIT);
  });
  room.insertAdjacentHTML("beforeend",html);
  // 배치 모드 타일 하이라이트
  const blocked=blockedTiles();
  room.querySelectorAll("[data-tile]").forEach(t=>{
    t.classList.remove("editok","editno");
    if(EDIT&&SELECTED){
      const bad=blocked.has(t.dataset.tile)||t.dataset.tile.split(",")[1]==="0";
      t.classList.add(bad?"editno":"editok");
    }
  });
}

/* ---------- 씬 상호작용 ---------- */
$("#room").addEventListener("click",e=>{
  if(!S)return;
  const obj=e.target.closest("[data-obj]");
  if(EDIT){
    // 가구 회수
    if(obj&&obj.dataset.obj.startsWith("fur-")){
      const idx=+obj.dataset.obj.slice(4);
      S.layout.splice(idx,1);
      renderObjects();renderTray();renderHeader();saveLocal();return;
    }
    // 배치
    const tile=e.target.closest("[data-tile]");
    if(tile&&SELECTED){
      const [x,y]=tile.dataset.tile.split(",").map(Number);
      if(y===0||blockedTiles().has(x+","+y)){toast("여기엔 놓을 수 없어요");return;}
      if(unplacedCount(SELECTED)<=0){toast("보유한 가구가 없어요");return;}
      S.layout.push({id:SELECTED,x,y});
      if(unplacedCount(SELECTED)<=0)SELECTED=null;
      renderObjects();renderTray();renderHeader();saveLocal();
    }
    return;
  }
  if(!obj)return;
  const id=obj.dataset.obj;
  if(id==="st-oven")openKitchen("oven");
  else if(id==="st-coffee")openKitchen("coffee");
  else if(id==="st-display")openStock();
  else if(id==="st-counter"){
    if(S.tipsJar>0){
      const amt=S.tipsJar;S.coins+=amt;S.tipsJar=0;
      const r=obj.getBoundingClientRect();coinPop(r.left+r.width/2-12,r.top,"+"+amt+" 🪙");
      toast("💰 팁 "+amt+"코인 수금!");
      renderObjects();renderHeader();saveLocal();
    }else toast("팁 항아리가 비어 있어요");
  }
});

/* ===================================================================
   배치 모드 / 가구 상점
   =================================================================== */
function placedCount(id){return S.layout.filter(x=>x.id===id).length;}
function unplacedCount(id){return (S.owned[id]||0)-placedCount(id);}
function setEdit(on){
  EDIT=on;SELECTED=null;
  $("#fabEdit").classList.toggle("editing",on);
  $("#tray").classList.toggle("on",on);
  renderRoom();renderTray();
}
$("#fabEdit").addEventListener("click",()=>setEdit(!EDIT));
$("#editDone").addEventListener("click",()=>setEdit(false));
function renderTray(){
  if(!EDIT)return;
  const rows=DATA.furniture.items
    .filter(f=>(S.owned[f.id]||0)>0)
    .map(f=>`<button class="tchip${SELECTED===f.id?" sel":""}" data-sel="${f.id}">
      <span class="te">${f.emoji}</span><span class="tn">${f.name}</span><span class="tc">보유 ${unplacedCount(f.id)}</span></button>`).join("");
  $("#trayRow").innerHTML=rows+`<button class="tchip shopbtn" id="openShop"><span class="te">🛒</span><span class="tn">가구 상점</span><span class="tc">✨분위기 ${Core.moodScore(DATA,S)}</span></button>`;
}
$("#trayRow").addEventListener("click",e=>{
  const shop=e.target.closest("#openShop");
  if(shop){openShop();return;}
  const b=e.target.closest("[data-sel]");if(!b)return;

function kitchenSig(st){
  const q=S.queues[st],buf=S.buffer[st];
  return q.map(j=>j.r).join(",")+"|"+(buf?buf.r+":"+buf.n:"")+"|"+(q.length>=DATA.balance.queue.slotsPerStation);
}
function tickKitchenSheet(){
  if(!SHEET||SHEET.type!=="kitchen")return;
  const st=SHEET.station;
  const sig=kitchenSig(st);
  if(sig!==SHEET.sig){SHEET.sig=sig;renderSheet();return;}
  const q=S.queues[st];
  if(!q.length)return;
  const job=q[0],rec=Core.recipeById(DATA,job.r);

    const qt=slot.querySelector(".qt"),qi=slot.querySelector(".qp i");
    if(qt)qt.textContent=fmtDur(rem);

/* ===================================================================
   손님 액터 (아이러브커피식 동선: 문 → 줄 → 주문 → 착석/포장 → 퇴장)
   =================================================================== */
let actors=[],pendingSales=[],spawnAcc=0;
const SPEED=52; // px/s (씬 좌표계)
function pickCustomer(){
  const bal=DATA.balance.customers;
  const members=DATA.members.members.filter(m=>m.unlockLevel<=S.level);
  if(members.length&&Math.random()<bal.memberShare){
    const tw=members.reduce((a,m)=>a+(m.visitWeight||1),0);
    let r=Math.random()*tw;
    for(const m of members){r-=(m.visitWeight||1);if(r<=0)return {type:"member",m};}
    return {type:"member",m:members[0]};
  }
  const walk=DATA.customers.types.find(t=>t.id==="walkin");
  return {type:"walkin",emoji:walk.emojiPool[Math.floor(Math.random()*walk.emojiPool.length)],lines:walk.lines};
}
function seatSpots(){
  const out=[];
  S.layout.forEach((it,i)=>{
    const f=Core.furnitureById(DATA,it.id);
    if(f&&f.seats>0)for(let s=0;s<f.seats;s++)out.push({key:i+"/"+s,x:it.x,y:it.y,off:s});
  });
  return out;
}
function freeSeat(){
  const taken=new Set(actors.filter(a=>a.seatKey).map(a=>a.seatKey));
  return seatSpots().find(s=>!taken.has(s.key))||null;
}
function queueIndex(a){return actors.filter(x=>x.state==="queue"||x.state==="toqueue").indexOf(a);}
function mkActor(opts){
  const fx=fixtures();
  const c=opts&&opts.customer?opts.customer:pickCustomer();
  const el=document.createElement("div");
  el.className="actor walk";
  let look,extra="",label="";
  if(c.type==="member"){
    // 멤버는 id 시드 → 항상 같은 외모 (members.json에 look 객체를 넣으면 그 값 우선)
    look=(c.m.look&&typeof c.m.look==="object")?c.m.look:Art.lookFromSeed(c.m.id+c.m.nickname);
    const isReg=S.level>=DATA.balance.regulars.unlockLevel&&(S.regulars[c.m.id]||0)>=DATA.balance.regulars.visitsToRegular;
    extra=isReg?'<span class="heart">❤️</span>':"";
    label='<span class="an">'+(c.m.avatar?c.m.avatar+" ":"")+c.m.nickname+"</span>";
  }else{
    look=Art.randomLook();
  }
  el.innerHTML=extra+'<span class="charwrap">'+Art.charSVG(look,{mood:"happy"})+"</span>"+label;
  $("#room").appendChild(el);
  const a={el,c,look,x:fx.spawn.x,y:fx.spawn.y,state:"toqueue",wp:[fx.corridor],t:0,seatKey:null,scripted:opts&&opts.scripted};
  positionActor(a);
  actors.push(a);
  return a;
}
function setMood(a,mood){
  const w=a.el.querySelector(".charwrap");
  if(w)w.innerHTML=Art.charSVG(a.look,{mood});
}
function positionActor(a){
  a.el.style.left=isoX(a.x,a.y)+"px";
  a.el.style.top=(isoY(a.x,a.y)+TH*0.32)+"px";
  a.el.style.zIndex=Math.round((a.x+a.y)*10+7);
}
function actorSay(a,who,line,ms){
  const bb=document.createElement("div");bb.className="say";
  bb.innerHTML=(who?"<small>"+who+"</small>":"")+line;
  bb.style.left=isoX(a.x,a.y)+"px";bb.style.top=(isoY(a.x,a.y)-30)+"px";
  $("#room").appendChild(bb);
  requestAnimationFrame(()=>bb.classList.add("on"));
  setTimeout(()=>bb.remove(),ms||1900);
}
function removeActor(a){
  a.el.remove();
  actors=actors.filter(x=>x!==a);
}
function stepActors(dt){
  const fx=fixtures();
  for(const a of actors.slice()){
    // 이동
    if(a.wp&&a.wp.length){
      const tgt=a.wp[0];
      const tx=isoX(tgt.x,tgt.y),ty=isoY(tgt.x,tgt.y);
      const cx=isoX(a.x,a.y),cy=isoY(a.x,a.y);
      const dx=tx-cx,dy=ty-cy,dist=Math.hypot(dx,dy);
      if(dist<3){a.x=tgt.x;a.y=tgt.y;a.wp.shift();}
      else{
        const mv=SPEED*dt,ratio=Math.min(1,mv/dist);
        // 화면 좌표에서 이동 후 타일 좌표 역산 대신, 타일 좌표를 선형 보간
        a.x+=(tgt.x-a.x)*ratio;a.y+=(tgt.y-a.y)*ratio;
        a.el.classList.toggle("flip",tx<cx-2); // 이동 방향으로 몸 돌리기
      }
      positionActor(a);
      a.el.classList.add("walk");
      if(a.wp.length===0)a.el.classList.remove("walk");
      continue;
    }
    a.t+=dt;
    if(a.state==="toqueue"){
      // 줄 위치 배정
      const qi=Math.min(queueIndex(a),fx.queueSpots.length-1);
      a.state="queue";a.wp=[fx.queueSpots[Math.max(0,qi)]];a.t=0;
    }
    else if(a.state==="queue"){
      const qi=queueIndex(a);
      const spot=fx.queueSpots[Math.min(qi,fx.queueSpots.length-1)];
      if(Math.abs(a.x-spot.x)+Math.abs(a.y-spot.y)>0.2){a.wp=[spot];continue;}
      if(qi===0){
        // 카운터 앞: 판매 이벤트 소비 or 스크립트 구매
        if(a.scripted){a.state="buying";a.t=0;continue;}
        if(pendingSales.length>0){
          a.sale=pendingSales.shift();a.state="buying";a.t=0;
          if(a.want){a.want.remove();a.want=null;}
        }else{
          if(!a.want){
            const un=Core.unlockedRecipes(DATA,S);
            const w=un.length?un[Math.floor(Math.random()*un.length)].emoji:"🥯";
            a.want=document.createElement("span");a.want.className="want";a.want.textContent=w+"?";
            a.el.appendChild(a.want);
          }
          if(a.t>10&&Core.totalStock(S)<=0){ // 소프트 실패: 시무룩하게 떠남
            if(a.want){a.want.remove();a.want=null;}
            setMood(a,"sad");
            actorSay(a,null,"😢 다 팔렸네…",1400);
            a.state="leave";a.wp=[fx.corridor,fx.door,{x:fx.spawn.x,y:fx.spawn.y}];
          }
        }
      }
    }
    else if(a.state==="buying"){
      if(a.t<0.6)continue;
      // 구매 확정 연출
      const recId=a.sale?a.sale.recipeId:(a.scripted?"morning_roll":null);
      const rec=recId?Core.recipeById(DATA,recId):null;
      let who=null,line=rec?(rec.emoji+" 하나 주세요!"):"안녕하세요~";
      if(a.c.type==="member"){
        who=a.c.m.nickname;
        S.seenMembers[a.c.m.id]=(S.seenMembers[a.c.m.id]||0)+1;
        if(S.level>=DATA.balance.regulars.unlockLevel){
          S.regulars[a.c.m.id]=(S.regulars[a.c.m.id]||0)+1;
          if(S.regulars[a.c.m.id]===DATA.balance.regulars.visitsToRegular)
            toast("❤️ "+a.c.m.nickname+"님이 단골이 되었어요!");
        }
        const ls=(a.c.m.lines||[]).filter(x=>x&&!x.startsWith("(운영자"));
        if(ls.length&&Math.random()<0.6)line=ls[Math.floor(Math.random()*ls.length)];
        else if(rec)line=rec.emoji+" "+(["최고예요!","단골 각이에요","향이 좋네요"][Math.floor(Math.random()*3)]);
      }
      actorSay(a,who,line);
      setMood(a,"open"); // 주문하는 입모양
      setTimeout(()=>{if(a.el.isConnected)setMood(a,"happy");},900);
      a.food=rec?rec.emoji:"🥯";
      // 착석 or 포장
      const seat=freeSeat();
      if(seat){
        a.seatKey=seat.key;a.state="toseat";
        a.wp=[{x:seat.x,y:Math.min(ROOM.h-1,seat.y+0)}];
      }else{
        a.state="leave";
        const bag=document.createElement("span");bag.className="want";bag.textContent="🛍";a.el.appendChild(bag);
        a.wp=[fx.corridor,{x:fx.door.x,y:fx.door.y},{x:fx.spawn.x,y:fx.spawn.y}];
      }
      a.t=0;
    }
    else if(a.state==="toseat"){
      a.state="seated";a.t=0;
      const f=document.createElement("span");f.className="want";f.textContent=a.food||"🥯";
      a.el.appendChild(f);a.foodEl=f;
      a.el.classList.remove("walk");
      a.el.classList.add("eating"); // 팔을 입으로 가져가는 식사 애니메이션
    }
    else if(a.state==="seated"){
      if(a.t>5+Math.random()*4){
        if(a.foodEl)a.foodEl.remove();
        a.el.classList.remove("eating");
        a.seatKey=null;a.state="leave";
        a.wp=[fx.corridor,{x:fx.door.x,y:fx.door.y},{x:fx.spawn.x,y:fx.spawn.y}];
      }
    }
    else if(a.state==="leave"){removeActor(a);}
  }
}

let lvQueue=[],lvShowing=false;
function queueLevelUps(ups){for(const lv of ups)lvQueue.push(lv);showNextLevelUp();}
function levelEntry(lv){return DATA.levels.levels.find(x=>x.level===lv)||DATA.levels.roadmap.find(x=>x.level===lv)||null;}
function ensureGrants(){
  // 현재 레벨 이하의 미지급 가구를 지급 (멱등)
  for(const entry of DATA.levels.levels){
    if(entry.level>S.level)continue;
    if(S.granted["lv"+entry.level])continue;
    S.granted["lv"+entry.level]=true;
    for(const fid of (entry.unlocks.furniture||[]))S.owned[fid]=(S.owned[fid]||0)+1;
  }
}
function showNextLevelUp(){
  if(lvShowing||!lvQueue.length)return;
  lvShowing=true;
  const lv=lvQueue.shift();
  const entry=levelEntry(lv);
  ensureGrants();
  $("#luLv").textContent="Lv."+lv;
  $("#luHead").textContent=entry?entry.headline:"빵집이 성장했어요!";
  const cards=[];
  if(entry&&entry.unlocks){
    const u=entry.unlocks;
    for(const id of (u.menus||[])){const r=Core.recipeById(DATA,id);if(r)cards.push({e:r.emoji,n:r.name,t:"새 메뉴"});}
    for(const id of (u.equipment||[])){const eq=Core.equipById(DATA,id);if(eq)cards.push({e:eq.emoji,n:eq.name,t:"새 장비"});}
    for(const id of (u.slots||[])){const s=DATA.levels.slots.find(x=>x.id===id);if(s)cards.push({e:s.emoji,n:s.name,t:"새 설비"});}
    for(const id of (u.furniture||[])){const f=Core.furnitureById(DATA,id);if(f)cards.push({e:f.emoji,n:f.name,t:"가구 지급!"});}
    for(const id of (u.customers||[])){const c=DATA.customers.types.find(x=>x.id===id);if(c&&!c.roadmap)cards.push({e:"💛",n:c.name,t:"새 손님"});}
    if((u.features||[]).includes("coffee_machine"))cards.push({e:"☕",n:"커피머신",t:"커피 제작 단축"});
    if((u.features||[]).includes("regulars"))cards.push({e:"❤️",n:"단골 시스템",t:"멤버 단골"});
    if((u.features||[]).includes("grade_up")){const g=Core.gradeForLevel(DATA,lv);cards.push({e:g.emoji,n:g.name,t:"등급 상승!"});}
  }
  if(roomFor(lv).w!==roomFor(lv-1).w||roomFor(lv).h!==roomFor(lv-1).h)
    cards.push({e:"📐",n:"매장 확장",t:roomFor(lv).w+"×"+roomFor(lv).h+" 타일"});
  $("#luCards").innerHTML=cards.map(c=>`<div class="ucard"><span class="ue">${c.e}</span><span class="un">${c.n}</span><span class="ut">${c.t}</span></div>`).join("")
    ||`<div class="ucard"><span class="ue">📈</span><span class="un">성장 지속</span><span class="ut">다음 해금으로!</span></div>`;
  $("#lvup").classList.add("on");
}
$("#luOk").addEventListener("click",()=>{
  $("#lvup").classList.remove("on");lvShowing=false;
  renderRoom();renderHeader();saveLocal();
  if(ftueStep===3)ftueAdvance(4);
  showNextLevelUp();
});

/* ===================================================================
   FTUE — 씬 기반 (오븐 탭 유도 → 5초 베이킹 → 첫 손님 스크립트 구매)
   =================================================================== */
let ftueStep=-1;
function guide(msg,anchorSel){
  const g=$("#guide");
  document.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  if(!msg){g.style.display="none";return;}
  g.style.display="";g.textContent=msg;
  let top=130;
  if(anchorSel){const a=document.querySelector(anchorSel);if(a){a.classList.add("hl");const r=a.getBoundingClientRect();top=Math.max(70,r.top-56);}}
  g.style.top=top+"px";
}
function ftueAdvance(step){
  ftueStep=step;S.ftue.step=step;
  if(step===1)setTimeout(()=>guide("오븐을 탭해서 🥯 모닝롤을 구워보세요! (첫 베이킹은 5초)","[data-obj='st-oven']"),150);
  else if(step===2)guide("굽는 중… 완성되면 진열대로 자동 이동해요!",null);
  else if(step===3)guide(null);
  else if(step===4){
    guide("📋 퀘스트와 🛋️ 꾸미기로 나만의 빵집을 만들어보세요!",null);
    setTimeout(()=>{guide(null);ftueStep=99;S.ftue.done=true;S.ftue.step=99;toast("🥖 이제 당신의 빵집입니다!");saveLocal();},3400);
  }
  saveLocal();
}
function ftueTick(){
  if(ftueStep===2&&(S.stock.morning_roll||0)>0){
    ftueStep=2.5;
    guide("첫 손님이 왔어요!",null);
    const host=DATA.members.members.find(m=>m.unlockLevel<=1)||null;
    const a=mkActor({scripted:true,customer:host?{type:"member",m:host}:undefined});
    setTimeout(()=>{
      const res=Core.sellUnits(DATA,S,"morning_roll",4,true,Math.random);
      let bonus=DATA.balance.ftue.firstSaleBonusXp;
      if(S.level===1)bonus=Math.max(bonus,Core.xpNeed(DATA,1)-S.xp);
      const ups=Core.addXp(DATA,S,bonus);
      if(res)toast("🪙 첫 판매! +"+res.coins+"코인"+(host?" — "+host.nickname+"님":""));
      guide(null);
      ftueAdvance(3);
      const all=(res?res.levelUps:[]).concat(ups);
      if(all.length)queueLevelUps(all);else ftueAdvance(4);
      renderHeader();renderObjects();
    },3200);
  }
}
function startFtue(){
  ftueStep=0;
  modal("🏠","빵집 오픈!","엑서타운 골목에 당신의 빵집이 문을 엽니다.<br>빵집 이름을 지어주세요.",{
    input:true,okText:"개업하기 🎉",
    cb:(v)=>{S.name=(v||"").trim()||"엑서 빵집";renderHeader();renderRoom();ftueAdvance(1);}
  });
}

/* ===================================================================
   오프라인 정산
   =================================================================== */
function offlineSettleAndShow(){
  const away=nowSec()-(S.lastSeenAt||nowSec());
  const rep=Core.offlineSettle(DATA,S,away);
  if(!rep)return;
  S.lastSeenAt=nowSec();
  if(rep.sold<=0&&rep.levelUps.length===0){renderAll();return;}
  const items=Object.keys(rep.soldBy).map(id=>{
    const r=Core.recipeById(DATA,id);return r.emoji+" "+r.name+" <b>"+rep.soldBy[id]+"개</b>";
  }).join("<br>");
  modal("🛎️","다녀오셨네요!","<b>"+fmtDur(rep.awaySec)+"</b> 동안 빵집이 열심히 팔았어요.",
    {list:(items||"판매 없음")+"<br>─────────<br>🪙 <b>+"+fmt(rep.coins)+"</b> · XP <b>+"+rep.xp+"</b>"+(rep.tips?" · 팁 항아리 💰"+rep.tips:""),
     okText:"받기",cb:()=>{queueLevelUps(rep.levelUps);}});
  renderAll();
}

/* ===================================================================
   헤더 / 공통 렌더
   =================================================================== */
function renderHeader(){
  $("#hName").textContent=S.name||"엑서 빵집";
  const g=Core.gradeForLevel(DATA,S.level);
  $("#hGrade").textContent=g.emoji+" "+g.name;
  $("#hCoins").textContent=fmt(S.coins);
  $("#hRep").textContent=fmt(S.rep);
  $("#hLv").textContent="Lv."+S.level;
  const need=Core.xpNeed(DATA,S.level);
  const pct=need===Infinity?100:Math.min(100,S.xp/need*100);
  $("#hXpFill").style.width=pct+"%";
  $("#hXpTxt").textContent=need===Infinity?"MAX":Math.floor(S.xp)+" / "+need+" XP";
  const nx=Core.nextUnlock(DATA,S.level);
  $("#hNext").innerHTML=nx?("🎯 다음 해금: <b>Lv."+nx.level+"</b> "+nx.headline):"👑 모든 목표 달성!";
  const mood=Core.moodScore(DATA,S);
  const bonus=Math.min(DATA.balance.interior.tipChanceMax,mood*DATA.balance.interior.tipChancePerMood);
  $("#hMood").textContent="✨ "+mood+" (팁+"+Math.round(bonus*100)+"%)";
  $("#dotQuest").style.display=DATA.balance.quests.daily.some(q=>{const st=questState(q);return st&&st.cur>=st.tgt&&!S.daily.claimed[q.id];})?"":"none";
  $("#dotUp").style.display=DATA.equipment.equipment.some(e=>{
    if(S.level<e.unlockLevel)return false;
    const c=Core.upgradeCost(DATA,e.id,Core.equipLevel(S,e.id));return c!=null&&S.coins>=c;
  })?"":"none";
}
function renderAll(){renderHeader();renderRoom();if(EDIT)renderTray();if(SHEET)renderSheet();}

/* ===================================================================
   메인 루프
   =================================================================== */
let lastT=performance.now(),uiAcc=0,saveAcc=0,cloudAcc=0;
function loop(now){
  const dtRaw=Math.min(2,(now-lastT)/1000);lastT=now;
  const dt=dtRaw*WARP;
  if(S&&ftueStep!==0){
    const sum=Core.advance(DATA,S,dt,"online",Math.random);
    if(sum.sold>0){
      for(const id in sum.soldBy)for(let i=0;i<sum.soldBy[id];i++)pendingSales.push({recipeId:id});
      if(pendingSales.length>10)pendingSales.length=10;
    }
    if(sum.levelUps.length)queueLevelUps(sum.levelUps);
    // 손님 스폰 (간판 레벨로 빨라짐)
    spawnAcc+=dtRaw;
    const interval=Math.max(DATA.balance.customers.visitIntervalSecMin,
      DATA.balance.customers.visitIntervalSecBase/Core.signMult(DATA,S));
    const waiting=actors.filter(a=>a.state==="queue"||a.state==="toqueue").length;
    if(spawnAcc>=interval&&ftueStep>=3){
      spawnAcc=0;
      if((pendingSales.length>0||Core.totalStock(S)>0)&&waiting<4&&actors.length<10)mkActor();
    }
    stepActors(dtRaw);
    ftueTick();
    checkDailyReset();
    uiAcc+=dtRaw;
    if(uiAcc>=1){uiAcc=0;renderHeader();renderObjects();tickKitchenSheet();}
    saveAcc+=dtRaw;if(saveAcc>=DATA.balance.save.autosaveSec){saveAcc=0;saveLocalNow();}
    cloudAcc+=dtRaw;if(cloudAcc>=DATA.balance.save.cloudSyncSec){cloudAcc=0;cloudSave();}
  }
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange",()=>{
  if(!S)return;
  if(document.hidden){saveLocalNow();cloudSave();}
  else{offlineSettleAndShow();lastT=performance.now();}
});
window.addEventListener("beforeunload",()=>{if(S)saveLocalNow();});
window.addEventListener("resize",()=>{if(S)renderRoom();});

/* ===================================================================
   디버그
   =================================================================== */
function initDebug(){
  const pin=new URLSearchParams(location.search).get("debug");
  if(pin!==DATA.balance.debug.pin)return;
  DEBUG=true;
  const d=$("#dbg");d.classList.add("on");
  d.innerHTML=`<div style="margin-bottom:4px">🛠 DEBUG</div>
    <button data-dbg="w1">×1</button><button data-dbg="w10">×10</button><button data-dbg="w60">×60</button><br>
    <button data-dbg="coin">+${DATA.balance.debug.grantCoins}🪙</button>
    <button data-dbg="lv">레벨설정</button>
    <button data-dbg="off4">4h정산</button><br>
    <button data-dbg="reset">리셋</button>
    <span id="dbgInfo"></span>`;
  d.addEventListener("click",e=>{
    const b=e.target.closest("[data-dbg]");if(!b)return;
    const k=b.dataset.dbg;
    if(k==="w1")WARP=1;if(k==="w10")WARP=10;if(k==="w60")WARP=60;
    if(k==="coin")S.coins+=DATA.balance.debug.grantCoins;
    if(k==="lv"){const v=+prompt("레벨(1~50)",S.level+1);if(v>=1&&v<=50){S.level=v;S.xp=0;ensureGrants();}}
    if(k==="off4"){S.lastSeenAt=nowSec()-4*3600;offlineSettleAndShow();}
    if(k==="reset"){if(confirm("상태를 초기화할까요?")){localStorage.removeItem(DATA.balance.save.localKey);S=Core.newState(DATA,nowSec());Core.resetDaily(S,kstDateStr(nowSec()));cloudSave();location.reload();return;}}
    $("#dbgInfo").textContent=" ×"+WARP;
    renderAll();saveLocal();
  });
}

/* ===================================================================
   부트
   =================================================================== */
(async function boot(){
  try{DATA=await loadData();}
  catch(e){document.body.innerHTML="<p style='padding:40px;text-align:center;font-weight:800'>데이터 로드 실패 😢<br>새로고침해 주세요.</p>";return;}
  await cloudInit();
  await syncServerTime();

  let local=null;
  try{local=JSON.parse(localStorage.getItem(DATA.balance.save.localKey));}catch(e){}
  const cloud=await cloudLoad();
  let chosen=null;
  if(local&&cloud)chosen=progressScore(cloud)>progressScore(local)?cloud:local;
  else chosen=local||cloud;
  if(chosen)S=Core.migrate(DATA,chosen)||Core.newState(DATA,nowSec());
  else S=Core.newState(DATA,nowSec());
  const fresh=Core.newState(DATA,nowSec());
  for(const k in fresh)if(S[k]===undefined)S[k]=fresh[k];

  if(!S.daily.date)Core.resetDaily(S,kstDateStr(nowSec()));
  checkDailyReset();
  ensureGrants();
  initDebug();
  renderAll();

  if(!S.ftue.done){
    ftueStep=S.ftue.step||0;
    if(ftueStep<=0)startFtue();
    else if(ftueStep<3)ftueAdvance(1);
    else{S.ftue.done=true;ftueStep=99;}
  }else{
    ftueStep=99;
    offlineSettleAndShow();
  }
  requestAnimationFrame(loop);
})();
</script>
