  <style>
    /* ============================================================
       공유 정산 페이지 v2 전용 스타일 (모바일 최우선)
       ============================================================ */
    .settle-wrap { max-width: 620px; margin: 0 auto; display: grid; gap: 14px; }

    .s-card { padding: 20px; }
    .s-card h2 {
      display: flex; align-items: center; gap: 9px;
      margin: 0 0 12px; font-size: 15px; letter-spacing: -0.02em; font-weight: 700; color: var(--ink);
    }

    /* ── 요약 헤더 카드 ── */
    .s-head { position: relative; overflow: hidden; }
    .s-head .glow-orb { opacity: 0.75; }
    .s-head-inner { position: relative; z-index: 1; }
    .s-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .local-badge {
      display: inline-flex; align-items: center; padding: 6px 11px; border-radius: var(--r-pill);
      background: var(--pastel-cream); color: #7A4A32; font-size: 12px; font-weight: 700;
    }
    .s-title {
      margin: 14px 0 0; font-size: clamp(24px, 5.6vw, 31px); line-height: 1.12; letter-spacing: -0.05em; font-weight: 700;
      color: var(--ink);
    }
    .s-meta { margin: 10px 0 0; color: var(--gray); font-size: 13px; font-weight: 700; }
    .s-total {
      display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
      margin-top: 18px; padding: 14px 16px; border-radius: var(--r-sm);
      background: var(--pastel-lavender);
    }
    .s-total span { color: var(--ink-2); font-size: 13px; font-weight: 600; }
    .s-total strong { color: var(--deep-1); font-size: 23px; font-weight: 700; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
    .s-perline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .s-perline .badge-soft { font-variant-numeric: tabular-nums; }

    /* ── 입금 진행 카드 ── */
    .progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .progress-row b { font-size: 15px; letter-spacing: -0.02em; color: var(--ink); }
    .progress-row b em { font-style: normal; color: var(--mint); font-weight: 700; }
    .progress-row span { color: var(--gray); font-size: 13px; font-weight: 600; }
    .progress.is-thick { height: 14px; }
    .waitline { margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .waitline .wait-label { color: var(--pink); font-size: 13px; font-weight: 700; }
    .wait-chip {
      display: inline-flex; align-items: center; min-height: 28px; padding: 0 11px; border-radius: var(--r-pill);
      background: var(--pastel-blush); color: var(--danger); font-size: 12px; font-weight: 700;
    }
    .s-note { margin: 12px 0 0; color: var(--gray); font-size: 13px; line-height: 1.55; font-weight: 600; }
    .s-note b { color: var(--ink-2); }

    /* ── 완료 축하 ── */
    .celebrate {
      position: relative; overflow: hidden; text-align: center;
      padding: 26px 20px 24px;
      background: var(--surface);
      border-color: rgba(18, 147, 106, 0.28);
    }
    .celebrate .cel-emoji { display: grid; place-items: center; line-height: 1; color: var(--brand); }
    .celebrate .cel-emoji .ic { width: 40px; height: 40px; }
    .celebrate strong { display: block; margin-top: 10px; font-size: 19px; letter-spacing: -0.04em; font-weight: 700; color: var(--brand); }
    .celebrate p { margin: 8px auto 0; max-width: 360px; color: var(--ink-2); font-size: 13px; line-height: 1.6; font-weight: 700; }

    .confetti-layer { position: fixed; inset: 0; pointer-events: none; z-index: 300; overflow: hidden; }
    .confetti-piece {
      position: absolute; top: -16px; width: 9px; height: 14px; border-radius: 2px; opacity: 0.92;
      animation: confetti-fall linear forwards;
    }
    @keyframes confetti-fall {
      to { transform: translateY(108vh) rotate(680deg); opacity: 0.85; }
    }

    /* ── 입금 정보 ── */
    .deposit-rows { display: grid; gap: 8px; }
    .deposit-row {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 13px; background: var(--offwhite); border: 1px solid var(--line);
    }
    .deposit-row span { color: var(--gray); font-size: 13px; font-weight: 600; flex: none; }
    .deposit-row b { font-size: 15px; letter-spacing: -0.01em; word-break: break-all; text-align: right; color: var(--ink); }
    .kakao-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; padding: 8px 12px; border-radius: var(--r-pill);
      background: var(--pastel-cream); color: #7A4A32; font-size: 13px; font-weight: 600;
    }
    .deposit-actions { margin-top: 12px; }
    .deposit-actions .btn { width: 100%; }

    /* ── 멤버 명단 ── */
    .m-group-head {
      display: flex; align-items: center; gap: 7px; margin: 14px 0 8px;
      font-size: 13px; font-weight: 700; letter-spacing: -0.01em;
    }
    .m-group-head:first-of-type { margin-top: 0; }
    .m-group-head.is-wait { color: var(--danger); }
    .m-group-head.is-done { color: var(--brand); }
    .m-group-head i { flex: 1; height: 1px; background: var(--line); }
    .m-list { display: grid; gap: 8px; }
    .m-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 13px 14px; border-radius: var(--r-sm); background: #fff; border: 1px solid var(--line);
      transition: opacity 0.25s var(--ease), background 0.25s var(--ease), border-color 0.25s var(--ease);
    }
    .m-row.is-wait { border-color: rgba(166, 51, 92, 0.26); }
    .m-left { min-width: 0; }
    .m-name { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .m-name b { font-size: 15px; letter-spacing: -0.02em; overflow-wrap: anywhere; color: var(--ink); }
    .me-chip {
      flex: none; display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--r-pill);
      background: var(--grad-brand); color: #fff; font-size: 11px; font-weight: 700;
    }
    .wait-tag {
      flex: none; display: inline-flex; align-items: center; padding: 2px 8px; border-radius: var(--r-pill);
      background: var(--pastel-blush); color: var(--danger); font-size: 11px; font-weight: 700;
    }
    .m-amt { display: block; margin-top: 3px; color: var(--primary-700); font-size: 17px; letter-spacing: -0.03em; font-weight: 700; font-variant-numeric: tabular-nums; }
    .m-parts { display: flex; margin-top: 2px; color: var(--gray); font-size: 12px; font-weight: 700; }
    .m-actions { display: flex; align-items: center; gap: 6px; flex: none; }
    .m-btn {
      min-height: 34px; padding: 0 13px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; cursor: pointer;
      transition: transform 0.16s var(--ease), background 0.16s var(--ease), box-shadow 0.16s var(--ease);
    }
    .m-btn:hover { transform: none; }
    .m-send { background: var(--pastel-mint); color: var(--brand); }
    .m-send:hover { background: var(--brand-soft); }
    .m-toggle { background: #fff; color: var(--primary); border: 1px solid var(--line-strong); }
    .m-toggle:hover { border-color: rgba(40, 82, 68, 0.34); }
    /* 끝난 줄을 흐리게(opacity 0.62) 처리하고 있었는데, 그 안의 글자 대비까지 같이
       내려가서 '✓ 입금 완료' 배지가 2.26:1 까지 떨어졌다. 칠한 픽셀에서 잰 값이다.
       흐리게 하는 대신 초록 바탕과 취소선으로 끝났음을 보이고, 글자색은 또렷이 둔다. */
    .m-row.is-paid { background: rgba(18, 147, 106, 0.05); border-color: rgba(18, 147, 106, 0.22); }
    .m-row.is-paid .m-name b { text-decoration: line-through; color: var(--gray); }
    .m-row.is-paid .m-amt { color: var(--gray); }
    /* --mint(var(--brand))에 흰 글자는 3.88:1 로 모자란다 — 한 단계 짙은 초록을 쓴다 */
    .m-row.is-paid .m-toggle {
      background: var(--brand); color: #fff; border-color: var(--brand);
    }
    .m-row.is-me { border-color: rgba(40, 82, 68, 0.38); background: #fff; }
    .m-hint { margin: 12px 0 0; color: var(--gray); font-size: 13px; line-height: 1.55; font-weight: 600; }
    .m-hint b { color: var(--ink-2); }

    /* ── 결제자별 정리 ── */
    .payer-rows { display: grid; gap: 8px; }
    .payer-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 13px; background: var(--soft-lavender); border: 1px solid rgba(40, 82, 68, 0.1);
    }
    .payer-row b { color: var(--primary-700); font-size: 14px; }
    .payer-row small { color: var(--gray); font-size: 12px; font-weight: 700; }
    .payer-row strong { color: var(--deep-1); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

    /* ── 추가·차감 ── */
    .adjlines { display: grid; gap: 7px; }
    .adjline { display: flex; justify-content: space-between; gap: 10px; padding: 10px 13px; border-radius: 12px; background: var(--offwhite); border: 1px solid var(--line); font-size: 13px; }
    .adjline b { color: var(--ink); font-weight: 600; }
    .adjline small { color: var(--gray-2); font-size: 12px; font-weight: 700; }
    /* 어느 차수 것인지는 사유와 헷갈리면 안 되므로 따로 칸을 만들어 띄운다 */
    .adjline .adj-scope {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: var(--r-pill);
      background: var(--pastel-lavender); color: var(--primary-700); font-size: 11px; font-weight: 600;
    }
    .adjline strong { white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
    .adjline strong.is-plus { color: var(--brand); }
    .adjline strong.is-minus { color: var(--danger); }

    /* ── 안내 문구 ── */
    .notice-lines { display: grid; gap: 6px; }
    .notice-line { position: relative; padding-left: 11px; color: var(--ink-2); font-size: var(--fs-sm); line-height: 1.55; font-weight: 600; }
    .notice-line::before { content: ""; position: absolute; left: 0; top: 0.64em; width: 4px; height: 4px; border-radius: 50%; background: var(--brand); }
    .s-receipts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .s-receipt { width: 100%; border-radius: 12px; border: 1px solid var(--line); display: block; }

    /* ── 차수별 내역 (접기) ── */
    .s-details { padding: 0; overflow: hidden; }
    .s-details summary {
      list-style: none; cursor: pointer; padding: 17px 20px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      font-size: 15px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink);
      transition: background 0.18s var(--ease);
    }
    .s-details summary:hover { background: rgba(234, 240, 233, 0.5); }
    .s-details summary::-webkit-details-marker { display: none; }
    .s-details summary::after { content: "펼치기"; color: var(--primary); font-size: 12px; font-weight: 600; }
    .s-details[open] summary::after { content: "접기"; }
    .s-details-body { padding: 0 20px 18px; }
    .detail-line { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px dashed rgba(40, 82, 68, 0.16); }
    .detail-line b { display: block; margin-bottom: 3px; letter-spacing: -0.02em; color: var(--ink); }
    .detail-line span { display: block; color: var(--gray); font-size: 12px; line-height: 1.4; }
    .detail-line .sep-row { display: flex; }
    .detail-line .round-who { margin-top: 1px; color: var(--gray); }
    .detail-line strong { white-space: nowrap; color: var(--primary-700); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .verify-line {
      margin: 12px 0 0; padding: 11px 13px; border-radius: 12px;
      background: var(--pastel-mint); color: var(--brand); font-size: 12px; line-height: 1.6; font-weight: 600;
    }
    .verify-line b { display: block; margin-bottom: 2px; font-weight: 700; }

    /* ── 페이지 하단 홍보 ── */
    .s-promo { text-align: center; padding: 8px 0 4px; }
    .s-promo a {
      display: inline-flex; align-items: center; gap: 7px; padding: 12px 18px; border-radius: var(--r-pill);
      background: #fff; border: 1px solid var(--line); color: var(--primary);
      font-size: 13px; font-weight: 600;
      transition: transform 0.16s var(--ease), background 0.16s var(--ease), box-shadow 0.16s var(--ease);
    }
    .s-promo a:hover { transform: none; background: var(--pastel-lavender); }

    /* ── 로딩 / 에러 ── */
    .s-status { padding: 46px 24px 42px; text-align: center; }
    .s-status .emoji {
      display: grid; place-items: center; width: 82px; height: 82px; margin: 0 auto; border-radius: 26px;
      background: var(--pastel-lavender);
      font-size: 38px; line-height: 1;
    }
    .s-status h2 { margin: 18px 0 0; font-size: 20px; letter-spacing: -0.04em; font-weight: 700; color: var(--ink); }
    .s-status p { margin: 10px auto 0; max-width: 380px; color: var(--gray); font-size: 14px; line-height: 1.65; font-weight: 600; }
    .s-status .actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
    .s-status small { display: block; margin-top: 16px; color: var(--gray-2); font-size: 12px; font-weight: 600; }
    .spinner {
      width: 36px; height: 36px; margin: 0 auto; border-radius: 50%;
      border: 4px solid var(--soft-lavender); border-top-color: var(--primary);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 767px) {
      .s-card { padding: 17px 16px; }
      .m-row { flex-wrap: wrap; }
      .m-actions { width: 100%; justify-content: flex-end; }
    }
  </style>
  <script src="assets/site-core.js?v=5"></script>
</head>

  <!-- 공통 셸 JS (v2-shell 그대로) -->
  <script>
    (function () {
      "use strict";
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var topnav = document.getElementById("topnav");
      function syncNav() {
        if (topnav) topnav.classList.toggle("is-scrolled", window.scrollY > 8);
      }
      window.addEventListener("scroll", syncNav, { passive: true });
      syncNav();

      var revealEls = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window) || reduceMotion) {
        revealEls.forEach(function (el) { el.classList.add("is-visible"); });
      } else {
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add("is-visible"); io.unobserve(e.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" });
        revealEls.forEach(function (el) { io.observe(el); });
      }

      var toastEl = document.getElementById("toast");
      var toastTimer = null;
      function toast(msg) {
        if (!toastEl) return;
        toastEl.textContent = msg;
        toastEl.classList.add("is-visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove("is-visible"); }, 2400);
      }

      function fmt(n, decimals) {
        return Number(n).toLocaleString("ko-KR", {
          minimumFractionDigits: decimals || 0, maximumFractionDigits: decimals || 0
        });
      }
      function countUp(el, to, opts) {
        if (!el) return;
        opts = opts || {};
        var dur = opts.duration || 900;
        var dec = opts.decimals || 0;
        var suffix = opts.suffix || "";
        if (reduceMotion || dur <= 0) { el.textContent = fmt(to, dec) + suffix; return; }
        var start = null;
        function step(ts) {
          if (start === null) start = ts;
          var p = Math.min((ts - start) / dur, 1);
          var eased = 1 - Math.pow(1 - p, 3);
          el.textContent = fmt(to * eased, dec) + suffix;
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      var cuEls = document.querySelectorAll("[data-countup]");
      function fire(el) {
        countUp(el, parseFloat(el.getAttribute("data-countup")) || 0, {
          decimals: parseInt(el.getAttribute("data-countup-decimals") || "0", 10),
          suffix: el.getAttribute("data-countup-suffix") || ""
        });
      }
      if (!("IntersectionObserver" in window) || reduceMotion) {
        cuEls.forEach(fire);
      } else {
        var cuIo = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { fire(e.target); cuIo.unobserve(e.target); }
          });
        }, { threshold: 0.4 });
        cuEls.forEach(function (el) { cuIo.observe(el); });
      }


      window.EXCER = { toast: toast, countUp: countUp, fmt: fmt };
    })();
  </script>

  <script>
    /* ============================================================
       공유 정산 페이지 v2
       - ?id=…  : settle_get RPC 로드 + 20초 폴링 (입금 체크 실시간 공유)
       - #d=…   : 링크 자체에 담긴 데이터 디코드 (체크는 이 기기에서만)
       - v2 payload: 결제자별 그룹 · 개인별 추가/차감 · 1인 금액 · 합계 검증
       ============================================================ */
    const SUPA = window.SUPA;   // assets/site-core.js
    async function supaFetch(path, opts = {}) {
      const res = await fetch(SUPA.url + path, {
        ...opts,
        headers: {
          apikey: SUPA.anon, Authorization: "Bearer " + SUPA.anon,
          "Content-Type": "application/json", ...(opts.headers || {})
        }
      });
      if (!res.ok) {
        let msg = ""; try { msg = (await res.json()).message || ""; } catch (e) {}
        const err = new Error(msg || ("HTTP " + res.status)); err.status = res.status; throw err;
      }
      return res.status === 204 ? null : res.json();
    }

    const MYNAME_KEY = "excer_settle_myname_v1";
    const LOCAL_PAID_KEY = "excer_settle_local_paid_v1";
    const POLL_MS = 20000;
    const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const $ = (id) => document.getElementById(id);
    const app = $("app");
    const showToast = (msg) => window.EXCER.toast(msg);

    function escapeHTML(value) {
      const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" };
      return String(value).replace(/[&<>"']/g, (char) => entities[char]);
    }
    function formatWon(value) { return `${Math.round(Number(value) || 0).toLocaleString("ko-KR")}원`; }
    function isMobileUA() { return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || ""); }

    async function copyToClipboard(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.position = "fixed"; ta.style.left = "-9999px";
          document.body.appendChild(ta); ta.focus(); ta.select();
          document.execCommand("copy"); ta.remove();
        }
        return true;
      } catch (e) { return false; }
    }

    /* ── 모드 판별 ── */
    const rawId = (new URLSearchParams(window.location.search).get("id") || "").trim().toLowerCase();
    const settleId = /^[a-z0-9]{8,32}$/.test(rawId) ? rawId : "";
    const hashRaw = (window.location.hash || "").indexOf("#d=") === 0 ? window.location.hash.slice(3) : "";
    const mode = settleId ? "live" : (hashRaw ? "local" : "none");

    let payload = null;      // 정산 스냅샷
    let paid = {};           // { "멤버명": true }
    let localKey = "";       // local 모드 체크 저장용 키
    let pendingOps = 0;      // 진행 중인 토글 수 (폴링과 충돌 방지)
    let pollTimer = null;
    let myName = "";
    let detailsOpen = false;   // 폴링 재렌더 시 접기 상태 유지
    let lastLiveSig = "";      // 변화 없으면 재렌더 생략
    let wasComplete = null;    // 완료 전환 감지(축하 연출)
    let accountOwner = "";     // 이 페이지에 실린 계좌의 주인 — 송금 버튼이 이 사람에게만 보낸다
    try { myName = localStorage.getItem(MYNAME_KEY) || ""; } catch (e) {}

    function b64urlDecode(s) {
      let t = String(s).replace(/-/g, "+").replace(/_/g, "/");
      while (t.length % 4) t += "=";
      const bin = atob(t);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return JSON.parse(new TextDecoder().decode(bytes));
    }
    function hashStr(s) {
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
      return h.toString(36);
    }
    function intAmount(v) { return Math.max(0, Math.round(Number(v) || 0)); }

    /* 외부에서 온 payload 는 형태를 강제하고 길이를 제한한다 (v1·v2 모두 수용) */
    function normalizePayload(p) {
      if (!p || typeof p !== "object") return null;
      const rows = Array.isArray(p.rows)
        ? p.rows
            .filter((r) => r && typeof r.name === "string" && r.name.trim())
            .map((r) => ({
              name: String(r.name).trim().slice(0, 30),
              amount: intAmount(r.amount),
              parts: Array.isArray(r.parts)
                ? r.parts
                    .filter((x) => x && x.payer)
                    .map((x) => ({ payer: String(x.payer).trim().slice(0, 30), amount: intAmount(x.amount) }))
                    .slice(0, 6)
                : []
            }))
            .slice(0, 60)
        : [];
      if (!rows.length) return null;
      const pay = (p.pay && typeof p.pay === "object") ? p.pay : {};
      const per = (p.perPerson && typeof p.perPerson === "object") ? p.perPerson : null;
      return {
        title: String(p.title || "모임 정산").slice(0, 80),
        date: String(p.date || "").slice(0, 20),
        host: String(p.host || "").slice(0, 30),
        pay: {
          bank: String(pay.bank || "").slice(0, 30),
          account: String(pay.account || "").slice(0, 40),
          holder: String(pay.holder || "").slice(0, 30),
          kakao: !!pay.kakao
        },
        notices: Array.isArray(p.notices) ? p.notices.map((n) => String(n).slice(0, 200)).slice(0, 10) : [],
        rounds: Array.isArray(p.rounds)
          ? p.rounds.map((r) => ({
              label: String((r && r.label) || "").slice(0, 60),
              amount: intAmount(r && r.amount),
              count: Math.max(0, Math.round(Number(r && r.count) || 0)),
              payer: String((r && r.payer) || "").slice(0, 30),
              active: Array.isArray(r && r.active) ? r.active.map((n) => String(n).slice(0, 30)).slice(0, 60) : []
            })).slice(0, 30)
          : [],
        groups: Array.isArray(p.groups)
          ? p.groups
              .filter((g) => g && g.payer)
              .map((g) => ({
                payer: String(g.payer).trim().slice(0, 30),
                amount: intAmount(g.amount),
                rows: Array.isArray(g.rows)
                  ? g.rows
                      .filter((r) => r && r.name)
                      .map((r) => ({ name: String(r.name).trim().slice(0, 30), amount: intAmount(r.amount) }))
                      .slice(0, 60)
                  : []
              })).slice(0, 12)
          : [],
        adjustments: Array.isArray(p.adjustments)
          ? p.adjustments
              .filter((a) => a && a.name)
              .map((a) => ({
                name: String(a.name).trim().slice(0, 30),
                amount: Math.max(-100000000, Math.min(100000000, Math.round(Number(a.amount) || 0))),
                reason: String(a.reason || "").slice(0, 60),
                // 어느 차수에서 오간 돈인지 — 이게 없으면 받는 사람이 금액을 확인할 수 없다
                roundLabel: String(a.roundLabel || "").slice(0, 40),
                applied: a.applied !== false
              })).slice(0, 30)
          : [],
        perPerson: per
          ? { uniform: !!per.uniform, value: intAmount(per.value), count: Math.max(0, Math.round(Number(per.count) || 0)) }
          : null,
        verifyText: String(p.verifyText || "").slice(0, 300),
        rows,
        total: intAmount(p.total),
        payerCount: Math.max(0, Math.round(Number(p.payerCount) || 0)),
        hostBurden: intAmount(p.hostBurden),
        // 영수증: 검증된 data:image base64 만, 장당 300KB·최대 2장 (SSRF/XSS 방지)
        receipts: Array.isArray(p.receipts)
          ? p.receipts
              .filter((u) => typeof u === "string" && /^data:image\/(jpe?g|png|webp);base64,[A-Za-z0-9+/=]+$/.test(u) && u.length < 300000)
              .slice(0, 2)
          : []
      };
    }

    /* ── local 모드: 이 기기 전용 입금 체크 저장 ── */
    function loadLocalPaid() {
      try {
        const all = JSON.parse(localStorage.getItem(LOCAL_PAID_KEY) || "{}");
        const map = all && typeof all === "object" ? all[localKey] : null;
        return map && typeof map === "object" ? map : {};
      } catch (e) { return {}; }
    }
    function persistLocalPaid() {
      try {
        let all = {};
        try { all = JSON.parse(localStorage.getItem(LOCAL_PAID_KEY) || "{}") || {}; } catch (e) {}
        if (typeof all !== "object" || Array.isArray(all)) all = {};
        all[localKey] = paid;
        localStorage.setItem(LOCAL_PAID_KEY, JSON.stringify(all));
      } catch (e) {}
    }

    /* ============================================================
       축하 연출 — 모두 입금 완료 시 컨페티 (reduced-motion 시 생략)
       ============================================================ */
    const CONFETTI_COLORS = ["var(--brand)", "var(--brand)", "#7E5F25", "#4E6E86", "var(--danger)", "var(--brand)", "#D9B98C"];
    function fireConfetti() {
      if (REDUCE_MOTION) return;
      const layer = document.createElement("div");
      layer.className = "confetti-layer";
      layer.setAttribute("aria-hidden", "true");
      for (let i = 0; i < 90; i++) {
        const piece = document.createElement("i");
        piece.className = "confetti-piece";
        const size = 6 + Math.random() * 7;
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.width = `${size}px`;
        piece.style.height = `${size * 1.5}px`;
        piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
        piece.style.animationDuration = `${2 + Math.random() * 1.8}s`;
        piece.style.animationDelay = `${Math.random() * 0.6}s`;
        piece.style.transform = `rotate(${Math.random() * 360}deg)`;
        layer.appendChild(piece);
      }
      document.body.appendChild(layer);
      setTimeout(() => layer.remove(), 4600);
    }

    /* ============================================================
       화면
       ============================================================ */
    function announce(text) {
      const el = $("liveMsg");
      if (el && el.textContent !== text) el.textContent = text;
    }
    function setHeroStats(total, done, count) {
      const t = $("heroTotal"), pc = $("heroPaid");
      if (t) t.textContent = total == null ? "—" : formatWon(total);
      if (pc) pc.textContent = (done == null || count == null) ? "—" : `${done}/${count}명`;
    }

    function renderLoading() {
      app.innerHTML = `
        <section class="s-status card is-lg">
          <div class="spinner" aria-hidden="true"></div>
          <h2>정산을 불러오는 중입니다.</h2>
          <p>잠시만 기다려 주세요.</p>
        </section>`;
    }

    function renderError(kind) {
      setHeroStats(null, null, null);
      const isNetwork = kind === "network";
      announce(isNetwork ? "정산을 불러오지 못했습니다." : "정산을 찾을 수 없습니다.");
      app.innerHTML = `
        <section class="s-status card is-lg">
          <div class="emoji ic-tile" aria-hidden="true"><svg class="ic is-lg"><use href="#i-${isNetwork ? "alert" : "search"}"/></svg></div>
          <h2>${isNetwork ? "정산을 불러오지 못했습니다." : "정산을 찾을 수 없습니다."}</h2>
          <p>${isNetwork
            ? "연결을 확인한 뒤 다시 시도해 주세요."
            : "링크가 만료되었거나 주소가 잘못되었을 수 있습니다.<br />모임장에게 새 링크를 요청해 주세요."}</p>
          <div class="actions">
            ${isNetwork ? `<button id="retryBtn" class="btn btn-primary" type="button">다시 시도</button>` : ""}
            <a class="btn btn-secondary" href="calculator.html">모임 정산 열기</a>
          </div>
        </section>`;
    }

    /* owner 가 있으면 '그 사람에게 보낼 몫만'이라는 뜻이다 — 버튼에도 그렇게 적는다 */
    function transferButton(amount, owner) {
      const bank = payload.pay.bank.trim();
      const digits = String(payload.pay.account || "").replace(/[^\d]/g, "");
      if (!bank || !digits) return "";
      const label = isMobileUA() ? "토스로 송금" : "계좌·금액 복사";
      return `<button class="m-btn m-send" type="button" data-send-amount="${amount}"${owner ? ` title="${escapeHTML(owner)} 님 계좌로 ${formatWon(amount)}"` : ""}>${label}</button>`;
    }

    /* 이 사람이 누구에게 보내야 하는지.
       parts 는 받을 사람이 둘 이상일 때만 실려 오고, 예전에 만든 링크에는 아예 없다.
       groups(결제자별 명단)에서 찾으면 두 경우 모두 답이 나온다. */
    function recipientsOf(name) {
      const groups = Array.isArray(payload.groups) ? payload.groups : [];
      const out = [];
      groups.forEach((g) => {
        (g.rows || []).forEach((r) => { if (r.name === name) out.push({ payer: g.payer, amount: r.amount }); });
      });
      return out;
    }

    /* 아이콘 한 벌(assets/icons.js)에서 하나 꺼내 쓴다 */
    function icon(name, cls) { return `<svg class="ic${cls ? " " + cls : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`; }

    function memberRow(r) {
      const isPaid = !!paid[r.name];
      const isMe = myName && r.name === myName;
      /* 결제자가 여럿이면 금액만 봐서는 누구에게 보낼지 알 수 없다.
         예전에는 '두 사람에게 나눠 보내는 경우'에만 적어 줘서,
         한 사람에게 몰아 보내는 멤버는 받을 사람이 누군지 못 봤다. */
      const to = (payload.groups && payload.groups.length > 1) ? recipientsOf(r.name) : [];
      const partsLine = to.length
        ? `<span class="m-parts sep-row">${to.map((x) => `<span>${escapeHTML(x.payer)}에게 ${formatWon(x.amount)}</span>`).join("")}</span>`
        : "";
      /* 송금 버튼은 이 페이지에 실린 계좌(한 사람 것)로만 보낸다.
         결제자가 여럿일 때 합계를 그대로 물리면 다른 결제자 몫까지 그 계좌로 가 버린다 —
         계좌 주인에게 갈 몫만 넘기고, 그런 몫이 없으면 버튼을 빼고 안내만 남긴다. */
      const mine = to.length ? to.find((x) => x.payer === accountOwner) : null;
      const sendAmount = to.length ? (mine ? mine.amount : 0) : r.amount;
      return `
      <div class="m-row${isPaid ? " is-paid" : " is-wait"}${isMe ? " is-me" : ""}">
        <div class="m-left">
          <div class="m-name"><b>${escapeHTML(r.name)}</b>${isMe ? `<span class="me-chip">나</span>` : ""}${isPaid ? "" : `<span class="wait-tag">대기 중</span>`}</div>
          <strong class="m-amt">${formatWon(r.amount)}</strong>
          ${partsLine}
        </div>
        <div class="m-actions">
          ${isPaid || !sendAmount ? "" : transferButton(sendAmount, to.length > 0 ? accountOwner : "")}
          <button class="m-btn m-toggle" type="button" data-toggle-name="${escapeHTML(r.name)}"
            aria-pressed="${isPaid ? "true" : "false"}">${isPaid ? '<svg class="ic is-sm" aria-hidden="true"><use href="#i-check"/></svg> 입금 완료' : "입금 완료"}</button>
        </div>
      </div>`;
    }

    function renderView() {
      const rows = payload.rows;
      const waiting = rows.filter((r) => !paid[r.name]);
      const done = rows.filter((r) => paid[r.name]);
      const paidCount = done.length;
      const pct = rows.length ? Math.round((paidCount / rows.length) * 100) : 0;
      const complete = rows.length > 0 && paidCount === rows.length;
      const pay = payload.pay;
      const hasPayInfo = !!(pay.bank.trim() || pay.account.trim() || pay.holder.trim());
      const accountLine = [pay.bank.trim(), pay.account.trim()].filter(Boolean).join(" ")
        + (pay.holder.trim() ? ` (${pay.holder.trim()})` : "");
      const per = payload.perPerson;
      const multiGroups = payload.groups.length > 1;
      /* 계좌는 한 사람 것만 실려 온다. 결제자가 여럿이면 나머지 사람에게 보낼 돈은
         여기 적힌 계좌로 보내면 안 된다 — 누구 계좌인지, 누구 것을 따로 물어야 하는지 밝힌다.
         (memberRow 에서도 써야 해서 바깥에 둔 값이다) */
      accountOwner = pay.holder.trim() || (payload.groups[0] ? payload.groups[0].payer : "");
      const otherPayers = multiGroups
        ? payload.groups.map((g) => g.payer).filter((n) => n && n !== accountOwner)
        : [];

      setHeroStats(payload.total, paidCount, rows.length);
      announce(`${paidCount}/${rows.length}명 입금 완료`);

      /* 전체를 다시 그리므로, 본문 안에 있던 포커스는 같은 자리로 되돌린다 */
      const ae = document.activeElement;
      const keep = ae && app.contains(ae)
        ? (ae.dataset && ae.dataset.toggleName != null ? ["toggle", ae.dataset.toggleName] : ae.id ? ["id", ae.id] : null)
        : null;

      const detailHTML = payload.rounds.map((r) => `
        <div class="detail-line">
          <div><b>${escapeHTML(r.label || "차수")}</b><span class="sep-row"><span>${r.count}명 분담</span>${r.payer ? `<span>결제 ${escapeHTML(r.payer)}</span>` : ""}</span>${r.active.length ? `<span class="round-who">${escapeHTML(r.active.join(", "))}</span>` : ""}</div>
          <strong>${formatWon(r.amount)}</strong>
        </div>`).join("");

      app.innerHTML = `
        <section class="s-head card is-lg" aria-label="정산 요약">
          <i class="glow-orb" style="--orb-size:280px; right:-100px; top:-120px" aria-hidden="true"></i>
          <div class="s-head-inner">
            <div class="s-head-top">
              <span class="kicker">정산 안내</span>
              ${mode === "local" ? `<span class="local-badge">이 기기에서만 표시</span>` : ""}
            </div>
            <h2 class="s-title">${escapeHTML(payload.title)}</h2>
            <p class="s-meta sep-row">${payload.date ? `<span>${escapeHTML(payload.date)}</span>` : ""}<span>모임장 ${escapeHTML(payload.host || "-")}</span>${payload.hostBurden ? `<span>${payload.payerCount > 1 ? "결제자" : "모임장"} 부담 ${formatWon(payload.hostBurden)}</span>` : ""}</p>
            <div class="s-total"><span>총 비용</span><strong>${formatWon(payload.total)}</strong></div>
            ${per && per.count ? `
            <div class="s-perline">
              <span class="badge-soft">참여 ${per.count}명</span>
              <span class="badge-soft is-mint">${per.uniform ? "1인" : "1인 평균"} ${formatWon(per.value)}</span>
            </div>` : ""}
          </div>
        </section>

        ${complete ? `
        <section class="s-card card celebrate" aria-label="정산 완료">
          <span class="cel-emoji ic-tile" aria-hidden="true"><svg class="ic is-lg"><use href="#i-party"/></svg></span>
          <strong>정산 완료</strong>
          <p>${rows.length}명 모두 입금 완료를 표시했습니다.</p>
        </section>` : ""}

        <section class="s-card card" aria-label="입금 진행 상황">
          <div class="progress-row">
            <b><em>${paidCount}</em>/${rows.length}명 입금 완료</b>
            <span>${pct}%</span>
          </div>
          <div class="progress is-thick" role="progressbar" aria-valuemin="0" aria-valuemax="${rows.length}" aria-valuenow="${paidCount}"><span style="width:${pct}%"></span></div>
          ${waiting.length ? `
          <div class="waitline">
            <span class="wait-label">대기 ${waiting.length}명</span>
            ${waiting.map((r) => `<span class="wait-chip">${escapeHTML(r.name)}</span>`).join("")}
          </div>` : ""}
          ${mode === "local" ? `<p class="s-note">이 링크의 입금 완료 표시는 이 기기에만 저장되며 모임장에게 전달되지 않습니다. 입금 후 채팅으로 알려 주세요.</p>` : ""}
        </section>

        ${hasPayInfo ? `
        <section class="s-card card" aria-label="입금 정보">
          <h2>입금 정보</h2>
          <div class="deposit-rows">
            ${pay.bank.trim() ? `<div class="deposit-row"><span>은행</span><b>${escapeHTML(pay.bank.trim())}</b></div>` : ""}
            ${pay.account.trim() ? `<div class="deposit-row"><span>계좌번호</span><b>${escapeHTML(pay.account.trim())}</b></div>` : ""}
            ${pay.holder.trim() ? `<div class="deposit-row"><span>예금주</span><b>${escapeHTML(pay.holder.trim())}</b></div>` : ""}
          </div>
          ${pay.kakao ? `<span class="kakao-badge"><svg class="ic is-sm" aria-hidden="true"><use href="#i-wallet"/></svg> 카카오페이 송금 가능</span>` : ""}
          ${accountLine ? `<div class="deposit-actions"><button id="copyAccountBtn" class="btn btn-secondary" type="button" data-account="${escapeHTML(accountLine)}">계좌 복사</button></div>` : ""}
          ${otherPayers.length ? `<p class="s-note">이 계좌는 ${escapeHTML(accountOwner)} 님 계좌입니다.
            ${escapeHTML(otherPayers.join(", "))} 님에게 보낼 금액은 계좌를 따로 확인해 주세요.</p>` : ""}
        </section>` : `
        <section class="s-card card" aria-label="입금 정보">
          <h2>입금 정보</h2>
          <p class="s-note" style="margin:0">이 정산에는 입금 계좌 정보가 없습니다. 모임장에게 계좌를 확인해 주세요.</p>
        </section>`}

        <section class="s-card card" aria-label="입금 명단">
          <h2>입금 명단</h2>
          ${waiting.length ? `<div class="m-group-head is-wait">대기 중 <b>${waiting.length}명</b><i></i></div>
          <div class="m-list">${waiting.map(memberRow).join("")}</div>` : ""}
          ${done.length ? `<div class="m-group-head is-done">${icon("checkCircle","is-sm")} 입금 완료 <b>${done.length}명</b><i></i></div>
          <div class="m-list">${done.map(memberRow).join("")}</div>` : ""}
          <p class="m-hint">입금한 뒤 내 이름 옆 입금 완료를 눌러 주세요.${mode === "live" ? " 모임장과 멤버 화면에 함께 반영됩니다." : ""}</p>
        </section>

        ${multiGroups ? `
        <section class="s-card card" aria-label="결제자별 정리">
          <h2>결제자별 송금 금액</h2>
          <div class="payer-rows">
            ${payload.groups.map((g) => `
            <div class="payer-row">
              <div><b>→ ${escapeHTML(g.payer)}에게</b><br /><small>${escapeHTML(g.rows.map((r) => r.name).join(", "))}</small></div>
              <strong>${formatWon(g.amount)}</strong>
            </div>`).join("")}
          </div>
        </section>` : ""}

        ${payload.adjustments.length ? `
        <section class="s-card card" aria-label="개인별 추가와 차감">
          <h2>개인별 추가와 차감</h2>
          <div class="adjlines">
            ${payload.adjustments.map((a) => `
            <div class="adjline">
              <span><b>${escapeHTML(a.name)}</b>${a.reason ? ` <small>${escapeHTML(a.reason)}</small>` : ""}<small class="adj-scope">${escapeHTML(a.roundLabel || "전체 차수")}</small>${a.applied ? "" : ` <small>(미반영)</small>`}</span>
              <strong class="${a.amount > 0 ? "is-plus" : "is-minus"}">${a.amount > 0 ? "+" : "−"}${Math.abs(a.amount).toLocaleString("ko-KR")}원</strong>
            </div>`).join("")}
          </div>
        </section>` : ""}

        ${payload.notices.length ? `
        <section class="s-card card" aria-label="안내 문구">
          <h2>안내</h2>
          <div class="notice-lines">${payload.notices.map((n) => `<div class="notice-line">${escapeHTML(n)}</div>`).join("")}</div>
        </section>` : ""}

        ${payload.receipts.length ? `
        <section class="s-card card" aria-label="영수증">
          <h2>영수증</h2>
          <div class="s-receipts">${payload.receipts.map((u) => `<img class="s-receipt" src="${u}" alt="영수증" loading="lazy" />`).join("")}</div>
        </section>` : ""}

        ${payload.rounds.length ? `
        <details class="s-details card"${detailsOpen ? " open" : ""}>
          <summary>차수별 내역 (${payload.rounds.length}건)</summary>
          <div class="s-details-body">
            ${detailHTML}
            ${payload.verifyText ? `<div class="verify-line"><b>합계 검증</b>${escapeHTML(payload.verifyText)}</div>` : ""}
          </div>
        </details>` : ""}

        <div class="s-promo">
          <a href="calculator.html">모임 정산 페이지에서 만든 정산서입니다.</a>
        </div>`;
      if (keep) {
        const el = keep[0] === "toggle"
          ? app.querySelector(`[data-toggle-name="${CSS.escape(keep[1])}"]`)
          : document.getElementById(keep[1]);
        if (el) el.focus({ preventScroll: true });
      }

      const details = app.querySelector(".s-details");
      if (details) details.addEventListener("toggle", () => { detailsOpen = details.open; });

      /* 완료 전환 감지 → 축하 연출 */
      if (wasComplete === null) {
        wasComplete = complete;   // 첫 렌더: 이미 완료 상태면 배너만 (컨페티 없이)
      } else if (complete && !wasComplete) {
        wasComplete = true;
        fireConfetti();
      } else {
        wasComplete = complete;
      }
    }

    /* ============================================================
       동작
       ============================================================ */
    async function handleTransfer(amount) {
      const bank = payload.pay.bank.trim();
      const digits = String(payload.pay.account || "").replace(/[^\d]/g, "");
      if (!bank || !digits) { showToast("입금 계좌 정보가 없습니다."); return; }
      if (isMobileUA()) {
        window.location.href = "supertoss://send?amount=" + amount + "&bank=" + encodeURIComponent(bank) + "&accountNo=" + digits;
        showToast("토스 앱을 엽니다. 열리지 않으면 계좌 복사를 이용해 주세요.");
      } else {
        const holder = payload.pay.holder.trim();
        const text = `${bank} ${payload.pay.account.trim()}${holder ? ` (${holder})` : ""} ${formatWon(amount)}`;
        const ok = await copyToClipboard(text);
        showToast(ok ? "계좌와 금액을 복사했습니다." : "복사에 실패했습니다. 다시 시도해 주세요.");
      }
    }

    function rememberMe(name) {
      if (myName) return;
      myName = name;
      try { localStorage.setItem(MYNAME_KEY, name); } catch (e) {}
    }

    async function togglePaid(name) {
      const row = payload.rows.find((r) => r.name === name);
      if (!row) return;
      const next = !paid[name];
      if (next) rememberMe(name);

      if (mode === "local") {
        if (next) paid[name] = true; else delete paid[name];
        persistLocalPaid();
        renderView();
        showToast(next ? "입금 완료로 표시했습니다. 이 기기에서만 보입니다." : "입금 완료 표시를 해제했습니다.");
        return;
      }

      // live: 낙관적 UI → 실패 시 롤백. 같은 이름의 요청이 끝나기 전에는 다시 누를 수 없다(두 번 누르면 켜졌다 꺼지는 것을 막는다)
      if (inflightNames.has(name)) return;
      inflightNames.add(name);
      const prev = !!paid[name];
      if (next) paid[name] = true; else delete paid[name];
      renderView();
      pendingOps += 1;
      try {
        const res = await supaFetch("/rest/v1/rpc/settle_set_paid", {
          method: "POST",
          body: JSON.stringify({ p_id: settleId, p_name: name, p_paid: next })
        });
        if (res && res.paid && typeof res.paid === "object") { paid = res.paid; renderView(); }
        showToast(next ? "입금 완료로 표시했습니다. 모임장 화면에도 반영됩니다." : "입금 완료 표시를 해제했습니다. 모임장 화면에도 반영됩니다.");
      } catch (err) {
        if (prev) paid[name] = true; else delete paid[name];
        renderView();
        const msg = String((err && err.message) || "");
        showToast(msg.indexOf("NOT_FOUND") >= 0
          ? "정산을 찾을 수 없습니다. 모임장에게 새 링크를 요청해 주세요."
          : (msg.indexOf("NOT_IN_LIST") >= 0 || msg.indexOf("BAD_NAME") >= 0)
            ? "이 이름은 지금 입금 명단에 없습니다. 모임장이 정산을 다시 저장했을 수 있으니 새 링크를 요청해 주세요."
            : "입금 완료 표시에 실패했습니다. 잠시 후 다시 시도해 주세요.");
      } finally {
        pendingOps -= 1;
        inflightNames.delete(name);
      }
    }
    var inflightNames = new Set();

    async function loadLive(isInitial) {
      try {
        const data = await supaFetch("/rest/v1/rpc/settle_get", {
          method: "POST",
          body: JSON.stringify({ p_id: settleId })
        });
        if (!data) { stopPolling(); renderError("notfound"); return; }
        const normalized = normalizePayload(data.payload);
        if (!normalized) { stopPolling(); renderError("notfound"); return; }
        payload = normalized;
        if (pendingOps === 0) paid = (data.paid && typeof data.paid === "object") ? data.paid : {};
        const sig = JSON.stringify({ p: payload, d: paid });
        if (isInitial || sig !== lastLiveSig) renderView();
        lastLiveSig = sig;
        startPolling();
      } catch (err) {
        if (isInitial) renderError(err && err.status === 404 ? "notfound" : "network");
        // 폴링 중 일시 오류는 조용히 다음 주기에 재시도
      }
    }

    function startPolling() {
      if (pollTimer || mode !== "live") return;
      pollTimer = setInterval(() => {
        if (document.hidden || pendingOps > 0) return;
        loadLive(false);
      }, POLL_MS);
    }
    function stopPolling() { clearInterval(pollTimer); pollTimer = null; }

    app.addEventListener("click", async (e) => {
      const toggle = e.target.closest("[data-toggle-name]");
      if (toggle) { togglePaid(toggle.dataset.toggleName); return; }
      const send = e.target.closest("[data-send-amount]");
      if (send) { handleTransfer(Number(send.dataset.sendAmount) || 0); return; }
      const copyAcct = e.target.closest("#copyAccountBtn");
      if (copyAcct) {
        const ok = await copyToClipboard(copyAcct.dataset.account || "");
        showToast(ok ? "계좌를 복사했습니다." : "복사에 실패했습니다. 다시 시도해 주세요.");
        return;
      }
      const retry = e.target.closest("#retryBtn");
      if (retry) { renderLoading(); loadLive(true); }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && mode === "live" && payload && pendingOps === 0) loadLive(false);
    });

    /* ── 시작 ── */
    if (mode === "live") {
      renderLoading();
      loadLive(true);
    } else if (mode === "local") {
      try {
        const decoded = normalizePayload(b64urlDecode(hashRaw));
        if (!decoded) throw new Error("bad payload");
        payload = decoded;
        localKey = hashStr(hashRaw);
        paid = loadLocalPaid();
        renderView();
      } catch (e) {
        renderError("notfound");
      }
    } else {
      renderError("notfound");
    }
  </script>
</body>
</html>
