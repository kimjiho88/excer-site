<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>OG — 이용 안내 (1200 × 630 으로 캡처해 assets/og-guide.jpg)</title>
  <!-- 탭별 공유 미리보기 원본. assets/img/src/og.html 과 같은 틀에서 오른쪽 그림과 문구만 다르다. scratchpad/mkog2.js 로 캡처. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #F7F5EF; color: #241E2C;
           font-family: Pretendard, "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
    .wrap { box-sizing: border-box; width: 1200px; height: 630px; padding: 48px 120px;
            display: grid; grid-template-columns: minmax(0, 1fr) 427px; column-gap: 40px; align-items: center; }
    .kicker { margin: 0 0 12px; color: #625A6C; font-size: 24px; font-weight: 600; letter-spacing: 0.02em; }
    .brand { margin: 0; color: #4B2A82; font-size: 92px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
    .sub { margin: 26px 0 0; font-size: 32px; line-height: 1.45; font-weight: 500; }
    .feat { margin: 34px 0 0; color: #625A6C; font-size: 22px; font-weight: 600; }
    .feat b { color: #4B2A82; font-weight: 700; }
    img.cover { display: block; width: 427px; height: 534px; border-radius: 18px; object-fit: cover; }
    /* 스팟은 크림 배경으로 생성돼 있어 같은 색 타일 안에 */
    img.spot { display: block; width: 427px; height: 427px; border-radius: 40px; background: #F7F6F2; object-fit: cover; box-shadow: 0 30px 60px -36px rgba(46, 27, 69, 0.5), inset 0 0 0 2px rgba(75, 42, 130, 0.10); }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <p class="kicker">동네친구들 · 오픈채팅 커뮤니티</p>
      <h1 class="brand">이용 안내</h1>
      <p class="sub">처음 2주 동안 할 일, 닉네임 양식,<br />모임 참여와 정산을 정리했습니다.</p>
      <p class="feat"><b>처음 2주</b> · <b>닉네임 양식</b> · <b>정산 절차</b></p>
    </div>
    <img class="cover" src="guide-banner.webp" alt="" />
  </div>
</body>
</html>
