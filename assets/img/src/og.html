<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>OG 이미지 원본 — 홈 (1200 × 630 으로 캡처해 assets/og.jpg)</title>
  <!-- 공유 미리보기(OG) 이미지의 원본 — 홈. 8차 전면 커버와 같은 모양(가을 그림이 카드를 채우고 글은 그 위에). 계절을 바꾸면 그림 파일과 알약 문구를 함께 바꾼다(홈 계절 블록과 같게).
       1200 × 630, 배율 1 로 캡처해 JPG 로 저장(scratchpad/mkog3.js — 글꼴·그림·글자 범위 10~90%·크기·흰 글자 대비를 함께 잰다).
       글자는 가로 10%~90% 안(카카오톡 미리보기가 좌우를 조금 자를 수 있어서). 색·그라데이션은 assets/site.css 의 .cover 와 같다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; color: #fff; background: linear-gradient(135deg, #2E1B52 0%, #4B2A82 55%, #6D4AAE 100%);
           font-family: Pretendard, "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
    .kicker { display: inline-flex; align-items: center; margin: 0; height: 42px; padding: 0 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.34); font-size: 22px; font-weight: 700; letter-spacing: 0.01em; }
    .brand { margin: 18px 0 0; font-size: 88px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; text-shadow: 0 2px 18px rgba(36, 22, 60, 0.55); }
    .sub { margin: 16px 0 0; font-size: 30px; line-height: 1.4; font-weight: 500; color: rgba(255, 255, 255, 0.92); text-shadow: 0 1px 10px rgba(36, 22, 60, 0.55); }
    .feat { margin: 22px 0 0; font-size: 21px; font-weight: 600; color: rgba(255, 255, 255, 0.8); }
    .feat b { font-weight: 800; color: #fff; }
    /* 사이트의 전면 커버(.cover)와 같은 구성 — 그림이 카드를 채우고, 아래 42% 부터 짙어지는 보라 그라데이션 위에 흰 글자 */
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; }
    .bg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 42%; }
    .shade { position: absolute; inset: 0;
      background: radial-gradient(ellipse 140% 110% at 0% 100%, rgba(36, 22, 60, 0.90) 0%, rgba(36, 22, 60, 0.82) 30%, rgba(36, 22, 60, 0.55) 50%, rgba(36, 22, 60, 0) 72%),
                  linear-gradient(180deg, rgba(36, 22, 60, 0.08) 0%, rgba(36, 22, 60, 0.16) 40%, rgba(36, 22, 60, 0.42) 50%, rgba(36, 22, 60, 0.74) 58%, rgba(36, 22, 60, 0.88) 68%, rgba(36, 22, 60, 0.94) 100%); }
    .text { position: absolute; left: 120px; right: 120px; bottom: 60px; }
  </style>
</head>
<body>
  <div class="card">
    <img class="bg" src="autumn-desktop.webp" alt="" />
    <div class="shade"></div>
    <div class="text">
      <p class="kicker">오픈채팅 커뮤니티 · 2026 가을</p>
      <h1 class="brand">동네친구들</h1>
      <p class="sub">밥 한 끼부터 주말 나들이까지, 동네친구들과 함께합니다.</p>
      <p class="feat"><b>모임 정산</b> · <b>소식</b> · <b>맛집</b> · <b>활동 통계</b></p>
    </div>
  </div>
</body>
</html>
