<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>OG 이미지 원본 — 1200 × 630 으로 캡처해 assets/og.jpg 로 저장</title>
  <!-- 공유 미리보기(OG) 이미지의 원본. 이 페이지를 1200 × 630, 배율 1 로 캡처해 JPG(품질 92)로 저장한 것이 assets/og.jpg 다.
       PNG 는 534 KB 로 500 KB 기준을 넘어 JPG 로 둔다.
       문구는 홈의 계절 블록과 같게 유지한다. 그림은 홈 모바일용 세로형(4:5)을 그대로 쓴다 — 다섯 사람이 다 들어가고 잘리지 않는다.
       글자는 가로 10%~90% 안(카카오톡 미리보기가 좌우를 조금 자를 수 있어서). 색은 사이트 토큰과 같다. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css" />
  <style>
    html, body { margin: 0; }
    body { width: 1200px; height: 630px; overflow: hidden; background: #F7F5EF; color: #242824;
           font-family: Pretendard, "Pretendard Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
    .wrap { box-sizing: border-box; width: 1200px; height: 630px; padding: 48px 120px;
            display: grid; grid-template-columns: minmax(0, 1fr) 427px; column-gap: 40px; align-items: center; }
    .kicker { margin: 0 0 12px; color: #626B63; font-size: 24px; font-weight: 600; letter-spacing: 0.02em; }
    .brand { margin: 0; color: #285244; font-size: 92px; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; }
    .sub { margin: 26px 0 0; font-size: 32px; line-height: 1.45; font-weight: 500; }
    .feat { margin: 34px 0 0; color: #626B63; font-size: 22px; font-weight: 600; }
    .feat b { color: #285244; font-weight: 700; }
    img { display: block; width: 427px; height: 534px; border-radius: 18px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="wrap">
    <div>
      <p class="kicker">오픈채팅 커뮤니티</p>
      <h1 class="brand">동네친구들</h1>
      <p class="sub">밥 한 끼부터 주말 나들이까지,<br />동네친구들과 함께합니다.</p>
      <p class="feat"><b>모임 정산</b> · <b>소식</b> · <b>맛집</b></p>
    </div>
    <img src="autumn-mobile.webp" alt="" />
  </div>
</body>
</html>
